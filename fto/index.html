<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTO 教程</title>
<link rel="stylesheet" href="/assets/css/site-nav.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site-layout.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    line-height: 1.6;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(rgba(96,165,250,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96,165,250,0.06) 1px, transparent 1px),
      linear-gradient(135deg, rgba(96,165,250,0.04) 0%, transparent 40%, transparent 60%, rgba(244,114,182,0.04) 100%),
      linear-gradient(225deg, rgba(244,114,182,0.03) 0%, transparent 50%, transparent 70%, rgba(96,165,250,0.03) 100%),
      radial-gradient(ellipse at 20% 20%, rgba(96,165,250,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.06) 0%, transparent 50%);
    background-size:
      80px 80px,
      80px 80px,
      100% 100%,
      100% 100%,
      100% 100%,
      100% 100%;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  header {
    text-align: center;
    padding: 48px 0 28px;
  }

  header h1 {
    font-size: 2.2rem;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--fg), var(--brand));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    margin-top: 8px;
    color: var(--fg-2);
    font-size: 1rem;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(24, 24, 32, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 32px 20px;
    text-decoration: none;
    backdrop-filter: blur(12px);
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
  }

  .card:hover {
    border-color: rgba(147, 197, 253, 0.3);
    transform: translateY(-2px);
    background: rgba(32, 32, 44, 0.9);
  }

  .card-icon {
    font-size: 2.4rem;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--fg);
  }

  .card-desc {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--fg-2);
    text-align: center;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--fg-3);
    font-size: 0.85rem;
  }

  /* 移动端适配 */
  @media (max-width: 640px) {
    header { padding: 28px 0 20px; }
    header h1 { font-size: 1.6rem; }
    .subtitle { font-size: 0.85rem; }
    .container { padding: 12px 14px 48px; }
    .card-grid { grid-template-columns: 1fr; gap: 12px; }
    .card { padding: 26px 16px; }
    .card-icon { font-size: 2.1rem; margin-bottom: 8px; }
    .card-title { font-size: 1.15rem; }
  }
</style>
</head>
<body data-nav="fto">
<div data-site-nav></div>
<noscript><a href="/" style="display:block;padding:12px 20px">← 返回首页</a></noscript>

<div class="container">
  <header>
    <h1>FTO 教程</h1>
    <p class="subtitle">Face-Turning Octahedron · 转面八面体</p>
  </header>

  <div class="card-grid">
    <a class="card card--link" href="/fto/tcp">
      <div class="card-icon">&#x1F9E9;</div>
      <div class="card-title">TCP</div>
      <div class="card-desc">Triplet Center Pairing<br>三组中心配对</div>
    </a>
    <a class="card card--link" href="/fto/l3t">
      <div class="card-icon">&#x1F9E9;</div>
      <div class="card-title">L3T</div>
      <div class="card-desc">3-Look Last Three Triplets<br>最后三组三看解法</div>
    </a>
    <a class="card card--link" href="/fto/lbt">
      <div class="card-icon">&#x1F9E9;</div>
      <div class="card-title">LBT</div>
      <div class="card-desc">Last Bottom Triplets<br>底层最后三组</div>
    </a>
  </div>

  <footer class="site-footer">
  <p class="site-footer__title">魔方先生SSR魔方训练中心</p>
  <p class="site-footer__meta">制作人：B站博主：魔方先生SSR　WCAID : 2009ZHAN24　抖音ID : 魔方总动员</p>
  <p class="site-footer__meta">&copy; 2026 mrcubessr</p>
</footer>
</div>
<script src="/assets/js/site-nav.js"></script>
</body>
</html>
