<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线 · 魔方计时器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1118; color: #e6edf3; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .card { text-align: center; padding: 32px 24px; max-width: 420px; }
  .logo { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #9aa7b4; line-height: 1.6; margin: 6px 0; font-size: 14px; }
  button {
    margin-top: 18px; padding: 10px 22px; border: 0; border-radius: 8px; cursor: pointer;
    background: #3b6fd4; color: #fff; font-size: 15px;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/icons/icon-192.png" alt="魔方计时器">
    <h1>当前处于离线状态</h1>
    <p>计时器本体已缓存在本机，恢复网络后回到 <a href="/tools/timer/" style="color:#93c5fd">计时器页面</a> 即可正常使用。</p>
    <p>成绩始终保存在本机浏览器，不会因离线丢失。</p>
    <button onclick="location.reload()">重试</button>
  </div>
</body>
</html>
