  .tab-btn {

    font-size: 15px;
    font-family: inherit;
    color: #888;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
  }
  .tab-btn.active { color: #2E5E8E; border-bottom-color: #2E5E8E; font-weight: bold; }

  .toolbar {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: #2E5E8E; color: white; }
  .btn-primary:hover { background: #1e4070; }
  .btn-secondary { background: #e8eef5; color: #2E5E8E; border: 1.5px solid #2E5E8E; }
  .btn-secondary:hover { background: #d0dff0; }

  .stats { text-align: center; font-size: 13px; color: #888; margin-bottom: 16px; }

  .paper {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 32px 36px;
  }

  .paper-title { text-align: center; margin-bottom: 20px; }
  .paper-title h2 { font-size: 20px; color: #2E5E8E; margin-bottom: 4px; }
  .paper-title .subtitle { font-size: 13px; color: #888; margin-bottom: 8px; }
  .paper-title .info { font-size: 13px; color: #aaa; }

  /* ===== 练习题模式 ===== */
  .quiz-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 24px;
  }
  .quiz-col { display: flex; flex-direction: column; gap: 8px; }
  .quiz-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px dashed #e0e0e0;
  }
  .quiz-num { font-size: 12px; color: #aaa; min-width: 26px; }
  .quiz-code { font-size: 17px; font-weight: bold; color: #2E5E8E; min-width: 42px; }
  .quiz-line { flex: 1; border-bottom: 1px solid #555; height: 1px; margin-top: 2px; }

  /* ===== 字母组模式：4行×5列网格，每格一个组 ===== */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, auto);
    gap: 12px;
  }
  
  .group-box {
    border: 1.5px solid #2E5E8E;
    border-radius: 4px;
    overflow: hidden;
  }
  
  .group-box-header {
    background: #2E5E8E;
    color: white;
    text-align: center;
    padding: 6px 4px;
    font-size: 13px;
    font-weight: bold;
  }
  
  .group-box-letters {
    display: flex;
    justify-content: space-around;
    padding: 10px 4px;
    background: white;
  }
  
  .group-box-letters span {
    font-size: 15px;
    font-weight: bold;
    color: #222;
  }

  .btn-group-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  @media print {
    @page { size: A4 portrait; margin: 15mm 12mm; }
    body { background: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .container { max-width: 100%; }
    .toolbar, .stats, .tabs, .btn-group-row { display: none !important; }
    .paper { box-shadow: none; border-radius: 0; padding: 0; }
    .paper-title { margin-bottom: 16px; }

    .groups-grid { gap: 10px; }

const CODES = Object.keys(WORDS).filter(k => k[0] !== k[1]);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== 练习题模式 =====
function generate() {
  const picked = shuffle(CODES).slice(0, 20);
  const left = picked.slice(0, 10);
  const right = picked.slice(10);
  document.getElementById('quizGrid').innerHTML =
    '<div class="quiz-col">' + left.map((code, i) => `
      <div class="quiz-item">
        <span class="quiz-num">${i+1}.</span>
        <span class="quiz-code">${code}</span>
        <span class="quiz-line"></span>
      </div>`).join('') + '</div>' +
    '<div class="quiz-col">' + right.map((code, i) => `
      <div class="quiz-item">
        <span class="quiz-num">${i+11}.</span>
        <span class="quiz-code">${code}</span>
        <span class="quiz-line"></span>
      </div>`).join('') + '</div>';
  document.getElementById('stats').textContent = `练习题模式 · 20题 · 共 ${CODES.length} 个联想词可选`;
}

// ===== 字母组模式：4行×5列网格，每格一个组 =====
function generateGroups() {
  const shuffled = shuffle(CODES);
  const groups = [];
  for (let i = 0; i < 20; i++) {
    groups.push(shuffled.slice(i * 6, i * 6 + 6));
  }

  let html = '';
  for (let g = 0; g < 20; g++) {
    html += '<div class="group-box">';
    html += `<div class="group-box-header">第${String(g + 1).padStart(2, '0')}组</div>`;
    html += '<div class="group-box-letters">';
    for (let k = 0; k < 6; k++) {
      html += `<span>${groups[g][k]}</span>`;
    }
    html += '</div></div>';
  }
  document.getElementById('groupsContainer').innerHTML = html;

  document.getElementById('stats').textContent = `字母组模式 · 20组×6个 · 共 ${CODES.length} 个联想词可选`;
}

// ===== 切换标签 =====
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function printPaper() { window.print(); }

// 初始化
