  .top-nav {

    justify-content: center;

    padding: 0 16px;

    color: #d7dce6;

    padding: 6px 16px;

    padding: 6px 4px 6px 10px;
    letter-spacing: 0.08em;
    user-select: none;
    align-self: center;
  }

    color: #6b7280;
    border-style: dashed;
    background: transparent;

    color: #6b7280;

    margin-bottom: 10px;

    font-size: 0.85rem;
    color: #c9d4e8;

  .copy-btn {

const GROUPS = ["全部", "Free Pairs", "Disconnected Pairs", "Connected Pairs", "Corner In Slot", "Edge In Slot", "Pieces In Slot"];
let currentGroup = "全部";
let searchText = "";

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function copyAlg(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "已复制";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("ok"); }, 1200);
  });
}

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = GROUPS.map(g =>
    `<span class="chip${g === currentGroup ? " active" : ""}" onclick="setGroup('${g}')">${g}</span>`
  ).join("");
}

function setGroup(g) {
  currentGroup = g;
  renderChips();
  render();
}

function render() {
  const kw = searchText.toLowerCase();
  const list = F2L_DATA.filter(c => {
    if (currentGroup !== "全部" && c.group !== currentGroup) return false;
    if (!kw) return true;
    if (c.name.toLowerCase().includes(kw)) return true;
    return c.algs.some(a => a.toLowerCase().includes(kw));
  });
  document.getElementById("stats").textContent =
    `显示 ${list.length} / ${F2L_DATA.length} 个 Case，${list.reduce((s,c) => s + c.algs.length, 0)} 条公式`;
  const grid = document.getElementById("grid");
  if (!list.length) {
    grid.innerHTML = `<div class="empty">未找到匹配的 Case</div>`;
    return;
  }
  grid.innerHTML = list.map(c => {
    const algs = c.algs.map((a, i) =>
      `<div class="alg-row"><span class="idx">${i + 1}</span><span>${esc(a)}</span>` +
      `<button class="copy-btn" onclick="copyAlg(this, '${esc(a).replace(/'/g, "\\'")}')">复制</button></div>`
    ).join("");
    return `<div class="card">
      <div class="card-head">
        <span class="card-name">${esc(c.name)}</span>
        <span class="card-group">${esc(c.group)}</span>
      </div>
      <div class="cube-wrap">${c.image}</div>
      <div class="alg-list">${algs}</div>
    </div>`;
  }).join("");
}

document.getElementById("search").addEventListener("input", e => {
  searchText = e.target.value.trim();
  render();
});

renderChips();
render();
</script>
</body>
</html>
