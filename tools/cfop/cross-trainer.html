<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="/assets/js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross Trainer · 十字训练 · 魔方先生SSR训练中心</title>
<link rel="stylesheet" href="/assets/css/site-nav.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site-layout.css">
<link rel="stylesheet" href="/tools/cfop/css/cfop.css">
<style>
  /* 拿法朝向选择（页面私有，前缀 ct__） */
  .ct__orientpick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ct__orientpick .select { min-width: 96px; }
  .ct__orient-note { display: block; margin-top: 6px; font-size: 12px; color: var(--fg-3); line-height: 1.5; }
  .ct__sol-ori { margin-left: 6px; font-size: 12px; color: var(--fg-3); }
  .ct__sol-alt {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-2);
    font-size: 12px; color: var(--fg-3); line-height: 1.7; word-break: break-word;
  }
  .ct__sol-alt b { color: var(--fg-2); font-weight: 600; }
  @media (max-width: 640px) {
    .ct__orientpick { width: 100%; }
    .ct__orientpick .select { flex: 1 1 0; min-width: 0; }
  }
</style>
</head>
<body data-nav="3x3" class="ct-page">
<div data-site-nav></div>
<noscript><a href="/" style="display:block;padding:12px 20px">← 返回首页</a></noscript>
<div class="cfop-wrap">
  <div class="cfop-hero">
    <div>
      <h1 class="cfop-hero__title">Cross Trainer · 十字训练</h1>
      <p class="cfop-hero__sub">选定十字颜色与目标步数，生成十字最优解恰为该步数的打乱（≤ 10 步）· 复刻自 speedcubedb.com/cross</p>
    </div>
    <div class="cfop-hero__spacer">
      <a class="btn btn--sm btn--ghost" href="/tools/3x3/">← 三阶</a>
      <button id="themeBtn" class="btn btn--sm">☀ 浅色</button>
    </div>
  </div>

  <div class="ct">
    <div class="ct__main">
      <div class="ct__panel">
        <div class="ct__field">
          <span class="ct__label">十字颜色</span>
          <div class="seg ct__seg" id="ct-colors" role="group" aria-label="选择十字颜色"></div>
        </div>
        <div class="ct__field">
          <span class="ct__label">目标步数</span>
          <div class="seg ct__seg" id="ct-moves" role="group" aria-label="选择十字最优步数"></div>
        </div>
        <div class="ct__field">
          <span class="ct__label">拿法朝向</span>
          <div class="ct__orientpick">
            <select class="select" id="ct-top" aria-label="顶面颜色"></select>
            <select class="select" id="ct-front" aria-label="前面颜色"></select>
          </div>
          <span class="ct__orient-note" id="ct-orient-note"></span>
        </div>
      </div>

      <div class="ct__scramble" id="ct-scramble">…</div>

      <div class="ct__solution" id="ct-solution" hidden>
        <span class="ct__sol-label">十字解法<span class="ct__sol-ori" id="ct-sol-ori"></span></span>
        <div class="formula-block ct__sol-text" id="ct-sol-text" title="点击复制"></div>
        <div class="ct__sol-alt" id="ct-sol-alt" hidden></div>
      </div>

      <div class="ct__row">
        <button class="btn btn--primary" id="ct-new">换一个打乱</button>
        <button class="btn btn--secondary" id="ct-sol" aria-pressed="false">显示十字解法</button>
        <button class="btn btn--ghost" id="ct-copy">复制</button>
        <button class="btn btn--ghost" id="ct-batch" aria-pressed="false">批量 10 个</button>
      </div>

      <div class="ct__batch" id="ct-batch-panel" hidden>
        <div class="ct__batch-head">
          <span class="ct__batch-title" id="ct-batch-title">已生成的打乱</span>
          <button class="btn btn--xs btn--ghost" id="ct-batch-refresh" type="button">重新生成</button>
        </div>
        <ol class="ct__batch-list" id="ct-batch-list"></ol>
      </div>

      <p class="ct__hint">按 <b>空格</b> 开始 / 暂停计时</p>
    </div>

    <div class="ct__side">
      <div class="ct__orient" id="ct-orient" role="note" aria-label="拿法朝向">
        <span class="ct__orient-title">拿法朝向</span>
        <span class="ct__orient-pill" id="ct-orient-pill">白顶 · 绿前</span>
      </div>
      <div class="ct__timer" id="ct-timer">0.00</div>
      <div class="ct__net" id="ct-net"></div>
    </div>
  </div>
</div>
<footer class="site-footer">
  <p class="site-footer__title">魔方先生SSR魔方训练中心</p>
  <p class="site-footer__meta">打乱与求解在本地完成（十字最优步数表实时计算）· 按「白顶绿前」标准朝向打乱</p>
</footer>
<script src="/assets/js/site-nav.js"></script>
<script src="/tools/cfop/js/cfop-ui.js"></script>
<script src="/tools/cfop/js/rubik-core.js"></script>
<script src="/tools/cfop/js/orient.js"></script>
<script src="/tools/cfop/js/cross-solver.js"></script>
<script src="/tools/cfop/js/cube-art.js"></script>
<script src="/tools/cfop/js/cross-trainer.js"></script>
<script>CFOP.bindTheme("themeBtn");</script>
</body>
</html>
