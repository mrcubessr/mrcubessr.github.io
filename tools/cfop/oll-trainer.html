<style>
  /* ===== 看板：横屏铺满，21 张大卡片（仿 UF440 形式，卡片更大、带预览图）===== */
  .oll-wrap { padding: 4px 0; width: 100%; box-sizing: border-box; }
  .oll-board {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; margin: 10px auto 18px; width: 100%; box-sizing: border-box;
  }
  .oll-card {
    position: relative;
    flex: 0 0 var(--oll-w, 160px);
    width: var(--oll-w, 160px);
    height: var(--oll-h, 210px);
    border-radius: 12px;
    border: 1px solid var(--line-2, rgba(255,255,255,.14));
    background: var(--surface-2, #1A2130);
    color: var(--fg, #EEF2F8);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 8px 10px;
    box-sizing: border-box; cursor: pointer; text-align: center;
    transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 220ms ease, color 220ms ease;
    overflow: hidden;
  }
  .oll-card:hover, .oll-card:focus-visible {
    transform: translateY(-3px);
    box-shadow: var(--sh-md, 0 8px 22px rgba(0,0,0,.4));
    border-color: var(--brand, #5B8DEF);
    outline: none;
  }
  /* 末行拉伸铺满（剩最后一行且不足整行时） */
  .oll-card.is-tail { flex-basis: var(--oll-tail, var(--oll-w, 160px)); width: var(--oll-tail, var(--oll-w, 160px)); }

  .oll-card__net {
    flex: 1 1 auto; min-height: 0; width: 100%; margin: 4px 0 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .oll-card__net .cfop-net { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
  .oll-card__name {
    flex: 0 0 auto;
    font-size: calc(var(--oll, 160px) * 0.18); line-height: 1; font-weight: 800;
    margin-top: 4px; letter-spacing: .5px;
  }
  .oll-card__sub {
    font-size: calc(var(--oll, 160px) * 0.085); color: var(--fg-3, #7C8798);
    margin-top: 3px; font-weight: 600;
  }
  .oll-card__alg {
    flex: 0 0 auto;
    font-family: var(--font-mono, "SF Mono", Consolas, monospace);
    font-size: calc(var(--oll, 160px) * 0.082); color: var(--fg-2, #AEB8CA);
    margin-top: 3px; line-height: 1.25; max-width: 96%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .oll-card__count {
    position: absolute; top: 7px; right: 8px;
    font-size: calc(var(--oll, 160px) * 0.085); font-weight: 700;
    color: var(--fg-3, #7C8798);
  }
  /* 换过公式：金边 + 右下角「换」徽标（与 440 一致） */
  .oll-card.is-swapped {
    border-color: var(--gold, #f5c518); border-width: 2px;
    box-shadow: inset 0 0 0 1px rgba(245,197,24,.55), 0 0 10px rgba(245,197,24,.3);
  }
  .oll-card .c-swap {
    position: absolute; right: 6px; bottom: 6px;
    font-size: calc(var(--oll, 160px) * 0.085); line-height: 1.3; font-weight: 800;
    color: #1a1400; background: var(--gold, #f5c518);
    border-radius: 4px; padding: 0 4px;
  }
  /* 已练卡片：按成绩快慢着色的成绩徽标（与 440 一致） */
  .oll-card__best {
    flex: 0 0 auto;
    margin-top: 5px; font-size: calc(var(--oll, 160px) * 0.095); font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: .2px;
    padding: 1px 9px; border-radius: 999px; background: rgba(0,0,0,.24);
  }
  .oll-card.has-data .oll-card__sub { color: inherit; opacity: .82; }
  .oll-card.has-data .oll-card__alg { color: inherit; opacity: .92; }
  .oll-card.has-data .oll-card__count { color: inherit; opacity: .82; }

  /* ===== 顶部：标题 / KPI / 控件 ===== */
  .oll-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 2px; }
  .oll-head h1 { font-size: 20px; margin: 0; }
  .oll-head .sub { color: var(--fg-3, #7C8798); font-size: 13px; }
  .oll-kpis { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .oll-kpi {
    flex: 1 1 140px; border: 1px solid var(--line, rgba(255,255,255,.08));
    border-radius: 12px; padding: 10px 14px;
    background: var(--surface, #141826); color: var(--fg, #EEF2F8);
  }
  .oll-kpi .k-label { color: var(--fg-2, #AEB8CA); font-size: 12px; }
  .oll-kpi .k-value { font-size: 22px; font-weight: 700; }
  .oll-controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 10px 0 4px; }
  .oll-controls label { color: var(--fg-2, #AEB8CA); font-size: 13px; margin-right: 6px; font-weight: 500; }
  .oll-controls select {
    padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line-2, rgba(255,255,255,.18));
    background: var(--surface-2, #1A2130); color: var(--fg, #EEF2F8);
    font-size: 13px; font-weight: 500; cursor: pointer;
  }

  /* ===== 弹层导航栏（移植自 UF440：← → 切换 + 公式下拉 + 方向旋转） ===== */
  .oll-modal__bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .oll-navbtn {
    width: 34px; height: 34px; flex: 0 0 auto; border-radius: 8px;
    border: 1px solid var(--line-2, rgba(255,255,255,.18));
    background: var(--surface-2, #1A2130); color: var(--fg-2, #AEB8CA);
    font-size: 16px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .oll-navbtn:hover { border-color: var(--brand, #5B8DEF); color: var(--fg, #EEF2F8); }
  .oll-modal__select {
    flex: 1 1 120px; min-width: 0; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line-2, rgba(255,255,255,.18));
    background: var(--surface-2, #1A2130); color: var(--fg, #EEF2F8);
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .oll-modal__select:focus { outline: 2px solid var(--brand, #5B8DEF); outline-offset: 1px; }
  .oll-modal__select optgroup { background: var(--surface, #141826); color: var(--fg-2, #AEB8CA); }
  .oll-modal__select option { background: var(--surface, #141826); color: var(--fg, #EEF2F8); }
  .oll-modal__spacer { flex: 1 1 auto; }
  .oll-rot { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .oll-rot__label {
    min-width: 40px; text-align: center; font-size: 12px; font-weight: 800;
    color: var(--fg-2, #AEB8CA); font-variant-numeric: tabular-nums;
  }
  .oll-modal__hint { font-size: 11px; color: var(--fg-3, #7d8899); white-space: nowrap; }
  .oll-modal__auf { font-size: 12px; font-weight: 700; }
  @media (max-width: 640px) {
    .oll-modal__hint { display: none; }
    .oll-modal__net .cfop-net { width: 150px; height: 150px; }
  }

  /* ===== 练习弹层 ===== */
  .oll-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .oll-modal[hidden] { display: none; }
  .oll-modal__backdrop { position: absolute; inset: 0; background: rgba(4,7,14,.72); backdrop-filter: blur(2px); }
  .oll-modal__panel {
    position: relative; width: min(560px, 92vw); max-height: 92vh; overflow: auto;
    background: var(--surface, #141826); border: 1px solid var(--line-2, rgba(255,255,255,.16));
    border-radius: 16px; padding: 18px 20px 20px; color: var(--fg, #EEF2F8);
    box-shadow: var(--sh-lg, 0 20px 60px rgba(0,0,0,.5));
  }
  .oll-modal__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .oll-modal__title { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .oll-modal__close { background: transparent; border: 1px solid var(--line-2, rgba(255,255,255,.18)); color: var(--fg-2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; }
  .oll-modal__body { display: flex; gap: 18px; margin-top: 14px; align-items: flex-start; flex-wrap: wrap; }
  .oll-modal__net { flex: 1 1 200px; display: flex; align-items: center; justify-content: center; }
  .oll-modal__net .cfop-net { width: 200px; height: 200px; }
  .oll-modal__algs { flex: 1 1 240px; min-width: 220px; }
  .oll-modal__algs h4 { margin: 0 0 8px; font-size: 14px; color: var(--fg-2); }
  .oll-alg { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line-2, rgba(255,255,255,.12)); border-radius: 8px; margin-bottom: 7px; font-family: var(--font-mono, Consolas, monospace); font-size: 13px; }
  .oll-alg code { flex: 1; cursor: pointer; word-break: break-all; }
  .oll-alg .cpy { font-size: 11px; color: var(--brand, #5B8DEF); cursor: pointer; border: none; background: none; }
  .oll-modal__timer { margin-top: 16px; text-align: center; }
  .oll-timer-display {
    width: 100%; box-sizing: border-box;
    font-family: var(--font-mono, monospace);
    font-size: 64px; font-weight: 900; line-height: 1;
    padding: 20px 0; border-radius: 12px;
    background: #1e293b; color: #f8fafc;
    cursor: pointer; user-select: none; letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    transition: background 150ms ease, color 150ms ease;
    border: 1px solid var(--line-2, rgba(255,255,255,.18));
    font-variant-numeric: tabular-nums;
  }
  .oll-timer-display[data-state="prep"] {
    background: linear-gradient(135deg,#dc2626 0%,#991b1b 100%); color:#fff;
    border-color:#991b1b; animation: oll-prep-pulse 1s ease-in-out infinite;
  }
  .oll-timer-display[data-state="green"] {
    background: linear-gradient(135deg,#16a34a 0%,#15803d 100%); color:#fff; border-color:#15803d;
  }
  .oll-timer-display[data-state="running"] {
    background: linear-gradient(135deg,#f59e0b 0%,#ea580c 100%); color:#fff; border-color:#ea580c;
  }
  .oll-timer-display[data-state="done"] {
    background: linear-gradient(135deg,#16a34a 0%,#15803d 100%); color:#fff; border-color:#15803d;
  }
  @keyframes oll-prep-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.55); }
    50%     { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
  }
  .oll-timer-hint { color: var(--fg-3); font-size: 12px; margin-top: 6px; }
  .oll-modal__stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .oll-stat { background: var(--surface-2, #1A2130); border: 1px solid var(--line-2, rgba(255,255,255,.12)); border-radius: 10px; padding: 6px 14px; text-align: center; min-width: 66px; }
  .oll-stat .l { font-size: 11px; color: var(--fg-3); }
  .oll-stat .v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .oll-stat-hist { flex-basis: 100%; text-align: center; font-size: 12px; color: var(--fg-3); margin-top: 4px; }
  .oll-stat-hist span { display: inline-block; margin: 0 3px; font-variant-numeric: tabular-nums; }
  .oll-modal__foot { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .oll-empty { text-align: center; color: var(--fg-3); padding: 40px 0; }
  @media (max-width: 640px) {
    .oll-modal__net .cfop-net { width: 150px; height: 150px; }
    .oll-timer-display { font-size: 52px; padding: 16px 0; }
  }
</style>

    {"id": "OLL 57", "sub": "All Corners Oriented", "subName": "All Corners Oriented", "facelets": {"data-us": "ylyyyyyly", "data-ub": "lylbbbbbb", "data-uf": "lylgggggg", "data-ul": "lllrrrrrr", "data-ur": "llloooooo"}, "algs": ["R U R' U' M' U R U' r'", "y R U' R' S' R U R' S", "y R U R' S' R U' R' S", "R U R' U' R' r U R U' r'"]}
  ];

  /* ============ 2) 本地进度（练习次数 / 换公式标记） ============ */
  var LS_COUNT = "oll_practice_counts";
  var LS_SWAP  = "oll_swaps";
  var LS_TIMES = "oll_times";   // { id: [秒, 秒, ...] }  每次练习记一条单次成绩
  function loadMap(k) { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
  function saveMap(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var counts = loadMap(LS_COUNT);
  var swaps  = loadMap(LS_SWAP);
  var times  = loadMap(LS_TIMES);

  // 单公式成绩统计：n=练的次数，best=最快单次，last=最近一次
  function statsOf(id) {
    var arr = times[id] || [];
    if (!arr.length) return { n: 0, best: NaN, last: NaN };
    var best = arr[0];
    for (var i = 1; i < arr.length; i++) if (arr[i] < best) best = arr[i];
    return { n: arr.length, best: best, last: arr[arr.length - 1] };
  }

  // 与 UF440 一致的多段配色：r 越小=越快=越绿，r 越大=越慢=越红
  function colorByRatio(r, range) {
    if (!isFinite(r)) return null;
    var lo = (range && isFinite(range.lo)) ? range.lo : 0.55;
    var hi = (range && isFinite(range.hi)) ? range.hi : 1.45;
    var t = Math.max(0, Math.min(1, (r - lo) / (hi - lo)));
    var stops = [
      { at: 0.00, c: [22, 163, 74] },   // 深绿
      { at: 0.25, c: [74, 222, 128] },  // 亮绿
      { at: 0.40, c: [132, 204, 22] },  // 黄绿
      { at: 0.55, c: [250, 204, 21] },  // 黄
      { at: 0.70, c: [251, 146, 60] },  // 橙
      { at: 0.85, c: [220, 38, 38] },   // 红
      { at: 1.00, c: [127, 29, 29] }    // 深红
    ];
    var i = 0;
    while (i < stops.length - 1 && t > stops[i + 1].at) i++;
    var s0 = stops[i], s1 = stops[Math.min(i + 1, stops.length - 1)];
    var local = s1.at === s0.at ? 0 : (t - s0.at) / (s1.at - s0.at);
    var rgbv = [0, 1, 2].map(function (k) { return Math.round(s0.c[k] + (s1.c[k] - s0.c[k]) * local); });
    var bg = 'rgb(' + rgbv.join(',') + ')';
    var lum = (0.299 * rgbv[0] + 0.587 * rgbv[1] + 0.114 * rgbv[2]) / 255;
    var fg = lum > 0.62 ? '#1f2937' : '#ffffff';
    var tier = r <= 0.85 ? 't-great' : r <= 1.00 ? 't-good' : r <= 1.15 ? 't-warn' : 't-bad';
    return { bg: bg, fg: fg, tier: tier, r: r };
  }

  // 自适应基准：bench=已练公式 best 的中位数；range 取 r 的 5%/95% 分位，让色彩铺满整条色带
  function colorPlan() {
    var bests = OLL.map(function (c) { return statsOf(c.id).best; }).filter(isFinite).sort(function (a, b) { return a - b; });
    if (!bests.length) return { bench: NaN, range: { lo: 0.55, hi: 1.45 } };
    var bench = bests[Math.floor(bests.length / 2)] || bests[0];
    var rs = bests.map(function (b) { return b / bench; }).sort(function (a, b) { return a - b; });
    var lo = rs[Math.max(0, Math.floor(rs.length * 0.05))];
    var hi = rs[Math.min(rs.length - 1, Math.floor(rs.length * 0.95))];
    if (!(hi > lo)) hi = lo * 1.6 + 0.05;
    return { bench: bench, range: { lo: lo, hi: hi } };
  }

  /* ============ 3) 渲染看板 ============ */
  var board = document.getElementById("oll-board");
  var sortSel = document.getElementById("oll-sort");
  var filterSel = document.getElementById("oll-filter");

  var SUB_GROUPS = ["Dot Case", "Square Shapes", "Lightning Shapes", "Fish Shapes", "Knight Move Shapes", "OCLL", "All Corners Oriented", "Awkward Shapes", "P Shapes", "T Shapes", "C Shapes", "W Shapes", "L Shapes", "Line Shapes"];
  var SUB_GROUP = {"Dot Case": "Dot Case", "Square Shapes": "Square Shapes", "Lightning Shapes": "Lightning Shapes", "Fish Shapes": "Fish Shapes", "Knight Move Shapes": "Knight Move Shapes", "OCLL": "OCLL", "All Corners Oriented": "All Corners Oriented", "Awkward Shapes": "Awkward Shapes", "P Shapes": "P Shapes", "T Shapes": "T Shapes", "C Shapes": "C Shapes", "W Shapes": "W Shapes", "L Shapes": "L Shapes", "Line Shapes": "Line Shapes"};

  function currentList() {
    var sort = sortSel.value, filter = filterSel.value;
    var list = OLL.slice();
    if (filter === "swapped") list = list.filter(function (c) { return !!swaps[c.id]; });
    else if (filter !== "all") list = list.filter(function (c) { return c.sub === filter; });

    if (sort === "practice") {
      list.sort(function (a, b) {
        var na = counts[a.id] || 0, nb = counts[b.id] || 0;
        if (na !== nb) return nb - na;
        return a.id.localeCompare(b.id, undefined, { numeric: true });
      });
    } else if (sort === "subgroup") {
      var ord = {}; SUB_GROUPS.forEach(function (s, i) { ord[s] = i; });
      list.sort(function (a, b) { return (ord[a.sub] - ord[b.sub]) || a.id.localeCompare(b.id, undefined, { numeric: true }); });
    } else if (sort === "best") {
      list.sort(function (a, b) {
        var ba = statsOf(a.id).best, bb = statsOf(b.id).best;
        var fa = isFinite(ba), fb = isFinite(bb);
        if (fa && fb) return ba - bb;          // 都练过：快（小）的排前
        if (fa !== fb) return fa ? -1 : 1;      // 练过的排未练前面
        return a.id.localeCompare(b.id, undefined, { numeric: true });
      });
    } else {
      list.sort(function (a, b) { return a.id.localeCompare(b.id, undefined, { numeric: true }); });
    }
    return list;
  }

  function netSvg(c) {
    try { return window.CubeArt.flatCase(c.facelets); } catch (e) { return null; }
  }

  function render() {
    var list = currentList();
    // KPI
    var practiced = OLL.filter(function (c) { return (counts[c.id] || 0) > 0; }).length;
    var swappedN = Object.keys(swaps).length;
    document.getElementById("oll-kpis").innerHTML =
      '<div class="oll-kpi"><div class="k-label">公式总数</div><div class="k-value">57</div></div>' +
      '<div class="oll-kpi"><div class="k-label">已练习</div><div class="k-value">' + practiced + ' / 57</div></div>' +
      '<div class="oll-kpi"><div class="k-label">换过公式</div><div class="k-value" style="color:#f5c518">' + swappedN + '</div></div>' +
      '<div class="oll-kpi"><div class="k-label">累计练习次数</div><div class="k-value">' + Object.keys(counts).reduce(function (s, k) { return s + (counts[k] || 0); }, 0) + '</div></div>';

    if (!list.length) {
      board.innerHTML = '<div class="oll-empty">没有符合筛选条件的公式。</div>';
      return;
    }
    var plan = colorPlan();
    board.innerHTML = list.map(function (c) {
      var svg = netSvg(c);
      var n = counts[c.id] || 0;
      var swap = swaps[c.id];
      var st = statsOf(c.id);
      var netHtml = svg ? svg.outerHTML : "";
      var styleAttr = "", klass = "", bestHtml = "", title = c.id + ' · ' + SUB_GROUP[c.sub];
      if (isFinite(st.best)) {
        var r = st.best / plan.bench;
        var col = colorByRatio(r, plan.range);
        styleAttr = ' style="background:' + col.bg + ';color:' + col.fg + '"';
        klass = ' has-data ' + col.tier;
        bestHtml = '<div class="oll-card__best">' + fmt(st.best) + 's</div>';
        title += ' · 最好 ' + fmt(st.best) + 's · 已练 ' + n + ' 次' + (isFinite(r) ? ' · r=' + r.toFixed(2) + '×' : '');
      } else {
        title += (n ? ' · 已练 ' + n + ' 次' : ' · 未练习');
      }
      if (swap) title += ' · 已换公式（' + (swap.alg || '') + '）';
      return '<div class="oll-card' + (swap ? ' is-swapped' : '') + klass + '" data-id="' + c.id + '" tabindex="0" role="button" title="' + title + '"' + styleAttr + '>' +
        (n ? '<span class="oll-card__count">' + n + '</span>' : '') +
        '<div class="oll-card__net">' + netHtml + '</div>' +
        '<div class="oll-card__name">' + c.id + '</div>' +
        '<div class="oll-card__alg">' + c.algs[0] + '</div>' +
        bestHtml +
        (swap ? '<span class="c-swap" title="已换新公式">换</span>' : '') +
        '</div>';
    }).join("");

    fitBoard();
  }

  sortSel.addEventListener("change", render);
  filterSel.addEventListener("change", render);

  /* ============ 4) 练习弹层 + 计时 ============ */
  var modal = document.getElementById("oll-modal");
  var mTitle = document.getElementById("oll-m-title");
  var mNet = document.getElementById("oll-m-net");
  var mAlgs = document.getElementById("oll-m-algs");
  var mCount = document.getElementById("oll-m-count");
  var mStats = document.getElementById("oll-m-stats");
  var timerEl = document.getElementById("oll-timer");
  var timerBtn = document.getElementById("oll-timer-btn");
  var swapBtn = document.getElementById("oll-swap-btn");
  var mPrev = document.getElementById("oll-m-prev");
  var mNext = document.getElementById("oll-m-next");
  var mSelect = document.getElementById("oll-m-select");
  var rotCw = document.getElementById("oll-rot-cw");
  var rotCcw = document.getElementById("oll-rot-ccw");
  var rotLabel = document.getElementById("oll-rot-label");
  var activeId = null;
  // 计时器状态机（标准魔方计时器 hold-to-start，与 UF440 一致）
  var tState = "idle";   // idle | prep | green | running | done
  var tStart = 0, tTick = 0, tPrep = 0;

  function fmt(ms) {
    if (!isFinite(ms) || ms < 0) return "0.000";
    var total = Math.round(ms);
    var sec = Math.floor(total / 1000);
    var mill = total % 1000;
    return sec + "." + String(mill).padStart(3, "0");
  }

  /* ============ 预览方向旋转（模拟对实例做 k 次 U 转，顺时针 90° = 1 次） ============
     - U 面 3×3 网格顺时针转；四条侧面顶行绕中心轮转 F→L→B→R→F（同序不反转）。
       推导：U 转 = 绕竖轴 (x,z)→(-z,x)（标准 U：(URF UFL ULB UBR)）；
       再按 flatCase 展开图各臂坐标（下臂 uf[0..2] / 左臂 ul[0..2] / 上臂 ub[2,1,0] / 右臂 ur[2,1,0]）
       做 (x,y)→(-y,x) 顺时针验证：uf[0]→ul[0]、ul[0]→ub[0]、ub[0]→ur[0]、ur[0]→uf[0]，两法一致。
     - 公式对应：预览顺时针 90° = 实例比标准态多转了一次 U → 先 U' 归位再执行公式；
       180° → U2；270° → U。前缀在公式最前面（实例自身朝向下的 AUF，先于公式内的 x/y 整体转）。 */
  function rotGridCW(s) {
    var o = [];
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) o[r * 3 + c] = s[(2 - c) * 3 + r];
    return o.join("");
  }
  function rotateFacelets(fl, k) {
    k = ((k % 4) + 4) % 4;
    if (k === 0 || !fl) return fl;
    var us = fl["data-us"];
    var top = {
      f: fl["data-uf"].slice(0, 3), l: fl["data-ul"].slice(0, 3),
      b: fl["data-ub"].slice(0, 3), r: fl["data-ur"].slice(0, 3)
    };
    for (var i = 0; i < k; i++) {
      us = rotGridCW(us);
      var nf = top.r, nl = top.f, nb = top.l, nr = top.b;   // F→L→B→R→F
      top = { f: nf, l: nl, b: nb, r: nr };
    }
    return {
      "data-us": us,
      "data-ub": top.b + fl["data-ub"].slice(3),
      "data-uf": top.f + fl["data-uf"].slice(3),
      "data-ul": top.l + fl["data-ul"].slice(3),
      "data-ur": top.r + fl["data-ur"].slice(3)
    };
  }
  function aufPrefix(k) {
    k = ((k % 4) + 4) % 4;
    return k === 1 ? "U' " : k === 2 ? "U2 " : k === 3 ? "U " : "";
  }
  function netSvgRot(c, k) {
    try { return window.CubeArt.flatCase(rotateFacelets(c.facelets, k)); } catch (e) { return null; }
  }

  var rot = 0;   // 当前预览顺时针旋转次数（0..3）
  function byId(id) { return OLL.filter(function (x) { return x.id === id; })[0]; }

  // 下拉：21 条按类型分组（行为对齐 UF440 的 a4-modal-select）
  function fillSelect() {
    var html = "";
    SUB_GROUPS.forEach(function (s) {
      html += '<optgroup label="' + SUB_GROUP[s] + '">';
      OLL.forEach(function (c) {
        if (c.sub === s) html += '<option value="' + c.id + '">' + c.id + '</option>';
      });
      html += '</optgroup>';
    });
    mSelect.innerHTML = html;
  }

  // 按当前公式 + 旋转角度渲染弹层（预览图 + 带 AUF 前缀的公式 + 统计）
  function applyView() {
    var c = byId(activeId);
    if (!c) return;
    var pre = aufPrefix(rot);
    mTitle.innerHTML = c.id + ' <span class="badge badge--brand">' + c.subName + '</span>' +
      (pre ? ' <span class="badge badge--amber oll-modal__auf">AUF ' + pre.trim() + '</span>' : '');
    var svg = netSvgRot(c, rot);
    mNet.innerHTML = svg ? svg.outerHTML : "";
    mAlgs.innerHTML = c.algs.map(function (a) {
      var shown = pre + a;
      return '<div class="oll-alg"><code data-alg="' + shown.replace(/"/g, "&quot;") + '">' + shown + '</code><button class="cpy" data-copy="' + shown.replace(/"/g, "&quot;") + '">复制</button></div>';
    }).join("");
    mCount.textContent = counts[activeId] || 0;
    fillStats();
    rotLabel.textContent = (rot * 90) + "°";
  }

  // 加载一条公式（对齐 UF440 loadCode：重置计时 + 回到标准朝向）
  function loadCode(id) {
    var c = byId(id);
    if (!c) return;
    activeId = id;
    mSelect.value = id;
    rot = 0;
    applyView();
    resetTimer();
  }
  // 上一条 / 下一条（按名称序 Aa→Z，对齐 UF440 step）
  function step(delta) {
    if (!activeId) return;
    var i = -1;
    for (var k = 0; k < OLL.length; k++) if (OLL[k].id === activeId) { i = k; break; }
    if (i < 0) return;
    var j = Math.max(0, Math.min(OLL.length - 1, i + delta));
    loadCode(OLL[j].id);
  }

  function openModal(id) {
    if (!byId(id)) return;
    modal.hidden = false;
    loadCode(id);
  }
  function fillStats() {
    if (!activeId) return;
    var st = statsOf(activeId);
    var html = '<div class="oll-stat"><div class="l">已练</div><div class="v">' + st.n + '</div></div>' +
      '<div class="oll-stat"><div class="l">最好</div><div class="v">' + (isFinite(st.best) ? fmt(st.best) + 's' : '—') + '</div></div>' +
      '<div class="oll-stat"><div class="l">最近</div><div class="v">' + (isFinite(st.last) ? fmt(st.last) + 's' : '—') + '</div></div>';
    if (st.n > 1) {
      var recent = times[activeId].slice(-6).reverse();
      html += '<div class="oll-stat-hist">最近成绩：' + recent.map(function (t) { return fmt(t) + 's'; }).join(' · ') + '</div>';
    }
    mStats.innerHTML = html;
  }
  function closeModal() {
    modal.hidden = true;
    resetTimer();
    activeId = null;
  }
  function setTState(s) { tState = s; timerEl.dataset.state = s; }
  function renderTimer() { if (tState === "running") timerEl.textContent = fmt(performance.now() - tStart); }
  function startTimer() {
    if (tState === "running") return;
    setTState("running");
    tStart = performance.now();
    tTick = setInterval(renderTimer, 50);
  }
  function stopTimer(silent) {
    if (tState !== "running") { if (!silent) resetTimer(); return; }
    clearInterval(tTick);
    var total = performance.now() - tStart;          // 单次成绩（秒，毫秒精度）
    counts[activeId] = (counts[activeId] || 0) + 1;
    times[activeId] = times[activeId] || [];
    times[activeId].push(total);
    saveMap(LS_COUNT, counts);
    saveMap(LS_TIMES, times);
    mCount.textContent = counts[activeId];
    fillStats();
    setTState("done");
    timerEl.textContent = fmt(total);
    timerBtn.textContent = "再练一次（空格）";
    if (!silent) { render(); toast("已记录单次 " + fmt(total) + "s · 累计 " + counts[activeId] + " 次"); }
  }
  function resetTimer() {
    clearInterval(tTick); clearTimeout(tPrep);
    setTState("idle");
    timerEl.textContent = "0.000";
    timerBtn.textContent = "按住空格开始计时";
  }
  // 标准魔方计时器 hold-to-start：按下空格→红「按住」；按住 500ms→绿「松开」；松开即开始；
  // 不足 500ms 松开→取消；计时中再按空格→停止
  function keydownHold() {
    if (tState === "running") { stopTimer(false); return; }
    if (tState === "prep" || tState === "green") { clearTimeout(tPrep); return; }
    clearTimeout(tPrep);
    setTState("prep");
    timerEl.textContent = "按住";
    tPrep = setTimeout(function () {
      if (tState === "prep") { setTState("green"); timerEl.textContent = "松开"; }
    }, 500);
  }
  function keyupHold() {
    clearTimeout(tPrep);
    if (tState === "green") { startTimer(); return; }
    if (tState === "prep") { resetTimer(); return; }
  }
  function toggleTimerMouse() {
    if (tState === "running") stopTimer(false);
    else if (tState === "done" || tState === "idle") startTimer();
  }

  board.addEventListener("click", function (e) {
    var card = e.target.closest && e.target.closest(".oll-card");
    if (card) openModal(card.getAttribute("data-id"));
  });
  board.addEventListener("keydown", function (e) {
    if (!modal.hidden) return;   // 弹层已打开时交给定时器处理，避免卡片焦点重复触发打开
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("oll-card")) {
      e.preventDefault(); openModal(e.target.getAttribute("data-id"));
    }
  });
  modal.addEventListener("click", function (e) {
    if (e.target.hasAttribute("data-close")) closeModal();
    var cp = e.target.closest && e.target.closest("[data-copy]");
    if (cp) { copyText(cp.getAttribute("data-copy")); toast("已复制"); }
  });
  mAlgs.addEventListener("click", function (e) {
    var code = e.target.closest && e.target.closest("code[data-alg]");
    if (code) { copyText(code.getAttribute("data-alg")); toast("已复制"); }
  });
  timerBtn.addEventListener("click", toggleTimerMouse);
  timerEl.addEventListener("click", toggleTimerMouse);
  // 浮动框导航（移植自 UF440）：上一条 / 下一条 / 下拉选公式
  fillSelect();
  mPrev.addEventListener("click", function () { step(-1); });
  mNext.addEventListener("click", function () { step(1); });
  mSelect.addEventListener("change", function () { loadCode(mSelect.value); });
  // 预览方向：左转 / 右转 90°
  rotCw.addEventListener("click", function () { rot = (rot + 1) % 4; applyView(); });
  rotCcw.addEventListener("click", function () { rot = (rot + 3) % 4; applyView(); });
  swapBtn.addEventListener("click", function () {
    if (!activeId) return;
    var cur = swaps[activeId] ? swaps[activeId].alg : "";
    var inp = prompt("将该公式标记为「换过」（已换成自己的习惯公式）。可填入你常用的算法：", cur);
    if (inp === null) return;
    if (inp.trim() === "") { delete swaps[activeId]; }
    else { swaps[activeId] = { alg: inp.trim() }; }
    saveMap(LS_SWAP, swaps);
    render();
    // 刷新弹层标题状态无需重开；重渲看板即可
    toast(swaps[activeId] ? "已标记换公式" : "已取消换公式标记");
  });
  document.addEventListener("keydown", function (e) {
    if (modal.hidden) return;
    if (e.key === "Escape") { closeModal(); e.preventDefault(); return; }
    var isSpace = (e.code === "Space") || (e.key === " ") || (e.key === "Spacebar");
    // 空格始终归计时器（keydown 里 preventDefault 会抑制聚焦按钮的空格激活，避免双触发；与 UF440 一致）
    if (isSpace && !e.repeat) { keydownHold(); e.preventDefault(); return; }
    // ←/→ 切换公式：表单聚焦（含下拉已展开）或计时进行中不抢，行为对齐 UF440
    var t = e.target;
    var inForm = t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if (inForm) return;
    if (tState === "running" || tState === "prep" || tState === "green") return;
    if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  });
  document.addEventListener("keyup", function (e) {
    if (modal.hidden) return;
    var isSpace = (e.code === "Space") || (e.key === " ") || (e.key === "Spacebar");
    if (isSpace) { keyupHold(); e.preventDefault(); }
  });

  function copyText(t) {
    try { navigator.clipboard.writeText(t); } catch (e) {
      var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {} document.body.removeChild(ta);
    }
  }
  var toastTimer = 0;
  function toast(msg) {
    var el = document.getElementById("oll-toast");
    if (!el) { el = document.createElement("div"); el.id = "oll-toast"; el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--surface-3,#232C3E);color:var(--fg,#EEF2F8);padding:10px 18px;border-radius:10px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14px;border:1px solid var(--line-2,rgba(255,255,255,.18));"; document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = "1";
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.opacity = "0"; el.style.transition = "opacity .4s"; }, 1600);
  }

  /* ============ 5) 横屏铺满（改编自 UF440 fitBoard，卡片更大） ============ */
  var GAP = 12;
  var MIN_CELL = 132;       // 大卡片下限
  var MAX_CELL = 260;
  var MAX_ASPECT = 1.7;     // 卡片可略高（预览图+文字）

  function divisors(n) { var d = []; for (var i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; }

  function fitBoard() {
    var cells = board.children;
    var n = cells.length;
    if (!n) return;

    var cs = getComputedStyle(board);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var availW = board.clientWidth ? (board.clientWidth - padX - 2)
                                   : (document.documentElement.clientWidth - 240 - 32);
    availW = Math.max(240, availW);

    var rect = board.getBoundingClientRect();
    var topSpace = Math.max(0, rect.top);
    var footEl = document.querySelector("footer.site-footer");
    var footH = 0, footMT = 0;
    if (footEl) { footH = Math.ceil(footEl.getBoundingClientRect().height); footMT = parseFloat(getComputedStyle(footEl).marginTop) || 0; }
    var boardMB = parseFloat(cs.marginBottom) || 0;
    var bodyPB = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    var tailH = boardMB + footMT + footH + bodyPB;
    var availH = Math.max(220, window.innerHeight - topSpace - Math.ceil(tailH) - 2);

    var isNarrow = window.innerWidth < 640;
    var minCell = isNarrow ? 104 : MIN_CELL;
    var maxCell = isNarrow ? 150 : MAX_CELL;

    var maxColsByW = Math.min(n, Math.max(1, Math.floor((availW + GAP) / (minCell + GAP))));

    function planFor(cols) {
      var rows = Math.ceil(n / cols);
      var rem = n - cols * (rows - 1);
      var cellW = (availW - (cols - 1) * GAP) / cols;
      var cellH = (availH - (rows - 1) * GAP) / rows;
      var lo = Math.min(cellW, cellH), hi = Math.max(cellW, cellH);
      var tailRatio = rem === 0 ? 1 : ((availW - (rem - 1) * GAP) / rem) / cellW;
      return { cols: cols, rows: rows, rem: rem, cellW: cellW, cellH: cellH, cell: lo, aspect: hi / lo, tailRatio: tailRatio, fitsH: true };
    }
    function widthPlanFor(cols) {
      var rows = Math.ceil(n / cols);
      var rem = n - cols * (rows - 1);
      var cellW = (availW - (cols - 1) * GAP) / cols;
      return { cols: cols, rows: rows, rem: rem, cellW: cellW, cellH: cellW, cell: cellW, aspect: 1, tailRatio: rem === 0 ? 1 : cols / rem, fitsH: false };
    }

    var best = null;
    for (var c = 1; c <= maxColsByW; c++) {
      var p = planFor(c);
      if (p.cell < minCell || p.cell > maxCell) continue;
      if (p.aspect > MAX_ASPECT) continue;
      if (p.tailRatio > 3) continue;
      if (!best || p.cell > best.cell * 1.02) { best = p; continue; }
      if (p.cell >= best.cell * 0.98) {
        var better;
        if ((p.rem === 0) !== (best.rem === 0)) better = (p.rem === 0);
        else if (Math.abs(p.tailRatio - best.tailRatio) > 0.03) better = p.tailRatio < best.tailRatio;
        else if (Math.abs(p.aspect - best.aspect) > 0.02) better = p.aspect < best.aspect;
        else better = p.cell > best.cell;
        if (better) best = p;
      }
    }
    if (!best) {
      var divs = divisors(n);
      for (var i = 0; i < divs.length; i++) {
        if (divs[i] > maxColsByW) break;
        var w1 = widthPlanFor(divs[i]);
        if (w1.cell < minCell || w1.cell > maxCell) continue;
        if (!best || w1.cols > best.cols) best = w1;
      }
    }
    if (!best) {
      for (var c2 = maxColsByW; c2 >= 1; c2--) {
        var w2 = widthPlanFor(c2);
        if (w2.cell < minCell || w2.cell > maxCell) continue;
        best = w2; break;
      }
    }
    if (!best) {
      var p3 = widthPlanFor(maxColsByW);
      var cc = Math.max(minCell, Math.min(p3.cellW, maxCell));
      best = { cols: p3.cols, rows: p3.rows, rem: p3.rem, cellW: cc, cellH: cc, cell: cc, aspect: 1, tailRatio: 1, fitsH: false };
    }

    var tailW = 0;
    if (best.rem > 0 && best.rem < best.cols) {
      var t = (availW - (best.rem - 1) * GAP) / best.rem;
      if (t <= best.cellW * 3) tailW = t;
    }

    board.style.setProperty("--oll-w", best.cellW.toFixed(2) + "px");
    board.style.setProperty("--oll-h", best.cellH.toFixed(2) + "px");
    board.style.setProperty("--pll", best.cell.toFixed(2) + "px");
    if (tailW > 0) board.style.setProperty("--oll-tail", tailW.toFixed(2) + "px");
    else board.style.removeProperty("--oll-tail");
    for (var k = 0; k < n; k++) {
      var el = cells[k];
      if (!el || !el.classList) continue;
      if (tailW > 0 && k >= n - best.rem) el.classList.add("is-tail");
      else el.classList.remove("is-tail");
    }

    document.documentElement.style.overflowY = best.fitsH ? "hidden" : "";
    document.body.style.overflowY = best.fitsH ? "hidden" : "";
    document.documentElement.style.overflowX = "hidden";
  }

  function scheduleFit() {
    if (window.__ollRaf) cancelAnimationFrame(window.__ollRaf);
    window.__ollRaf = requestAnimationFrame(fitBoard);
  }
  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", scheduleFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoard);
  if (typeof ResizeObserver !== "undefined") {
    var roTimer = 0;
    var ro = new ResizeObserver(function () { clearTimeout(roTimer); roTimer = setTimeout(fitBoard, 60); });
    ro.observe(document.documentElement);
    if (board.parentNode) ro.observe(board.parentNode);
  }
  setTimeout(fitBoard, 0);

  render();
})();
</script>
</body>
</html>
