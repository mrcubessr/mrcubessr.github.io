<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/sync-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棱块编码认知训练出题器</title>

<link rel="stylesheet" href="/assets/css/site-nav.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/site-layout.css">
<style>:root {
  --po-ui-c0392b: #c0392b;
  --po-ui-6b7280: #6b7280;
  --po-ui-eef1f5: #eef1f5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --panel: var(--on-brand);
  --panel-2: var(--po-ui-eef1f5);
  --muted: var(--po-ui-6b7280);
  --po-danger: var(--po-ui-c0392b);
  --success: var(--green);
}

body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
}

/* ========== 顶部控制栏 ========== */
.toolbar {
  width: 100%;
  max-width: 960px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 20px 24px;
  margin-bottom: 24px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.toolbar h1 {
  font-size: 22px; font-weight: 700; color: var(--fg);
  margin-bottom: 4px; text-align: center;
}
.toolbar .h1-sub {
  font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 16px;
}

/* 难度预设按钮行 */
.preset-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  justify-content: center; margin-bottom: 14px;
  padding: 10px 14px; background: var(--panel-2);
  border-radius: 0; border: 1px solid var(--line);
}
.preset-label {
  font-size: 13px; font-weight: 700; color: var(--fg); margin-right: 4px;
}
.preset-btn {
  padding: 6px 14px; border: 1.5px solid var(--line); border-radius: 0;
  font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  background: var(--on-brand); transition: all 0.15s;
}
.preset-btn:hover { border-color: var(--brand); color: var(--brand); }
.preset-btn.active {
  background: var(--brand); color: var(--on-brand); border-color: var(--brand);
}
.preset-info {
  font-size: 12px; color: var(--fg-2); margin-left: 6px;   /* 阶段四：--muted 仅 4.27:1 */
}

.ctrl-row {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;
  justify-content: center;
}
.ctrl-group {
  display: flex; flex-direction: column; gap: 6px;
}
.ctrl-group label {
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.ctrl-group input[type="text"],
.ctrl-group input[type="number"],
.ctrl-group input[type="date"] {
  padding: 8px 12px; border: 1.5px solid var(--line);
  border-radius: 0; font-size: 15px; color: var(--fg);
  background: var(--panel-2); outline: none;
  transition: border-color 0.15s;
}
.ctrl-group input:focus { border-color: var(--brand); }
.ctrl-group input[type="number"] { width: 80px; }

/* 颜色勾选区 */
.color-pick {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.color-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 0; cursor: pointer;
  border: 2px solid var(--line); background: var(--on-brand);
  font-size: 13px; font-weight: 600; color: var(--fg);
  transition: all 0.15s; user-select: none;
}
.color-chip .swatch {
  width: 16px; height: 16px; border-radius: 0;
  border: 1px solid rgba(0,0,0,0.2); display: inline-block;
}
.color-chip.checked {
  border-color: var(--brand);
  box-shadow: 0 0 0 1px var(--brand) inset;
}
.color-chip .ck {
  font-size: 11px; color: var(--brand); margin-left: 2px;
}

/* 形态勾选区 */
.orient-pick {
  display: flex; gap: 6px;
}
.orient-chip {
  padding: 5px 10px; border-radius: 0; cursor: pointer;
  border: 2px solid var(--line); background: var(--on-brand);
  font-size: 13px; font-weight: 600; color: var(--muted);
  transition: all 0.15s; user-select: none;
}
.orient-chip.checked {
  border-color: var(--brand); color: var(--brand);
  box-shadow: 0 0 0 1px var(--brand) inset;
}

/* 切换按钮组 */
.toggle-group {
  display: flex; border: 1.5px solid var(--line); border-radius: 0;
  overflow: hidden; background: var(--panel-2);
}
.toggle-btn {
  padding: 8px 18px; border: none; background: transparent;
  font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
  transition: all 0.15s;
}
.toggle-btn.active {
  background: var(--brand); color: var(--on-brand);
}
/* checkbox 样式 */
.ctrl-group input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand);
}

.btn-generate {
  padding: 10px 28px; border: none; border-radius: 0;
  font-size: 16px; font-weight: 700; cursor: pointer;
  background: var(--brand); color: var(--on-brand);
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
}
.btn-generate:hover { opacity: 0.9; }
.btn-generate:active { transform: scale(0.97); }

.btn-print {
  padding: 10px 28px; border: 2px solid var(--po-danger);
  border-radius: 0; font-size: 16px; font-weight: 700; cursor: pointer;
  background: var(--on-brand); color: var(--po-danger);
  transition: transform 0.1s, background 0.1s;
}
.btn-print:hover { background: var(--red-soft); }
.btn-print:active { transform: scale(0.97); }

/* ========== A4 纸张区域 ========== */
.pages-container {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.a4-page {
  /* A4 竖版比例：210mm × 297mm */
  width: 210mm;
  min-height: 297mm;
  background: var(--on-brand);
  margin: 0 auto;
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  padding: 14mm 16mm 12mm;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* 页头 */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
  border-bottom: 1.5px solid var(--line);
  padding-bottom: 8px;
  margin-bottom: 10px;
}
.page-header .student-name {
  font-weight: 600; color: var(--fg);
}
.page-header .date {
  color: var(--muted);
}

/* 主标题 */
.main-title {
  text-align: center;
  font-size: 26px;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
}

/* 3×4 网格 */
.edge-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 6px 12px;
  flex: 1;
  align-content: stretch;
}

.edge-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.edge-cell canvas {
  display: block;
  margin: 0 auto;
  max-width: 100%;
}

@media (max-width: 640px) {
  .edge-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  body {
    align-items: stretch;
    padding: 14px 10px;
  }
  .toolbar {
    max-width: 100%;
    min-width: 0;
    padding: 16px 14px;
  }
  .ctrl-row {
    min-width: 0;
    width: 100%;
  }
  .ctrl-group {
    min-width: 0;
    width: 100%;
  }
  .toggle-group {
    flex-wrap: wrap;
  }
}
.edge-cell .write-line {
  width: 90%;
  margin: 6px auto 0;
  border-bottom: 2px solid var(--fg);
  height: 22px;
}
.edge-cell .seq-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 2px;
}
/* 读编码模式：字母显示 */
.edge-cell .read-letter {
  font-size: 22px; font-weight: 800; color: var(--brand);
  margin-top: 4px; letter-spacing: 1px;
}

/* ========== 打印样式 ========== */
@media print {
  body {
    background: var(--on-brand);
    padding: 0;
  }
  .toolbar {
    display: none !important;
  }
  .pages-container {
    gap: 0;
    max-width: none;
  }
  .a4-page {
    width: 210mm;
    min-height: 297mm;
    margin: 0;
    box-shadow: none;
    page-break-after: always;
    break-after: page;
  }
  .a4-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }
  @page {
    size: A4 portrait;
    margin: 0;
  }
}

/* 响应式提示 */
@media (max-width: 850px) {
  .a4-page {
    width: 100%;
    min-height: auto;
    padding: 20px 16px;
  }
  .main-title { font-size: 22px; }
}
</style>
<style>
/* 阶段二：导航通栏适配 */
body{ display:block; padding:0 16px 20px; }
.toolbar{ margin:20px auto 0; }
/* 阶段二：打印时隐藏导航 */
@media print{
  [data-site-nav], .site-nav, .no-print{ display:none !important; }
  body{ padding:0 !important; }
}
</style>
</head>

<div data-site-nav></div>
<noscript><a href="/" style="display:block;padding:12px 20px">← 返回首页</a></noscript>


<!-- ========== 顶部控制栏 ========== -->
<div class="toolbar">
  <h1>棱块编码认知训练出题器</h1>
  <div class="h1-sub">三形态 · 颜色筛选 · 循序渐进难度</div>

  <!-- 难度预设 -->
  <div class="preset-row">
    <span class="preset-label">难度预设</span>
    <button class="seg__btn active" data-preset="L1">L1 入门（黄红绿）</button>
    <button class="seg__btn" data-preset="L2">L2 基础（黄红白绿）</button>
    <button class="seg__btn" data-preset="L3">L3 进阶（黄红白绿蓝）</button>
    <button class="seg__btn" data-preset="L4">L4 挑战（全6色）</button>
    <span class="preset-info" id="presetInfo">当前可选棱块：4 个</span>
  </div>

  <div class="ctrl-row">
    <div class="ctrl-group">
      <label>学生姓名</label>
      <input type="text" id="studentName" placeholder="姓名" value="" style="width:120px;">
    </div>
    <div class="ctrl-group">
      <label>日期</label>
      <input type="date" id="dateInput">
    </div>
    <div class="ctrl-group">
      <label>页数</label>
      <input type="number" id="pageCount" value="1" min="1" max="10">
    </div>
    <div class="ctrl-group">
      <label>每页题数</label>
      <div class="toggle-group" id="perPagePick">
        <button class="seg__btn active" data-perpage="12" data-cols="3">12（3×4）</button>
        <button class="seg__btn" data-perpage="16" data-cols="4">16（4×4）</button>
        <button class="seg__btn" data-perpage="20" data-cols="4">20（4×5）</button>
        <button class="seg__btn" data-perpage="24" data-cols="4">24（4×6）</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>模式</label>
      <div class="toggle-group">
        <button class="seg__btn active" data-mode="write">写编码（有横线）</button>
        <button class="seg__btn" data-mode="read">读编码（无横线）</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>颜色筛选（指定出题棱块范围）</label>
      <div class="color-pick" id="colorPick"></div>
    </div>
    <div class="ctrl-group">
      <label>棱块形态</label>
      <div class="orient-pick" id="orientPick">
        <span class="badge checked" data-orient="standard">标准</span>
        <span class="badge checked" data-orient="flipped">镜像</span>
        <span class="badge checked" data-orient="rot">旋转120°</span>
      </div>
    </div>
    <div class="ctrl-group">
      <label>显示选项</label>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;">
          <input type="checkbox" id="showName" checked> 显示姓名
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;">
          <input type="checkbox" id="showDate" checked> 显示日期
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;">
          <input type="checkbox" id="showPageNum" checked> 显示页码
        </label>
      </div>
    </div>
    <button class="btn btn--primary" onclick="generate()">生成题目</button>
    <button class="btn btn--secondary" onclick="window.print()">打印 / 导出PDF</button>
  </div>
</div>

<!-- ========== 题目页面容器 ========== -->
<div class="pages-container" id="pagesContainer">
  <!-- 页面由 JS 动态生成 -->
</div>

<script>
// ============ 棱块数据 ============
// 标准配色：U=黄 R=绿 F=红 D=白 L=蓝 B=橙
const YELLOW = "#FFD500", BLUE = "#0051BA", RED = "#C41E3A";
const WHITE  = "#FFFFFF", GREEN = "#009E60", ORANGE = "#FF5800";

// 颜色元信息：用于难度筛选
const COLOR_META = {
  YELLOW: { name: "黄", hex: YELLOW },
  RED:    { name: "红", hex: RED },
  WHITE:  { name: "白", hex: WHITE },
  GREEN:  { name: "绿", hex: GREEN },
  BLUE:   { name: "蓝", hex: BLUE },
  ORANGE: { name: "橙", hex: ORANGE }
};

// 12 条棱：colors[0]=A面, colors[1]=B面, colorKeys 标注颜色身份
const EDGES = [
  { name: "黄绿 UR", colors: [YELLOW, GREEN],  letters: ["G", "H"], keys: ["YELLOW","GREEN"] },
  { name: "黄红 UF", colors: [YELLOW, RED],    letters: ["A", "B"], keys: ["YELLOW","RED"] },
  { name: "黄蓝 UL", colors: [YELLOW, BLUE],   letters: ["C", "D"], keys: ["YELLOW","BLUE"] },
  { name: "黄橙 UB", colors: [YELLOW, ORANGE], letters: ["E", "F"], keys: ["YELLOW","ORANGE"] },
  { name: "白绿 DR", colors: [WHITE, GREEN],   letters: ["O", "P"], keys: ["WHITE","GREEN"] },
  { name: "白红 DF", colors: [WHITE, RED],     letters: ["I", "J"], keys: ["WHITE","RED"] },
  { name: "白蓝 DL", colors: [WHITE, BLUE],    letters: ["K", "L"], keys: ["WHITE","BLUE"] },
  { name: "白橙 DB", colors: [WHITE, ORANGE],  letters: ["M", "N"], keys: ["WHITE","ORANGE"] },
  { name: "红绿 FR", colors: [RED, GREEN],     letters: ["Q", "R"], keys: ["RED","GREEN"] },
  { name: "红蓝 FL", colors: [RED, BLUE],      letters: ["S", "T"], keys: ["RED","BLUE"] },
  { name: "橙蓝 BL", colors: [ORANGE, BLUE],   letters: ["W", "X"], keys: ["ORANGE","BLUE"] },
  { name: "橙绿 BR", colors: [ORANGE, GREEN],  letters: ["Y", "Z"], keys: ["ORANGE","GREEN"] }
];

// 难度预设：每个预设指定要勾选哪些颜色
// 筛选逻辑：棱块的任一颜色在勾选集合中即入选（OR 逻辑），覆盖面更广
const PRESETS = {
  L1: { name: "入门", colors: ["YELLOW","RED","GREEN"] },         // 3色角棱 = 3棱
  L2: { name: "基础", colors: ["YELLOW","RED","WHITE","GREEN"] },   // 4色 = 5棱
  L3: { name: "进阶", colors: ["YELLOW","RED","WHITE","GREEN","BLUE"] },   // 5色 = 8棱
  L4: { name: "挑战", colors: ["YELLOW","RED","WHITE","GREEN","BLUE","ORANGE"] }  // 全6色 = 12棱
};

// ============ 工具函数 ============
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shadeColor(hex, percent) {
  const v = hex.replace("#", "");
  const r = Math.min(255, Math.max(0, parseInt(v.substr(0,2),16) + Math.round(255*percent)));
  const g = Math.min(255, Math.max(0, parseInt(v.substr(2,2),16) + Math.round(255*percent)));
  const b = Math.min(255, Math.max(0, parseInt(v.substr(4,2),16) + Math.round(255*percent)));
  return "rgb(" + r + "," + g + "," + b + ")";
}

function formatDateStr(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

// ============ 颜色勾选状态 ============
let selectedColors = new Set(PRESETS.L1.colors); // 默认 L1

function renderColorChips() {
  const wrap = document.getElementById("colorPick");
  wrap.innerHTML = "";
  Object.keys(COLOR_META).forEach(key => {
    const meta = COLOR_META[key];
    const chip = document.createElement("span");
    chip.className = "color-chip" + (selectedColors.has(key) ? " checked" : "");
    chip.dataset.color = key;
    chip.innerHTML =
      '<span class="swatch" style="background:' + meta.hex + '"></span>' +
      meta.name +
      (selectedColors.has(key) ? ' <span class="ck">✓</span>' : "");
    chip.addEventListener("click", () => {
      if (selectedColors.has(key)) {
        if (selectedColors.size <= 3) return; // AND 逻辑下至少保留 3 色（角棱）
        selectedColors.delete(key);
      } else {
        selectedColors.add(key);
      }
      // 取消预设高亮
      document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
      renderColorChips();
      updatePresetInfo();
    });
    wrap.appendChild(chip);
  });
}

function updatePresetInfo() {
  const pool = getFilteredEdges();
  document.getElementById("presetInfo").textContent =
    "当前可选棱块：" + pool.length + " 个（" + pool.length + "×3形态×2面 = " + (pool.length*3*2) + " 组合）";
}

// 根据勾选颜色过滤棱块：棱的两色都必须在 selectedColors 中（AND 逻辑，梯度更清晰）
function getFilteredEdges() {
  return EDGES.filter(e =>
    selectedColors.has(e.keys[0]) && selectedColors.has(e.keys[1])
  );
}

// ============ 预设按钮 ============
document.querySelectorAll(".preset-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const preset = PRESETS[btn.dataset.preset];
    selectedColors = new Set(preset.colors);
    renderColorChips();
    updatePresetInfo();
  });
});

// ============ 形态勾选 ============
let selectedOrients = new Set(["standard","flipped","rot"]);

document.querySelectorAll(".orient-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const orient = chip.dataset.orient;
    if (selectedOrients.has(orient)) {
      if (selectedOrients.size <= 1) return; // 至少保留 1 种
      selectedOrients.delete(orient);
      chip.classList.remove("checked");
    } else {
      selectedOrients.add(orient);
      chip.classList.add("checked");
    }
  });
});

// ============ 模式切换 / 每页题数（同组单选，互不干扰） ============
let currentMode = "write";   // "write" 或 "read"
let currentPerPage = 12;     // 每页题目数量
let currentCols = 3;         // 每页列数

document.querySelectorAll(".toggle-group").forEach(group => {
  group.querySelectorAll(".toggle-btn").forEach(btn => {
    btn.addEventListener("click", function() {
      group.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      if (this.dataset.mode) currentMode = this.dataset.mode;
      if (this.dataset.perpage) {
        currentPerPage = parseInt(this.dataset.perpage, 10);
        currentCols = parseInt(this.dataset.cols, 10);
      }
    });
  });
});

// ============ 日期默认值 ============
document.getElementById("dateInput").value = formatDateStr(new Date());

renderColorChips();
updatePresetInfo();

// ============ 绘制棱块（三形态引擎）============
/**
 * 绘制棱块：两色面 + 共享棱
 * orientation: "standard" | "flipped" | "rot"
 * highlight: 0 或 1（高亮第几个面）
 * rotAngle: 仅 rot 形态用，绕画面中心旋转的角度（弧度），默认 120°
 *
 * 三种形态是同一块棱的不同摆放角度：
 *  - standard: 上菱形 + 右平行四边形（等距，右倾）
 *  - flipped:  上菱形 + 左平行四边形（standard 的左右镜像，左倾）
 *  - rot:      把 standard 几何绕画面中心旋转 rotAngle（默认 120°，第三姿态）
 */
function drawEdge(canvas, colors, orientation, highlight, rotAngle) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const s = Math.min(W, H) * 0.34;
  const w = s * 0.866, h = s * 0.5;
  // 旋转形态默认绕中心旋转 120°（用户指定：标准 / 镜像 / 旋转120° 三种姿态）
  const ORIENT_ANGLE = (rotAngle != null) ? rotAngle : (2 * Math.PI) / 3;

  let faces, outerPath, edgeLine, apexTop, apexBot;

  if (orientation === "flipped") {
    // 左倾：上菱形 + 左平行四边形（standard 的左右镜像）
    const V0 = [cx, cy];
    const V1 = [cx + w, cy - h];
    const V2 = [cx - w, cy - h];
    const V3 = [cx, cy - s];
    const V4 = [cx - w, cy + h];
    const V6 = [cx, cy + s];
    faces = [
      { pts: [V1, V3, V2, V0], from: V3, to: V0 },
      { pts: [V2, V4, V6, V0], from: V2, to: V6 }
    ];
    outerPath = [V1, V3, V2, V4, V6];
    edgeLine = [V0, V2];
    apexTop = V3;  // 最上外锐角
    apexBot = V6;  // 最下外锐角

  } else {
    // standard（右倾）：上菱形 + 右平行四边形
    const V0 = [cx, cy];
    const V1 = [cx - w, cy - h];
    const V2 = [cx + w, cy - h];
    const V3 = [cx, cy - s];
    const V5 = [cx + w, cy + h];
    const V6 = [cx, cy + s];
    faces = [
      { pts: [V1, V3, V2, V0], from: V3, to: V0 },
      { pts: [V2, V5, V6, V0], from: V2, to: V6 }
    ];
    outerPath = [V1, V3, V2, V5, V6];
    edgeLine = [V0, V2];
    apexTop = V3;  // 最上外锐角
    apexBot = V6;  // 最下外锐角
  }

  // 旋转形态：把 standard 几何绕画面中心旋转 ORIENT_ANGLE（flipped 不旋转）
  if (orientation === "rot") {
    const cos = Math.cos(ORIENT_ANGLE), sin = Math.sin(ORIENT_ANGLE);
    const rotPt = ([x, y]) => [
      cx + (x - cx) * cos - (y - cy) * sin,
      cy + (x - cx) * sin + (y - cy) * cos
    ];
    faces = faces.map(f => ({ pts: f.pts.map(rotPt), from: rotPt(f.from), to: rotPt(f.to) }));
    outerPath = outerPath.map(rotPt);
    edgeLine = edgeLine ? edgeLine.map(rotPt) : null;
    apexTop = rotPt(apexTop);
    apexBot = rotPt(apexBot);
  }

  // 两面渐变填充 + 描边
  const order = [0, 1].filter(i => i !== highlight).concat(highlight);
  for (const i of order) {
    if (i < 0 || !faces[i]) continue;
    const p = faces[i].pts;
    const g = ctx.createLinearGradient(faces[i].from[0], faces[i].from[1], faces[i].to[0], faces[i].to[1]);
    g.addColorStop(0, shadeColor(colors[i], 0.16));
    g.addColorStop(1, shadeColor(colors[i], -0.20));
    ctx.beginPath();
    ctx.moveTo(p[0][0], p[0][1]);
    for (let j = 1; j < p.length; j++) ctx.lineTo(p[j][0], p[j][1]);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "rgba(20,25,35,0.55)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // 外轮廓
  ctx.beginPath();
  ctx.moveTo(outerPath[0][0], outerPath[0][1]);
  for (let j = 1; j < outerPath.length; j++) ctx.lineTo(outerPath[j][0], outerPath[j][1]);
  ctx.strokeStyle = "rgba(25,32,44,0.85)";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 中心棱（rot 形态同样有可见棱）
  if (edgeLine) {
    ctx.beginPath();
    ctx.moveTo(edgeLine[0][0], edgeLine[0][1]);
    ctx.lineTo(edgeLine[1][0], edgeLine[1][1]);
    ctx.strokeStyle = "rgba(25,32,44,0.55)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // 高亮框
  if (highlight >= 0 && faces[highlight]) {
    const p = faces[highlight].pts;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p[0][0], p[0][1]);
    for (let j = 1; j < p.length; j++) ctx.lineTo(p[j][0], p[j][1]);
    ctx.closePath();
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 3.5;
    ctx.stroke();
    ctx.restore();
  }
}

// ============ 生成题目页面 ============
function generate() {
  const studentName = document.getElementById("studentName").value.trim() || "________";
  const dateStr = document.getElementById("dateInput").value || formatDateStr(new Date());
  const pageCount = Math.max(1, Math.min(10, parseInt(document.getElementById("pageCount").value) || 1));
  const showName = document.getElementById("showName").checked;
  const showDate = document.getElementById("showDate").checked;
  const showPageNum = document.getElementById("showPageNum").checked;

  const pool = getFilteredEdges();
  const orientList = Array.from(selectedOrients);

  const container = document.getElementById("pagesContainer");
  container.innerHTML = "";

  for (let pageIdx = 0; pageIdx < pageCount; pageIdx++) {
    const page = document.createElement("div");
    page.className = "a4-page";

    // 每页不重复出题：同一道"题" = 棱块 + 高亮面 + 形态 三者完全相同才算重复。
    // 颜色相同但高亮面/形态不同 → 算不同题，不视为重复。
    const N = currentPerPage;
    // 展开所有不重复的候选组合（棱块 × 高亮面0/1 × 已选形态）
    const combos = [];
    pool.forEach((_, idx) => {
      for (let f = 0; f < 2; f++) {
        for (const o of orientList) {
          combos.push({ edgeIndex: idx, faceIndex: f, orientation: o });
        }
      }
    });
    const effN = Math.min(N, combos.length);
    const shuffled = shuffle(combos).slice(0, effN);

    // 页头
    const header = document.createElement("div");
    header.className = "page-header";
    const nameHtml = showName ? '<span class="student-name">姓名：' + escapeHtml(studentName) + '</span>' : '';
    header.innerHTML =
      nameHtml +
      (showDate ? '<span class="date">' + escapeHtml(dateStr) + '</span>' : '');
    page.appendChild(header);

    // 主标题
    const title = document.createElement("div");
    title.className = "main-title";
    title.textContent = "棱块编码认知训练出题器";
    page.appendChild(title);

    const sub = document.createElement("div");
    sub.className = "subtitle";
    let subText = (currentMode === "write")
      ? "写出每个棱块高亮面所对应的编码字母"
      : "认读每个棱块高亮面所对应的编码";
    sub.textContent = subText;
    page.appendChild(sub);

    // 动态网格：列数 = currentCols，行数 = ceil(N / currentCols)
    const grid = document.createElement("div");
    grid.className = "edge-grid";
    grid.style.gridTemplateColumns = "repeat(" + currentCols + ", 1fr)";
    grid.style.gridTemplateRows = "repeat(" + Math.ceil(N / currentCols) + ", 1fr)";

    shuffled.forEach((pick, idx) => {
      const edge = pool[pick.edgeIndex];
      const cell = document.createElement("div");
      cell.className = "edge-cell";

      // 序号
      const seq = document.createElement("div");
      seq.className = "seq-num";
      seq.textContent = (idx + 1) + ".";
      cell.appendChild(seq);

      // canvas
      const canvas = document.createElement("canvas");
      canvas.width = 280;
      canvas.height = 220;
      canvas.style.width = "100%";
      canvas.style.maxWidth = "170px";
      canvas.style.height = "auto";
      cell.appendChild(canvas);

      if (currentMode === "write") {
        const line = document.createElement("div");
        line.className = "write-line";
        cell.appendChild(line);
      }
      // 读编码模式：只显示图形，下方不显示答案字母、也不显示字幕文字

      grid.appendChild(cell);

      requestAnimationFrame(() => {
        drawEdge(canvas, edge.colors, pick.orientation, pick.faceIndex);
      });
    });

    page.appendChild(grid);

    // 页脚
    if (showPageNum) {
      const footer = document.createElement("div");
      footer.className = "page-footer";
      footer.textContent = "第 " + (pageIdx + 1) + " 页 / 共 " + pageCount + " 页";
      page.appendChild(footer);
    }

    container.appendChild(page);
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ============ 初始生成一页 ============
generate();
</script>
