<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" preserveAspectRatio="xMidYMid meet" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="620" height="520" rx="12" fill="#11151f"/>
<text x="24" y="42" fill="#eef2f8" font-size="22" font-weight="800">二阶魔方角块编码图</text>
<text x="24" y="66" fill="#9fb0c8" font-size="13">24 字母体系 · 标准展开图</text>

<!-- 贴纸尺寸：70×70，间距 2；每个面 2×2 -->
<!-- 黄色 U 面（顶） -->
<g id="u-face">
  <rect x="148" y="62" width="70" height="70" rx="2" fill="#fff100" stroke="#000" stroke-width="2"/>
  <text x="183" y="108" fill="#000" font-size="36" font-weight="800" text-anchor="middle">A</text>
  <rect x="220" y="62" width="70" height="70" rx="2" fill="#fff100" stroke="#000" stroke-width="2"/>
  <text x="255" y="108" fill="#000" font-size="36" font-weight="800" text-anchor="middle">J</text>
  <rect x="148" y="134" width="70" height="70" rx="2" fill="#fff100" stroke="#000" stroke-width="2"/>
  <text x="183" y="180" fill="#000" font-size="36" font-weight="800" text-anchor="middle">D</text>
  <rect x="220" y="134" width="70" height="70" rx="2" fill="#fff100" stroke="#000" stroke-width="2"/>
  <text x="255" y="180" fill="#000" font-size="36" font-weight="800" text-anchor="middle">G</text>
</g>

<!-- 蓝色 L 面（左） -->
<g id="l-face">
  <rect x="2" y="208" width="70" height="70" rx="2" fill="#0033a0" stroke="#000" stroke-width="2"/>
  <text x="37" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">E</text>
  <rect x="74" y="208" width="70" height="70" rx="2" fill="#0033a0" stroke="#000" stroke-width="2"/>
  <text x="109" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">C</text>
  <rect x="2" y="280" width="70" height="70" rx="2" fill="#0033a0" stroke="#000" stroke-width="2"/>
  <text x="37" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">Q</text>
  <rect x="74" y="280" width="70" height="70" rx="2" fill="#0033a0" stroke="#000" stroke-width="2"/>
  <text x="109" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">M</text>
</g>

<!-- 红色 F 面（中） -->
<g id="f-face">
  <rect x="148" y="208" width="70" height="70" rx="2" fill="#e60012" stroke="#000" stroke-width="2"/>
  <text x="183" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">B</text>
  <rect x="220" y="208" width="70" height="70" rx="2" fill="#e60012" stroke="#000" stroke-width="2"/>
  <text x="255" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">L</text>
  <rect x="148" y="280" width="70" height="70" rx="2" fill="#e60012" stroke="#000" stroke-width="2"/>
  <text x="183" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">N</text>
  <rect x="220" y="280" width="70" height="70" rx="2" fill="#e60012" stroke="#000" stroke-width="2"/>
  <text x="255" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">Y</text>
</g>

<!-- 绿色 R 面（右） -->
<g id="r-face">
  <rect x="294" y="208" width="70" height="70" rx="2" fill="#009944" stroke="#000" stroke-width="2"/>
  <text x="329" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">K</text>
  <rect x="366" y="208" width="70" height="70" rx="2" fill="#009944" stroke="#000" stroke-width="2"/>
  <text x="401" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">I</text>
  <rect x="294" y="280" width="70" height="70" rx="2" fill="#009944" stroke="#000" stroke-width="2"/>
  <text x="329" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">Z</text>
  <rect x="366" y="280" width="70" height="70" rx="2" fill="#009944" stroke="#000" stroke-width="2"/>
  <text x="401" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">S</text>
</g>

<!-- 橙色 B 面（最右） -->
<g id="b-face">
  <rect x="440" y="208" width="70" height="70" rx="2" fill="#f39800" stroke="#000" stroke-width="2"/>
  <text x="475" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">H</text>
  <rect x="512" y="208" width="70" height="70" rx="2" fill="#f39800" stroke="#000" stroke-width="2"/>
  <text x="547" y="254" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">F</text>
  <rect x="440" y="280" width="70" height="70" rx="2" fill="#f39800" stroke="#000" stroke-width="2"/>
  <text x="475" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">T</text>
  <rect x="512" y="280" width="70" height="70" rx="2" fill="#f39800" stroke="#000" stroke-width="2"/>
  <text x="547" y="326" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">P</text>
</g>

<!-- 白色 D 面（底） -->
<g id="d-face">
  <rect x="148" y="354" width="70" height="70" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="183" y="400" fill="#000" font-size="36" font-weight="800" text-anchor="middle">W</text>
  <rect x="220" y="354" width="70" height="70" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="255" y="400" fill="#000" font-size="36" font-weight="800" text-anchor="middle">X</text>
  <rect x="148" y="426" width="70" height="70" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="183" y="472" fill="#000" font-size="36" font-weight="800" text-anchor="middle">O</text>
  <rect x="220" y="426" width="70" height="70" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="255" y="472" fill="#000" font-size="36" font-weight="800" text-anchor="middle">R</text>
</g>
</svg>
