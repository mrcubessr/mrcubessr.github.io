      记法 <b>R++ / R--</b> 为右层顺 / 逆时针转两格（每格 72°），<b>D++ / D--</b> 同理作用于下层，<b>U / U'</b> 为顶层一格。
      <span class="c4-mx-hint">· 卡片颜色越绿越快、越红越慢 · 按住空格 0.3s 松开起表 · 支持单次 / 连做三次取平均</span>
