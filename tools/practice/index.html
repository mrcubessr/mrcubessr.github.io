<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ========== 公式解析 ==========
const PRIME_CHARS = new Set(["'", "\u2019", "\u2018", "\u201B", "`", "\u02BC", "\u02C8", "\uFF07", "\u00B4", "\u2035", "\u2032"]);
const FACES = { U: 0, D: 1, F: 2, B: 3, R: 4, L: 5 };

// 解析一行公式，返回 move 列表 [{face:0..5, prime:bool, dbl:bool}]
function parseFormula(str) {
  const moves = [];
  const s = String(str);
  let i = 0;
  function parseGroup() {
    // 当前字符必须是 '('，递归解析到匹配 ')'
    const group = [];
    i++; // skip '('
    while (i < s.length && s[i] !== ')') {
      if (s[i] === ' ') { i++; continue; }
      if (s[i] === '(') {
        const sub = parseGroup();
        // 读取重复次数
        let rep = 1;
        if (i < s.length && /\d/.test(s[i])) {
          rep = parseInt(s[i], 10);
          i++;
        }
        for (let k = 0; k < rep; k++) group.push(...sub);
      } else {
        const tok = parseToken();
        if (tok) group.push(tok);
      }
    }
    i++; // skip ')'
    return group;
  }
  function parseToken() {
    const ch = s[i];
    const face = FACES[ch.toUpperCase()];
    if (face === undefined) { i++; return null; }
    i++;
    let prime = false;
    if (i < s.length && PRIME_CHARS.has(s[i])) { prime = true; i++; }
    let dbl = false;
    if (i < s.length && s[i] === '2') { dbl = true; i++; }
    return { face, prime, dbl };
  }
  while (i < s.length) {
    const ch = s[i];
    if (ch === ' ' || ch === '\t') { i++; continue; }
    if (ch === '(') {
      const g = parseGroup();
      // 读取组重复次数
      let rep = 1;
      if (i < s.length && /\d/.test(s[i])) {
        rep = parseInt(s[i], 10);
        i++;
      }
      for (let k = 0; k < rep; k++) moves.push(...g);
    } else {
      const tok = parseToken();
      if (tok) moves.push(tok);
    }
  }
  return moves;
}

// 规范化公式显示文本：压缩多余空格、统一 move 间距，保留原大小写与撇号变体
function normalizeFormulaText(str) {
  const s = String(str).trim();
  const toks = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (ch === ' ' || ch === '\t') { i++; continue; }
    if (ch === '(' || ch === ')') { toks.push(ch); i++; continue; }
    if (/\d/.test(ch)) {
      let num = ch; i++;
      while (i < s.length && /\d/.test(s[i])) { num += s[i]; i++; }
      // 序号点：数字紧跟 "." 时保留（如 "1. R U" 的序号与点）
      if (i < s.length && s[i] === '.') { num += s[i]; i++; }
      // 数字紧跟完整 move 时作为其指数后缀（R 2 -> R2）；否则独立（序号/组重复次数）
      const last = toks[toks.length - 1];
      if (last && last !== '(' && last !== ')' && /[a-zA-Z]$/.test(last)) {
        toks[toks.length - 1] = last + num;
      } else {
        toks.push(num);
      }
      continue;
    }
    if (/[a-zA-Z]/.test(ch)) {
      let t = ch; i++;
      if (i < s.length && PRIME_CHARS.has(s[i])) { t += s[i]; i++; }
      if (i < s.length && s[i] === '2') { t += s[i]; i++; }
      toks.push(t);
      continue;
    }
    if (PRIME_CHARS.has(ch)) {
      // 单独出现的撇号：粘贴常把 "R '" 拆开，若前一个是完整 move 则合并回去
      const last = toks[toks.length - 1];
      if (last && last !== '(' && last !== ')' && /[a-zA-Z]$/.test(last)) {
        toks[toks.length - 1] = last + ch;
      }
      i++;
      continue;
    }
    i++; // 未知字符跳过
  }
  let out = '';
  for (const t of toks) {
    if (t === '(') { out += '('; }
    else if (t === ')') { out += ')'; }
    else if (/^\d+$/.test(t)) { out += t; }       // 组重复次数紧贴右括号（纯数字）
    else if (/^\d+\.$/.test(t)) { out += t + ' '; } // 行首序号前缀带空格（如 "2. "）
    else {
      if (out && !out.endsWith('(') && !out.endsWith(' ')) out += ' ';
      out += t;
    }
  }
  return out;
}

// ========== 魔方模拟（移植自 cube_scramble_viewer 的 Cube 类） ==========
class Cube {
  constructor(size, orientation) {
    this.size = size;
    this.faces = {};
    // 拿法：white-green=白顶绿前（标准 WCA）；yellow-red=黄顶红前
    const colors = orientation === 'yellow-red'
      ? { U: 'D', D: 'U', F: 'R', B: 'L', R: 'F', L: 'B' }
      : { U: 'U', D: 'D', F: 'F', B: 'B', R: 'R', L: 'L' };
    for (const [face, color] of Object.entries(colors)) {
      this.faces[face] = [];
      for (let r = 0; r < size; r++) {
        this.faces[face][r] = [];
        for (let c = 0; c < size; c++) {
          this.faces[face][r][c] = color;
        }
      }
    }
  }

  getFace(face) { return this.faces[face]; }

  rotateFaceCW(face) {
    const s = this.size;
    const m = this.faces[face];
    const n = [];
    for (let r = 0; r < s; r++) {
      n[r] = [];
      for (let c = 0; c < s; c++) {
        n[r][c] = m[s - 1 - c][r];
      }
    }
    this.faces[face] = n;
  }

  rotateFaceCCW(face) {
    const s = this.size;
    const m = this.faces[face];
    const n = [];
    for (let r = 0; r < s; r++) {
      n[r] = [];
      for (let c = 0; c < s; c++) {
        n[r][c] = m[c][s - 1 - r];
      }
    }
    this.faces[face] = n;
  }

  applyMove(move) {
    const face = move.face;
    const dir = move.dir; // 1 = CW, -1 = CCW, 2 = double

    const doCW = () => {
      this.rotateFaceCW(face);
      this._moveEdges(face, 1);
    };
    const doCCW = () => {
      this.rotateFaceCCW(face);
      this._moveEdges(face, -1);
    };

    if (dir === 2) {
      doCW(); doCW();
    } else if (dir === 1) {
      doCW();
    } else {
      doCCW();
    }
  }

  _moveEdges(face, dir) {
    const s = this.size;
    const n = s - 1;

    if (face === 'R') {
      for (let i = 0; i < s; i++) {
        const a = this.faces.U[i][n];
        const b = this.faces.F[i][n];
        const c = this.faces.D[i][n];
        const d = this.faces.B[s - 1 - i][0];
        if (dir === 1) { // CW: U→F→D→B→U
          this.faces.U[i][n] = d;
          this.faces.F[i][n] = a;
          this.faces.D[i][n] = b;
          this.faces.B[s - 1 - i][0] = c;
        } else { // CCW
          this.faces.U[i][n] = b;
          this.faces.F[i][n] = c;
          this.faces.D[i][n] = d;
          this.faces.B[s - 1 - i][0] = a;
        }
      }
    } else if (face === 'L') {
      for (let i = 0; i < s; i++) {
        const a = this.faces.U[i][0];
        const b = this.faces.B[s - 1 - i][n];
        const c = this.faces.D[i][0];
        const d = this.faces.F[i][0];
        if (dir === 1) { // CW: U→B→D→F→U
          this.faces.U[i][0] = d;
          this.faces.B[s - 1 - i][n] = a;
          this.faces.D[i][0] = b;
          this.faces.F[i][0] = c;
        } else {
          this.faces.U[i][0] = b;
          this.faces.B[s - 1 - i][n] = c;
          this.faces.D[i][0] = d;
          this.faces.F[i][0] = a;
        }
      }
    } else if (face === 'U') {
      for (let i = 0; i < s; i++) {
        const a = this.faces.F[0][i];
        const b = this.faces.R[0][i];
        const c = this.faces.B[0][i];
        const d = this.faces.L[0][i];
        if (dir === 1) { // CW: F→R→B→L→F
          this.faces.F[0][i] = d;
          this.faces.R[0][i] = a;
          this.faces.B[0][i] = b;
          this.faces.L[0][i] = c;
        } else {
          this.faces.F[0][i] = b;
          this.faces.R[0][i] = c;
          this.faces.B[0][i] = d;
          this.faces.L[0][i] = a;
        }
      }
    } else if (face === 'D') {
      for (let i = 0; i < s; i++) {
        const a = this.faces.F[n][i];
        const b = this.faces.L[n][i];
        const c = this.faces.B[n][i];
        const d = this.faces.R[n][i];
        if (dir === 1) { // CW: F→L→B→R→F
          this.faces.F[n][i] = d;
          this.faces.L[n][i] = a;
          this.faces.B[n][i] = b;
          this.faces.R[n][i] = c;
        } else {
          this.faces.F[n][i] = b;
          this.faces.L[n][i] = c;
          this.faces.B[n][i] = d;
          this.faces.R[n][i] = a;
        }
      }
    } else if (face === 'F') {
      for (let i = 0; i < s; i++) {
        const a = this.faces.U[n][i];
        const b = this.faces.R[i][0];
        const c = this.faces.D[0][s - 1 - i];
        const d = this.faces.L[s - 1 - i][n];
        if (dir === 1) { // CW: U→R→D→L→U
          this.faces.U[n][i] = d;
          this.faces.R[i][0] = a;
          this.faces.D[0][s - 1 - i] = b;
          this.faces.L[s - 1 - i][n] = c;
        } else {
          this.faces.U[n][i] = b;
          this.faces.R[i][0] = c;
          this.faces.D[0][s - 1 - i] = d;
          this.faces.L[s - 1 - i][n] = a;
        }
      }
    } else if (face === 'B') {
      for (let i = 0; i < s; i++) {
        const a = this.faces.U[0][s - 1 - i];
        const b = this.faces.L[i][0];
        const c = this.faces.D[n][i];
        const d = this.faces.R[s - 1 - i][n];
        if (dir === 1) { // CW: U→L→D→R→U
          this.faces.U[0][s - 1 - i] = d;
          this.faces.L[i][0] = a;
          this.faces.D[n][i] = b;
          this.faces.R[s - 1 - i][n] = c;
        } else {
          this.faces.U[0][s - 1 - i] = b;
          this.faces.L[i][0] = c;
          this.faces.D[n][i] = d;
          this.faces.R[s - 1 - i][n] = a;
        }
      }
    }
  }
}

// 展开图配色：与 cube_scramble_viewer standard 方案一致
const FACE_COLORS = { U: '#F9F9F9', D: '#F2F215', F: '#58D568', B: '#1C5FFE', R: '#ED3030', L: '#FFAF1C' };

function solveState(formulaStr, size, orientation) {
  const moves = parseFormula(formulaStr);
  const cube = new Cube(size || 2, orientation);
  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];
  for (const mv of moves) {
    cube.applyMove({ face: FACE_NAMES[mv.face], dir: mv.dbl ? 2 : (mv.prime ? -1 : 1) });
  }
  return cube;
}

// ========== 渲染 ==========
const A4_W = 1240, A4_H = 1754; // 150dpi

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 展开图：十字布局（U 上，L F R B 中排，D 下），参考 cube_scramble_viewer 的 drawCube/drawFace 风格
// 贴纸 2x2（二阶）/ 3x3（三阶）、贴纸间 2px 间隙、圆角 radius=3；深色面底板；白色贴纸 0.5px #ccc 描边；无面字母标签
function drawExpansion(ctx, cube, cx, cy, size) {
  const s = size || 2;
  const stickerSize = s === 3 ? 28 : 43;  // 二阶贴纸 43（较原 48 缩小 10%）；三阶 28 以适配行高
  const gap = 8;                          // 面间距
  const faceSize = stickerSize * s;
  const h = faceSize / 2;

  // 以 F 面中心 (cx, cy) 为锚点，计算各面左上角（标准十字）
  const fx = cx - h, fy = cy - h;
  const facePositions = {
    U: { x: fx, y: fy - faceSize - gap },                      // 上
    L: { x: fx - faceSize - gap, y: fy },                      // 左
    F: { x: fx, y: fy },                                       // 中
    R: { x: fx + faceSize + gap, y: fy },                      // 右
    B: { x: fx + 2 * (faceSize + gap), y: fy },                // 最右
    D: { x: fx, y: fy + faceSize + gap },                      // 下
  };

  for (const face of Object.keys(facePositions)) {
    drawFace(ctx, face, cube, facePositions[face].x, facePositions[face].y, stickerSize, s);
  }
}

function drawFace(ctx, face, cube, ox, oy, stickerSize, size) {
  const s = size || 2;
  const faceData = cube.faces[face];
  const faceSize = stickerSize * s;

  // 面底板：深色，比面大 2px 形成深色边框
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(ox - 2, oy - 2, faceSize + 4, faceSize + 4);

  // 2x2 贴纸：贴纸间 2px 间隙（1px 偏移 + 尺寸减 2）
  for (let r = 0; r < s; r++) {
    for (let c = 0; c < s; c++) {
      const colorKey = faceData[r][c];
      const stickerColor = FACE_COLORS[colorKey] || '#ddd';
      const x = ox + c * stickerSize + 1;
      const y = oy + r * stickerSize + 1;
      const ss = stickerSize - 2;
      const radius = 3;

      // 圆角矩形贴纸
      ctx.fillStyle = stickerColor;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + ss - radius, y);
      ctx.quadraticCurveTo(x + ss, y, x + ss, y + radius);
      ctx.lineTo(x + ss, y + ss - radius);
      ctx.quadraticCurveTo(x + ss, y + ss, x + ss - radius, y + ss);
      ctx.lineTo(x + radius, y + ss);
      ctx.quadraticCurveTo(x, y + ss, x, y + ss - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();

      // 白色贴纸加描边便于区分
      if (stickerColor === '#FFFFFF' || stickerColor === '#fff') {
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// 公式文本按可用宽度折行（最多两行，超出加省略号）
// 按词（move token）折行：绝不拆开 R2、R' 等完整符号，单行超宽则截断加省略号
function wrapText(text, maxW, ctx) {
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(test).width > maxW) {
      lines.push(cur);
      if (lines.length === 2) {
        // 第二行超限：按词边界截断并加省略号，避免拆开 R2、L' 等完整符号
        const parts = lines[1].split(' ');
        parts.pop();
        lines[1] = parts.join(' ') + '\u2026';
        return lines;
      }
      cur = w;
    } else {
      cur = test;
    }
  }
  if (cur && lines.length < 2) lines.push(cur);
  return lines;
}

function renderPage(formulas, pageIndex, rowsPerPage, name, date, title, startNo, cubeSize) {
  const canvas = document.createElement('canvas');
  canvas.width = A4_W;
  canvas.height = A4_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, A4_W, A4_H);

  const margin = 70;
  const no = startNo + pageIndex;

  // 顶部信息栏：姓名/标题同行，时间次行，标题下细横线
  ctx.fillStyle = '#000';
  ctx.font = '500 26px "SimSun", "Songti SC", serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('姓名：' + (name || '__________'), margin, 70);
  ctx.fillText('时间：' + (date || '__________'), margin, 112);

  ctx.font = '700 38px "SimHei", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title || '二阶魔方记忆训练', A4_W / 2, 82);

  ctx.strokeStyle = '#bbbbbb';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(margin, 152);
  ctx.lineTo(A4_W - margin, 152);
  ctx.stroke();

  // 内容行
  const rowTop = 170;
  const rowBottom = A4_H - 70;
  const rowH = (rowBottom - rowTop) / rowsPerPage;
  const formulaCol = margin + 30;          // 公式左对齐位置
  const expandCX = A4_W * 0.72;           // 展开图中心 x

  for (let r = 0; r < rowsPerPage; r++) {
    const idx = pageIndex * rowsPerPage + r;
    const y = rowTop + r * rowH;
    if (idx < formulas.length) {
      const f = formulas[idx];
      // 公式文本（原样显示，保持输入大小写），靠左靠上对齐；过长时在展开图前自动折行
      ctx.fillStyle = '#000';
      ctx.font = '500 27px Consolas, "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const es = (cubeSize === 3 ? 28 : 43) * cubeSize;
      const expHalf = (3 * es + 2 * 8) / 2;         // 展开图半宽/半高（十字宽=高）
      const maxTextWidth = A4_W / 2;                // 超过页面中央即换行（再提前三个字）
      const textTop = y + rowH / 2 - expHalf;       // 公式顶部与展开图上沿对齐
      // 序号前缀（如 "1. "）单独绘制，折行后第二行与公式符号对齐、不对齐序号
      const numMatch = f.text.match(/^(\d+\.)\s*/);
      const numPrefix = numMatch ? numMatch[1] + ' ' : '';
      const bodyText = numMatch ? f.text.slice(numMatch[0].length) : f.text;
      const numWidth = ctx.measureText(numPrefix).width;
      const textLines = wrapText(bodyText, maxTextWidth, ctx);
      if (numPrefix) ctx.fillText(numPrefix, formulaCol, textTop);
      textLines.forEach((ln, li) => ctx.fillText(ln, formulaCol + numWidth, textTop + li * 34));
      // 展开图
      const state = f.state;
      drawExpansion(ctx, state, expandCX, y + rowH / 2, cubeSize);
    }
    // 行分隔线
    if (r < rowsPerPage - 1) {
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(margin, y + rowH);
      ctx.lineTo(A4_W - margin, y + rowH);
      ctx.stroke();
    }
  }

  // 底部编号：靠上靠左，距页底 60px、距右边 110px
  ctx.fillStyle = '#000';
  ctx.font = '500 26px "SimSun", serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('NO.' + no, A4_W - 110, A4_H - 60);

  return canvas;
}

function generate() {
  const raw = document.getElementById('formulas').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const status = document.getElementById('status');
  const pagesEl = document.getElementById('pages');

  if (lines.length === 0) {
    status.textContent = '请先输入至少一条公式';
    status.className = 'status err';
    return;
  }

  const rowsPerPage = parseInt(document.getElementById('rowsPerPage').value, 10) || 5;
  const startNo = parseInt(document.getElementById('startNo').value, 10) || 1;
  const cubeSize = parseInt(document.getElementById('cubeSize').value, 10) || 2;
  const orientation = document.getElementById('orientation').value || 'white-green';
  const name = document.getElementById('name').value;
  const date = document.getElementById('date').value;
  const title = document.getElementById('title').value;

  const formulas = [];
  let bad = 0;
  for (const line of lines) {
    const moves = parseFormula(line);
    if (moves.length === 0) { bad++; continue; }
    formulas.push({ text: normalizeFormulaText(line), state: solveState(line, cubeSize, orientation) });
  }
  if (formulas.length === 0) {
    status.textContent = '未解析到有效公式';
    status.className = 'status err';
    return;
  }

  pagesEl.innerHTML = '';
  const pageCount = Math.ceil(formulas.length / rowsPerPage);
  for (let p = 0; p < pageCount; p++) {
    const canvas = renderPage(formulas, p, rowsPerPage, name, date, title, startNo, cubeSize);
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    wrap.appendChild(canvas);
    const label = document.createElement('div');
    label.className = 'page-label';
    label.textContent = '第 ' + (p + 1) + ' 页（共 ' + pageCount + ' 页）';
    const holder = document.createElement('div');
    holder.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    holder.appendChild(wrap);
    holder.appendChild(label);
    pagesEl.appendChild(holder);
  }

  status.textContent = '已生成 ' + pageCount + ' 页，共 ' + formulas.length + ' 条公式' + (bad ? '（忽略无效行 ' + bad + ' 行）' : '');
  status.className = 'status';
}

function exportPNG() {
  const wraps = document.querySelectorAll('#pages .page-wrap canvas');
  if (wraps.length === 0) {
    const status = document.getElementById('status');
    status.textContent = '请先生成练习纸';
    status.className = 'status err';
    return;
  }
  wraps.forEach((canvas, i) => {
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = '魔方记忆训练_第' + (i + 1) + '页.png';
    a.click();
  });
}

function exportPDF() {
  const canvases = document.querySelectorAll('#pages .page-wrap canvas');
  const status = document.getElementById('status');
  if (canvases.length === 0) {
    status.textContent = '请先生成练习纸';
    status.className = 'status err';
    return;
  }
  if (typeof window.jspdf === 'undefined') {
    status.textContent = 'PDF 库未加载（需联网加载 jsPDF），请检查网络后重试';
    status.className = 'status err';
    return;
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  canvases.forEach((canvas, i) => {
    if (i > 0) pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
  });
  pdf.save('魔方练习题生成器.pdf');
}
