<title>魔方打乱公式随机出题训练器</title>

<link rel="stylesheet" href="/assets/css/site-nav.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/site-layout.css">
<style>/* v2.1.9：原来这里挂了一组硬编码的浅色别名（#f2f4f7 / #eef1f5 / #6b7280 / #c0392b），
   被当成面板底与弱化字用；深色主题或换调色板后这些值不会跟着变，整页会出现「浅底浅字」。
   已全部改走 tokens.css 的 --surface* / --fg-3 / --red，此块删除。 */

  :root {
    /* ===== 本页的表面色别名（面板 / 次级块 / 弱化字 / 展开图底）=====
       ⚠️ v2.1.9 配色修复：原来这里用的是 --on-brand，语义搞错了 ——
       --on-brand 是「品牌色实底上的**文字**色」（tokens.css 注释原文），它只保证在默认
       主题下等于 --bg 的反相：默认浅色 #FFFFFF、默认深色 #0B0D14，所以看上去「黑白都对」。
       但只要换了调色板就不成立——白天+投影 / 墨夜 / 纸质 / 经典 这几个 palette 把
       --on-brand 定义成接近黑的深色（#00122E / #1A1206 / #102018 / #0A1226），
       于是页头、整条右栏、公式框、分段按钮、迷你按钮全变黑，而文字仍是浅色主题的深色
       → 「选了白天配色却大片黑色、公式字看不见」。
       正确做法：表面一律走 --surface 系列（玻璃主题另配 *-solid 实色副本，见 tokens.css），
       文字走 --fg / --fg-3，两者都由主题与调色板共同保证对比度。 */
    --panel: var(--surface-solid, var(--surface));          /* 面板 / 卡片底 */
    --panel-2: var(--surface-2-solid, var(--surface-2));    /* 次级块 / 悬停底 */
    --muted: var(--fg-3);                                   /* 弱化文字（含深色主题）*/
    --st-danger: var(--red);                                /* 语义红，随主题变亮变深 */
    --success: var(--green);
    --formula-bg: var(--surface-solid, var(--surface));     /* 公式框底 */
    --net-bg: var(--surface-2-solid, var(--surface-2));     /* 展开图外围底色 */
    --st-net-frame: var(--fg-2);     /* 展开图每面外框 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 单屏工具页：隐藏站点页脚。
     body 是 overflow:hidden 的全屏 flex 列，页脚会吃掉底部约 110px；
     浏览器放大后内容被压缩，页脚还会盖在公式大字/控件上（大屏投影时可见）。 */
  body > .site-footer { display: none !important; }

  /* ===== Header 精简版 ===== */
  .header {
    flex: 0 0 auto;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 56px;
    background: var(--panel);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .badge {
    background: rgba(29,78,216,0.10);
    color: var(--brand-strong);   /* 阶段四：--brand 在此底上仅 4.02:1 */
    padding: 3px 10px;
    border-radius: 0;
    font-size: 12px;
    border: 1px solid rgba(29,78,216,0.28);
    font-weight: 600;
  }
  .header .count {
    color: var(--muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .count b {
    color: var(--brand);
    font-size: 22px;
    font-weight: 700;
  }
  .header .reset {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 4px 12px;
    font-size: 12px;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
  }
  .header .reset:hover { color: var(--fg); border-color: var(--fg); }

  /* ===== 主区：左展开图 / 右栏（各占一半） ===== */
  .main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;   /* 左右各占屏幕一半 */
    min-height: 0;
  }

  /* 左：12 种转动示意图（大区，放大显示） */
  .left {
    background: var(--bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 18px 20px;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .left .legend-zone {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .left .legend-img-wrap {
    flex: 1 1 auto;
    min-height: 0;
  }

  /* 右栏：上=缩小展开图，下=公式区 */
  .right {
    display: grid;
    /* minmax(0,1fr)：允许公式行被压缩到内容高度以下（否则会把控件顶出视口） */
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
    background: var(--panel);
  }
  .net-zone {
    padding: 12px 16px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .net-zone .zone-label {
    color: var(--muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .net-zone .zone-label::before {
    content: '';
    width: 4px;
    height: 14px;
    background: var(--brand);
    border-radius: 0;
  }
  .net-img-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    /* 固定高度（基于视口比例，与 canvas 内容无关）：破除「读取父高→设 canvas 高→父再被撑高」的正反馈环。
       v2.1.6：改为纯视口比例 + 小 px 下限。原先 300px 下限在浏览器放大（CSS 视口变矮）时
       会超过 38vh，把右栏顶爆；用 vh 让缩放前后物理尺寸基本不变。
       flex:0 0 auto —— 缩放到 175% 时这块曾被 flex 压成 0 高（展开图整体消失）。 */
    height: clamp(160px, 38vh, 460px);
    flex: 0 0 auto;
    overflow: hidden;
  }
  .net-img-wrap canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }

  /* 对照图（大区卡片） */
  .legend-zone {
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: hidden;
  }
  .legend-zone .zone-label {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-zone .zone-label::before {
    content: '';
    width: 4px;
    height: 14px;
    background: var(--brand);
    border-radius: 0;
  }
  .legend-img-wrap {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .legend-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .legend-img-wrap canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .legend-zone .legend-caption {
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    margin-left: 4px;
  }
  .legend-zone .zone-label { flex-wrap: wrap; row-gap: 4px; }
  @media (max-width: 1180px) {
    .legend-zone .legend-caption { display: none; }   /* 窄栏时把宽度让给「全屏」按钮 */
  }
  .legend-fallback {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 16px;
    border: 2px dashed var(--line);
    border-radius: 0;
  }
  .legend-fallback code {
    color: var(--brand);
    background: rgba(29,78,216,0.10);
    padding: 1px 6px;
    border-radius: 0;
    font-size: 12px;
  }

  /* 右下：公式区（已压缩，把高度让给对照图） */
  .formula-zone {
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: auto;              /* 展开图放大后，公式区空间被压缩时允许滚动，避免控件被裁切 */
  }
  .formula-zone .zone-label {
    color: var(--muted);
    font-size: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .formula-zone .zone-label::before {
    content: '';
    width: 4px;
    height: 16px;
    background: var(--st-danger);
    border-radius: 0;
  }
  /* 六字母覆盖校验徽标 */
  .cover-badge {
    margin-left: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    background: rgba(21,128,61,0.10);
    border: 1px solid rgba(21,128,61,0.30);
    padding: 2px 9px;
    border-radius: 0;
    letter-spacing: 0.5px;
  }
  .cover-badge.warn {
    color: var(--amber);
    background: rgba(180,83,9,0.10);
    border-color: rgba(180,83,9,0.30);
  }

  /* 大字号公式显示（浅底黑字，课堂投影最清晰） */
  .formula-display {
    background: var(--formula-bg);
    border: 3px solid var(--fg);
    border-radius: 0;
    padding: 14px 12px;
    flex: 1 1 auto;          /* 吃掉剩余高度 */
    min-height: 120px;       /* 保证公式框有可用高度，不被控件挤压到一行 */
    overflow: auto;          /* 多步公式换行后若超高可滚动，不裁切 */
    display: flex;
    align-items: center;     /* 垂直居中 */
    justify-content: center; /* 水平居中 */
  }
  /* 公式两行以上时，溢出若被居中会「向上溢出被裁掉」（1080p 就已出现第 6 个字母切半）。
     safe center：装不下时改为顶端对齐，配合 overflow:auto 可滚动读完。 */
  @supports (align-items: safe center) {
    .formula-display { align-items: safe center; }
  }
  /* 公式文本：固定字号 + 居中 + 溢出滚动不裁切顶部 */
  .formula-inner {
    margin: auto;
    width: 100%;
  }
  .formula-inner {
    display: block;
    width: 100%;
    font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
    /* 教室投影级大字，但按视口高度/宽度双向封顶：
       1080p→82px（≈原 88px），150% 缩放时 55px×1.5=82px 物理大小不变；
       列宽变窄时（窄窗口/高缩放）按 4.4vw 收窄，6 步公式仍能单行显示。
       仍装不下（12/20 步）时由 fitFormula() 继续等比缩小。 */
    font-size: clamp(30px, min(7.6vh, 4.4vw), 88px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 2px;
    color: var(--bg);          /* 纯黑字 */
    text-align: center;
    white-space: normal;       /* 允许换行 */
    overflow-wrap: normal;
    word-break: break-word;
  }
  /* 单行模式（已弃用 nowrap：统一固定字号后一律允许换行） */
  .formula-inner.single {
    white-space: normal;
  }
  .formula-inner.single .move { padding: 0 2px; }
  .formula-inner.single .move.space { padding: 0 5px; }
  .formula-inner .move {
    color: var(--fg);          /* 字母主体：深色（浅色页 --bg 为近白，须用 --fg） */
    padding: 0 4px;
  }
  /* 修饰符用深色区分（白底上依然清晰，仍属深色系） */
  .formula-inner .move.prime { color: var(--st-danger); }   /* 带撇号 → 红（随主题自适应） */
  .formula-inner .move.dbl   { color: var(--brand-strong); }   /* 带 2   → 深蓝 */
  .formula-inner .move.space {
    color: var(--muted);
    padding: 0 10px;
    font-weight: 400;
  }

  /* 长度选择 */
  .length-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .length-row .lbl {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .length-row .seg__btn {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 0;
    padding: 9px 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--fg);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    min-width: 50px;
  }
  .length-row .seg__btn:hover { border-color: var(--brand); color: var(--brand); }
  .length-row .seg__btn.active {
    background: var(--brand);
    color: var(--on-brand);
    border-color: var(--brand);
  }

  /* 难度/魔方类型设置行（分段按钮 seg-toggle） */
  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .settings-row .lbl {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .seg-toggle {
    display: inline-flex;
    border: 2px solid var(--line);
    border-radius: 0;
    overflow: hidden;
  }
  .seg__btn {
    background: var(--panel);
    border: none;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .seg__btn:hover { color: var(--brand); }
  .seg__btn.active {
    background: var(--brand);
    color: var(--on-brand);
  }
  .seg__btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* 操作按钮 */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-shrink: 0;
  }
  .action-row .full {
    grid-column: 1 / -1;
  }
  .btn {
    color: var(--on-brand);
    border: none;
    border-radius: 0;
    padding: 16px 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(15,23,42,0.12);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--brand);
    color: var(--on-brand);   /* 阶段四：深色文字压在品牌蓝上仅 3.78:1，改白字 → 4.69:1 */
    font-size: 20px;
    padding: 20px 22px;
    box-shadow: 0 4px 12px rgba(29,78,216,0.28);
  }
  .btn.pink {
    background: var(--st-danger);
  }
  .btn.ghost {
    background: var(--panel);
    color: var(--fg);
    border: 1.5px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost:hover {
    background: var(--panel-2);
    border-color: var(--brand);
    color: var(--brand);
  }

  /* ===== 自定义打乱输入层 ===== */
  .cdlg {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9500;
    background: rgba(8, 12, 20, 0.55);
    padding: 16px;
    align-items: center;
    justify-content: center;
  }
  .cdlg.is-open { display: flex; }
  .cdlg__card {
    width: min(94vw, 620px);
    max-height: 88vh;
    overflow: auto;
    background: var(--surface-solid, var(--surface));
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 16px 18px 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
  }
  .cdlg__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 17px;
  }
  .cdlg__x {
    width: 34px; height: 34px;
    min-height: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--fg-3);
    border: 1px solid var(--line);
    border-radius: 0;
    font-size: 16px;
    cursor: pointer;
  }
  .cdlg__x:hover { color: var(--red); border-color: var(--red); }
  #cdlgInput {
    width: 100%;
    display: block;
    resize: vertical;
    background: var(--panel);
    color: var(--fg);
    border: 1.5px solid var(--line);
    border-radius: 0;
    padding: 10px 12px;
    font-family: ui-monospace, "SFMono-Regular", Consolas, "Microsoft YaHei", monospace;
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }
  #cdlgInput:focus { outline: none; border-color: var(--brand); }
  .cdlg__hint {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg-3);
  }
  .cdlg__hint code {
    font-family: ui-monospace, Consolas, monospace;
    background: var(--panel-2);
    padding: 1px 4px;
  }
  .cdlg__err {
    margin-top: 8px;
    font-size: 14px;
    color: var(--red);
  }
  .cdlg__foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 14px;
  }
  .cdlg__foot .btn { padding: 11px 18px; font-size: 15px; }

  /* ===== 分步抽屉 ===== */
  .steps-drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 45vh;
    background: var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 30px rgba(15,23,42,0.16);
    transform: translateY(100%);
    transition: transform 0.3s;
    z-index: 50;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .steps-drawer.show { transform: translateY(0); }
  .steps-drawer .head {
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel-2);
  }
  .steps-drawer .head h3 {
    font-size: 16px;
    color: var(--fg);
  }
  .steps-drawer .head .close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .steps-drawer .head .close:hover { color: var(--fg); }
  .steps-drawer .body {
    padding: 14px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .steps-drawer .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .step-item {
    background: var(--formula-bg);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .step-item .no {
    color: var(--muted);
    font-size: 12px;
    width: 28px;
    text-align: center;
  }
  .step-item .symbol {
    font-family: monospace;
    font-weight: 800;
    font-size: 22px;
    width: 60px;
    text-align: center;
  }
  .step-item .desc {
    color: var(--muted);
    flex: 1;
  }

;

const _PFD = {

const _PCOL = { U:'U', R:'R', F:'F', D:'D', L:'L', B:'B' };
const _PTD = {
  U: { axis: [0, 1, 0],  outer: true },
  D: { axis: [0,-1, 0],  outer: true },
  F: { axis: [0, 0, 1],  outer: true },
  B: { axis: [0, 0,-1],  outer: true },
  R: { axis: [1, 0, 0],  outer: true },
  L: { axis: [-1,0, 0],  outer: true },
  M: { axis: [-1,0, 0],  middle: true },
  E: { axis: [0,-1, 0],  middle: true },
  S: { axis: [0, 0, 1],  middle: true },
  r: { axis: [1, 0, 0],  wide: true },
  l: { axis: [-1,0, 0],  wide: true },
  u: { axis: [0, 1, 0],  wide: true },

  f: { axis: [0, 0, 1],  wide: true },

function parseScrambleNet(str){
  const cleaned = String(str||'').replace(/\s+/g,' ').trim();
  if(!cleaned) return [];
  const tokens = cleaned.split(/\s+/);
  const out = [];
  for(const tok of tokens){
    const m = tok.match(/^([RULDFBMESrludfbxyz])(2)?(')?$/);
    if(!m) continue;
    const base = m[1];
    let dir = 1;
    if(m[2]) dir = 2; else if(m[3]) dir = -1;
    const seq = expandMoveNet(base, dir);
    for(const sm of seq) out.push(sm);
  }
  return out;
}
function expandMoveNet(base, dir){
  const seq = [];
  const push = (face, d) => seq.push({face, dir: d});
  const pushMid = (axis, d) => seq.push({mid: axis, dir: d});
  switch(base){
    case 'R': push('R',dir); break;
    case 'L': push('L',dir); break;
    case 'U': push('U',dir); break;
    case 'D': push('D',dir); break;
    case 'F': push('F',dir); break;
    case 'B': push('B',dir); break;
    case 'M': pushMid('M',dir); break;
    case 'E': pushMid('E',dir); break;
    case 'S': pushMid('S',dir); break;
    case 'r': push('R',dir); pushMid('M',-dir); break;
    case 'l': push('L',dir); pushMid('M',dir); break;
    case 'u': push('U',dir); pushMid('E',-dir); break;
    case 'd': push('D',dir); pushMid('E',dir); break;
    case 'f': push('F',dir); pushMid('S',dir); break;
    case 'b': push('B',dir); pushMid('S',-dir); break;
    case 'x': push('R',dir); pushMid('M',-dir); push('L',-dir); break;
    case 'y': push('U',dir); pushMid('E',-dir); push('D',-dir); break;
    case 'z': push('F',dir); pushMid('S',dir); push('B',-dir); break;
  }
  return seq;
}

function drawScrambleNet(alg, canvasId, size){
  size = size || 3;   // 冻结契约：默认三阶（不传 = 原行为）
  const canvas = typeof canvasId === 'string' ? document.getElementById(canvasId) : (canvasId || document.getElementById("player"));
  if(!canvas) return;
  const cube = new Cube(size);
  cube.applyAlg(alg);

  const ctx = canvas.getContext('2d');

     放大到 175% 时容器只有 395×0，旧逻辑仍按 240×280 出图，画出来的位图比容器大，
     被 .net-img-wrap 的 overflow:hidden 裁掉一半（看起来就是「图突然变小/缺块」）。
     现在只用容器真实尺寸等比缩放，永远装得下。 */
  const availW = Math.max(Math.floor(rect.width) - 2, 80);
  const availH = Math.max(Math.floor(rect.height) - 2, 80);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  const totalW0 = 4*faceSize0 + 3*gap0 + 2*padding0;
  const totalH0 = 3*faceSize0 + 2*gap0 + 2*padding0;
  const scale = Math.min(availW/totalW0, availH/totalH0, 1.6);
  /* 缝隙与内边距跟着贴纸一起缩放：小尺寸时不会显得格子被粗白边吃掉 */
  const gap = gap0 * scale, padding = padding0 * scale;
  const stickerSize = baseSticker * scale;
  const faceSize = stickerSize * s;
  const totalW = 4*faceSize + 3*gap + 2*padding;
  const totalH = 3*faceSize + 2*gap + 2*padding;
  /* 同一公式 + 同一尺寸 + 同一 dpr → 跳过重画（ResizeObserver 防抖用） */
  const sig = Math.round(totalW) + 'x' + Math.round(totalH) + '@' + dpr + '#' + size + '|' + alg;
  if (canvas._sig === sig) return;
  canvas._sig = sig;
  canvas.width = Math.round(totalW * dpr);
  canvas.height = Math.round(totalH * dpr);
  canvas.style.width = totalW + 'px';
  canvas.style.height = totalH + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#f2f4f7';          /* 浅色底（与页面白底一致） */
  ctx.fillRect(0,0,totalW,totalH);

  const uX = faceSize + gap + padding, uY = padding;
  const lX = padding, lY = faceSize + gap + padding;
  const fX = faceSize + gap + padding, fY = faceSize + gap + padding;
  const rX = 2*faceSize + 2*gap + padding, rY = faceSize + gap + padding;
  const bX = 3*faceSize + 3*gap + padding, bY = faceSize + gap + padding;
  const dX = faceSize + gap + padding, dY = 2*faceSize + 2*gap + padding;
  const facePositions = {
    U:{x:uX,y:uY}, L:{x:lX,y:lY}, F:{x:fX,y:fY},
    R:{x:rX,y:rY}, B:{x:bX,y:bY}, D:{x:dX,y:dY}
  };
  for(const [face,pos] of Object.entries(facePositions)){
    drawNetFace(ctx, cube, face, pos.x, pos.y, stickerSize, colors);
  }
}

 * 立方体统一视角（3D 展示图 + 对照图里的小立方体共用同一套投影）
 *
 * 姿态：yaw −40°（相机绕竖轴偏到右前方 40°：F 面在左、R 面在右，两面宽度接近）

 *       与用户提供的实拍参考照一致；核心是「俯视」而不是「仰视」）
 * 投影：**透视**（不再是正交/等距）。正交投影近处远处一样大，魔方像一张贴片；
 *       真实眼睛看立方体一定是近大远小、棱线向远处收敛，所以这里按针孔相机模型投影：
 *   ① 相机空间（先绕 Y 轴转 yaw，再按俯仰角压扁）：
 *        X  =  x·cosY + z·sinY
 *        Z1 = −x·sinY + z·cosY       （水平方向的进深分量）
 *        Yc =  Z1·sinP − y·cosP      （屏幕 y，**向下为正**，画布直接相加）
 *        Zc =  y·sinP + Z1·cosP      （深度，越大越靠近观察者）
 *   ⚠️ Yc 里 y 的系数必须是 **负**：画布 y 向下，+y（顶面）要往上跑。
 *      写成 y·cosP − Z1·sinP 会让顶面跑到屏幕下方，整块魔方变成「仰视」。
 *   ② 透视除法：k = D / (D − Zc)，D = 相机到立方体中心的距离（单位：半边长 1）
 *
 * 透视后外轮廓不再上下/左右对称，所以下面按 8 个角点实测包围盒，
 * 把投影**平移居中 + 等比归一**（外轮廓半高恒为 3 个单位），
 * 这样共用它的画布居中、卡片尺寸、签名判断全都不用改。
 * ==================================================================== */
const CUBE_YAW   = -40 * Math.PI / 180;      /* 相机绕竖轴 40°（左右两个侧面宽度接近，与实拍参考照一致） */
const CUBE_COS_Y = Math.cos(CUBE_YAW);       /*  0.7660 */
const CUBE_SIN_Y = Math.sin(CUBE_YAW);       /* −0.6428 */

   原等距的 35.264°（sinP=1/√3）顶面翻得太开，像「从高处俯拍」；

function cubeCam(x, y, z){
  const X  =  x*CUBE_COS_Y + z*CUBE_SIN_Y;

           Z1*CUBE_SIN_P - y*CUBE_COS_P,     /* 屏幕 y，向下为正（顶面 → 屏幕上方） */

  const xs = [], ys = [];
  for (const x of [-1.5,1.5]) for (const y of [-1.5,1.5]) for (const z of [-1.5,1.5]){

     透视投影对深度敏感，画在内缩平面（旧版用 ±1）会让整面贴纸偏小、与轮廓脱开。 */
  const quadOf = {
    U: (r,c) => {
      const x0 = base + c*step, z0 = base + r*step;
      return [[x0,B,z0],[x0+step,B,z0],[x0+step,B,z0+step],[x0,B,z0+step]];
    },
    F: (r,c) => {
      const x0 = base + c*step, y0 = B - r*step;
      return [[x0,y0,B],[x0+step,y0,B],[x0+step,y0-step,B],[x0,y0-step,B]];
    },
    R: (r,c) => {
      const z0 = B - c*step, y0 = B - r*step;
      return [[B,y0,z0],[B,y0,z0-step],[B,y0-step,z0-step],[B,y0-step,z0]];
    }
  };
  const outlineOf = {
    U: [[-B,B,-B],[ B,B,-B],[ B,B, B],[-B,B, B]],
    F: [[-B,B, B],[ B,B, B],[ B,-B,B],[-B,-B,B]],
    R: [[ B,B, B],[ B,B,-B],[ B,-B,-B],[ B,-B, B]]
  };
  const faces = ['U','F','R'];

  /* ① 深色底座 = 魔方骨架（贴纸收边后露出的深色缝隙） */
  ctx.fillStyle = FRAME;
  for(const f of faces){
    const pts = outlineOf[f].map(p=>P(p[0],p[1],p[2]));
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  /* ② 逐张贴纸上色（向各自 3D 中心收 90%，形成均匀缝隙）。
     必须在 **3D 空间**收缩再投影：透视下各格宽度不同，若先投影再按 2D 中心收，
     缝隙宽度会随深度跳变，肉眼看起来像贴纸错位/阶梯。 */
  const k = 0.9;
  for(const f of faces){
    const data = cube.getFace(f);
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        const q3 = quadOf[f](r,c);
        const c3 = [
          (q3[0][0]+q3[1][0]+q3[2][0]+q3[3][0])/4,
          (q3[0][1]+q3[1][1]+q3[2][1]+q3[3][1])/4,
          (q3[0][2]+q3[1][2]+q3[2][2]+q3[3][2])/4
        ];
        const pts = q3.map(p=>P(
          c3[0] + (p[0]-c3[0])*k,
          c3[1] + (p[1]-c3[1])*k,
          c3[2] + (p[2]-c3[2])*k
        ));
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for(let i=1;i<4;i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.closePath();
        const col = NET_COLORS[data[r][c]] || '#e5e7eb';
        ctx.fillStyle = col;
        ctx.fill();
        if(col === '#FFFFFF'){          /* 白贴纸描边：浅底上不糊成一片 */
          ctx.lineWidth = 1;
          ctx.strokeStyle = '#9ca3af';
          ctx.stroke();
        }
      }
    }
  }
  /* ③ 外轮廓加重（立体的「棱」）—— 顶点用外框半边长 B（三阶 1.5 / 二阶 2），
     与贴纸、深色底座严格对齐，否则轮廓外会露出一圈背景 */
  ctx.strokeStyle = EDGE3;
  ctx.lineWidth = Math.max(2, W*0.013);   /* 按画布宽度取，换视角缩放 s 变化也不会变粗/变细 */
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const sil = [[-B,B,-B],[B,B,-B],[B,-B,-B],[B,-B,B],[-B,-B,B],[-B,B,B]];
  sil.forEach((p,i)=>{ const q = P(p[0],p[1],p[2]); i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]); });
  ctx.stroke();
  [[[-B,B,B],[B,B,B]],[[B,B,B],[B,-B,B]],[[B,B,B],[B,B,-B]]].forEach(seg=>{
    const a = P(seg[0][0],seg[0][1],seg[0][2]);
    const b = P(seg[1][0],seg[1][1],seg[1][2]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  });
}

function drawNetFace(ctx, cube, face, ox, oy, stickerSize, colors){
  const s = cube.size;
  const faceData = cube.getFace(face);
  const faceSize = stickerSize * s;
  ctx.fillStyle = '#374151';          /* 深色外框：白底上更清晰 */
  ctx.fillRect(ox-2, oy-2, faceSize+4, faceSize+4);
  for(let r=0;r<s;r++){
    for(let c=0;c<s;c++){
      const colorKey = faceData[r][c];
      const stickerColor = colors[colorKey];
      const x = ox + c*stickerSize + 1;
      const y = oy + r*stickerSize + 1;
      const ss = stickerSize - 2;
      ctx.fillStyle = stickerColor;
      ctx.fillRect(x, y, ss, ss);
      if(stickerColor === '#FFFFFF'){
        ctx.strokeStyle = '#9ca3af';  /* 白色贴纸描边（U 面） */
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, ss, ss);
      }
    }
  }
}

/* ====================================================================
 * 业务逻辑
 * ==================================================================== */

const FACES = ['R', 'U', 'F', 'L', 'D', 'B'];
const AXIS_OPPOSITE = { R:'L', L:'R', U:'D', D:'U', F:'B', B:'F' };
const MODIFIERS = ['', '', '', "'", "'", '2'];

/* ---------- 工具 ---------- */
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 判断某一步能否接在当前序列后面（WCA 打乱规则） */
function isValidNext(seq, f) {
  const last = seq[seq.length - 1];   // 上一步
  const prev = seq[seq.length - 2];   // 上两步
  if (f === last) return false;                       // 不能同面连续 R R
  if (last && AXIS_OPPOSITE[f] === last) return false; // 不能同轴对面 R L / U D / F B
  if (f === prev) return false;                        // 隔一步也不能同面 R L R
  return true;
}

/**
 * 生成面序列，硬性保证：传入的字母集合每个都至少出现一次
 * 策略：随机贪心 + 覆盖优先 + 失败重试；
 *      当「剩余空位 == 还没出现的字母数」时，强制只从缺失字母里挑，
 *      因此 6 步题正好是六字母各一次，8~20 步则是六字母全覆盖后再随机补足。
 * 冻结契约：第二参 allowedFaces 不传 = 全六字母（向后兼容）；'ruf' → ['R','U','F']。
 */
function buildFaceSequence(length, allowedFaces) {
  allowedFaces = allowedFaces || FACES;   // 不传 = 全六字母（老调用方不崩）
  for (let attempt = 0; attempt < 400; attempt++) {
    const seq = [];
    const missing = new Set(allowedFaces);   // 还没出现过的字母
    let failed = false;

    for (let i = 0; i < length; i++) {
      const slotsLeft = length - i;
      let pool;

      if (slotsLeft <= missing.size) {
        // 位置刚够（或不够）→ 只能补缺失字母，保证全覆盖
        pool = shuffleArr([...missing]);
      } else if (missing.size > 0 && Math.random() < 0.55) {
        // 还有余量时，55% 概率优先补没出现过的字母 → 分布更均匀
        pool = shuffleArr([...missing]).concat(shuffleArr(allowedFaces).filter(f => !missing.has(f)));
      } else {
        pool = shuffleArr(allowedFaces);
      }

      let picked = null;
      for (const f of pool) {
        if (isValidNext(seq, f)) { picked = f; break; }
      }
      if (picked === null) { failed = true; break; }  // 死路 → 重试

      seq.push(picked);
      missing.delete(picked);
    }

    if (!failed && missing.size === 0) return seq;
  }

  /* 兜底（几乎不会走到）：排列 + 按规则补齐 */
  const seq = shuffleArr(allowedFaces);
  for (let i = 1; i < seq.length; i++) {          // 拆散相邻的同轴对面
    if (AXIS_OPPOSITE[seq[i]] === seq[i - 1]) {
      for (let j = i + 1; j < seq.length; j++) {
        if (AXIS_OPPOSITE[seq[j]] !== seq[i - 1]) { [seq[i], seq[j]] = [seq[j], seq[i]]; break; }
      }
    }
  }
  while (seq.length < length) {
    const cands = shuffleArr(allowedFaces).filter(f => isValidNext(seq, f));
    seq.push(cands.length ? cands[0] : allowedFaces[Math.floor(Math.random() * allowedFaces.length)]);
  }
  return seq;
}

/* 自选两个字母（幼儿园）：题目只由选中的 2 个字母组成，
 * 并且保证 X / X' / Y / Y' 四种符号都出现（4 步时正好各一次）。
 * 两个字母严格交替（R U R' U' 这种），不会出现 R R' 自我抵消——
 * 这也正是二阶/两字母打乱的标准形态。 */
function buildCustomMoves(length, letters, allowDouble){
  const A = letters[0], B = letters[1];
  const seq = [];
  for (let i = 0; i < length; i++) seq.push({ face: (i % 2 === 0) ? A : B, mod: '' });

  /* 每种字母挑两格分别放「顺时针」「逆时针」→ 四种符号必然齐全 */
  const slots = { [A]: [], [B]: [] };
  seq.forEach((s, i) => slots[s.face].push(i));
  const fixed = new Set();
  for (const L of [A, B]) {
    const list = slots[L];
    if (!list.length) continue;
    const useSecond = list.length > 1 && Math.random() < 0.5;
    seq[list[0]].mod = useSecond ? "'" : '';
    fixed.add(list[0]);
    if (list.length > 1) {
      seq[list[1]].mod = useSecond ? '' : "'";
      fixed.add(list[1]);
    }
  }
  /* 其余位置随机：180° 只占约 1/5，避免太小的小朋友被 X2 打乱节奏 */
  const pool = allowDouble ? ['', "'", '', "'", '2'] : ['', "'"];
  seq.forEach((s, i) => {
    if (fixed.has(i)) return;
    s.mod = pool[Math.floor(Math.random() * pool.length)];
  });
  /* 一半概率整体反向：同样的四种符号，起手不同，不会每题长得一样 */
  if (Math.random() < 0.5) seq.reverse();
  return seq.map(s => ({
    face: s.face,
    dir: s.mod === "'" ? -1 : (s.mod === '2' ? 2 : 1),
    mod: s.mod
  }));
}

function generateScramble(length) {
  if (currentMoveSet === 'custom') {
    const letters = customLetters.slice(0, 2);
    return buildCustomMoves(length, letters, true);
  }
  // 冻结契约：内部把 currentMoveSet 解析成 allowedFaces 透传给 buildFaceSequence
  const allowedFaces = currentMoveSet === 'ruf' ? ['R','U','F'] : FACES;
  const faces = buildFaceSequence(length, allowedFaces);
  return faces.map(face => {
    const mod = MODIFIERS[Math.floor(Math.random() * MODIFIERS.length)];
    const dir = mod === "'" ? -1 : (mod === '2' ? 2 : 1);
    return { face, dir, mod };
  });
}

/* 校验：当前公式是否已覆盖 R U F L B D 六个字母 */
function coveredFaces(moves) {
  return new Set((moves || []).map(m => m.face));
}

function movesToText(moves) {
  return moves.map(m => m.face + m.mod).join(' ');
}

const FACE_CN = { R:'右面', L:'左面', U:'顶层', D:'底层', F:'前层', B:'后层' };
const DIR_CN = { 1:'顺时针90°', '-1':'逆时针90°', 2:'180°' };

function describeMove(m) {
  const faceCN = FACE_CN[m.face] || m.face;
  const dirCN = DIR_CN[m.dir] || (m.mod === "'" ? '逆时针90°' : (m.mod === '2' ? '180°' : '顺时针90°'));
  return `${faceCN}${dirCN}`;
}

function renderFormula(moves) {
  const el = document.getElementById('formulaInner');
  if (!el) return;
  if (!moves || moves.length === 0) { el.innerHTML = '—'; return; }
  const html = moves.map(m => {
    const cls = m.mod === "'" ? 'move prime' : (m.mod === '2' ? 'move dbl' : 'move');
    return `<span class="${cls}">${m.face}${m.mod}</span>`;
  }).join('<span class="move space"> </span>');
  el.innerHTML = html;
}

/**
 * 公式字号：CSS 基准（clamp，按视口高度/宽度自适应，教室投影级大字），
 * 只在「装不下」时往下缩，绝不放大——保证任何缩放倍率、任何步数下整条公式都能读完，
 * 不会出现「公式被裁掉一半」或「控件被公式顶出屏幕」。
 * v2.1.6：原实现是空函数（字号写死 88px），浏览器放大后必然溢出。
 */
function fitFormula() {
  const inner = document.getElementById('formulaInner');
  if (!inner) return;
  inner.classList.remove('single');
  inner.style.fontSize = '';   // 先回到 CSS 基准字号
  const box = inner.parentElement;
  if (!box) return;
  // 手机端有独立的单屏方案（公式框自身滚动），不参与缩放
  if (window.matchMedia && !window.matchMedia('(min-width: 769px)').matches) return;

  let size = parseFloat(getComputedStyle(inner).fontSize) || 0;
  if (!size) return;
  for (let i = 0; i < 16 && size > 20; i++) {
    if (box.scrollHeight <= box.clientHeight + 2) break;
    size = Math.max(20, Math.floor(size * 0.88));
    inner.style.fontSize = size + 'px';
  }
}


let count = 0;
let currentLength = 6;
let currentMoveSet = 'all';   // 'all' | 'ruf' | 'custom'（'ruf' 为冻结契约，T5 复用）
let currentCubeType = '3';    // '2' | '3'（冻结契约：二阶/三阶切换）
let customLetters = ['R', 'U'];   // 自选字母模式：固定两个字母
let netMode = 'flat';             // 'flat' 平面展开图 | '3d' 立体图

/* 对照图该画哪些符号：自选模式只画选中的两个字母（4 张，最贴合课堂） */
function legendItemsFor(size, moveSet){
  const all = window.MOVES || [];
  if (moveSet === 'custom') {
    const letters = customLetters.slice(0, 2);
    return all.filter(m => letters.includes(m.name.replace("'", '')));
  }
  if (size === 2) return all.filter(m => ['R','U','F'].includes(m.name.replace("'", '')));
  return all;
}

/* 展示图：平面展开图 / 3D 立体图，共用「当前题目」 */
function renderNetDisplay(){
  const alg = window._currentText || '';
  const size = window._currentCubeSize || 3;
  const flat = document.getElementById('netCanvas');
  const d3 = document.getElementById('net3dCanvas');
  if (!flat || !d3) return;
  flat.hidden = netMode !== 'flat';
  d3.hidden = netMode !== '3d';
  if (netMode === 'flat') drawScrambleNet(alg, flat, size);
  else drawScramble3D(alg, d3, size);
}

function setNetMode(mode){
  netMode = (mode === '3d') ? '3d' : 'flat';
  document.querySelectorAll('#netModeToggle .seg__btn, #fsModeToggle .seg__btn').forEach(b => {
    b.classList.toggle('active', b.dataset.nm === netMode);
  });
  renderNetDisplay();
  if (window.FSViewer) window.FSViewer.onNetModeChange();
}

function newQuestion() {
  const size = currentCubeType === '2' ? 2 : 3;
  /* 从「自定义打乱」回到随机出题：按钮文字复位 */
  const _nb = document.getElementById('newBtn');
  if (_nb) _nb.textContent = '🎲 换一题';
  window._customMode = false;
  // 2×2 强制 RUF（兜底，即使 UI 锁死也保证）
  if (currentCubeType === '2' && currentMoveSet !== 'custom') currentMoveSet = 'ruf';
  const moves = generateScramble(currentLength);
  const text = movesToText(moves);
  renderFormula(moves);

  window._currentMoves = moves;
  window._currentText = text;
  window._currentCubeSize = size;   // 供 resize / 全屏时重绘
  renderNetDisplay();

  count++;
  document.getElementById('countNum').textContent = count;

  /* 覆盖校验徽标 */
  const badge = document.getElementById('coverBadge');
  if (badge) {
    let need, label;
    if (currentMoveSet === 'custom') {
      need = [];
      customLetters.slice(0, 2).forEach(L => { need.push(L, L + "'"); });
      label = '✓ ' + customLetters.slice(0, 2).join(' ') + ' 四种符号齐全';
    } else {
      need = currentMoveSet === 'ruf' ? ['R','U','F'] : FACES;
      label = currentMoveSet === 'ruf' ? '✓ R U F 齐全' : '✓ R U F L B D 齐全';
    }
    let miss;
    if (currentMoveSet === 'custom') {
      const have = new Set(moves.map(m => m.face + m.mod));
      miss = need.filter(s => !have.has(s));
    } else {
      const cov = coveredFaces(moves);
      miss = need.filter(f => !cov.has(f));
    }
    if (miss.length === 0) {
      badge.textContent = label;
      badge.classList.remove('warn');
    } else {
      badge.textContent = '⚠ 缺 ' + miss.join(' ');
      badge.classList.add('warn');
    }
  }

  // 对照图随 阶数 / 模式 重绘：自选模式只显示选中的两个字母
  if (window.buildLegend) window.buildLegend(legendItemsFor(size, currentMoveSet), size);

  // 等布局稳定后再自适应字号（保证拿到真实的可用空间）
  requestAnimationFrame(fitFormula);
}

/* ====================================================================
 * 自定义打乱：老师自己敲一条（讲义上的、学生做错的、某个具体状态），
 * 照它显示展示图 / 公式，不改随机出题的设置。
 * ==================================================================== */
const CUSTOM_TOKEN_RE = /^([RULDFBMESrludfbxyz])(2|')?(2)?$/;
/* 把用户输入规范成 [{face, mod}]：
   - 各种撇号（’ ′ ` ´）统一成 '，括号当空白，大小写都认
   - 宽转 r u f d l b、中层 M E S、整体转向 x y z 一并放行
     （Cube.applyAlg 本来就支持，显示图、3D 图都能画出来） */
function parseCustomAlg(str){
  const raw = String(str || '')
    .replace(/[\u2018\u2019\u2032\u02BC\u00B4\u0060]/g, "'")
    .replace(/[()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!raw) return { moves: [], bad: [], text: '' };
  const moves = [], bad = [];
  for (const tk of raw.split(' ')){
    const m = tk.match(CUSTOM_TOKEN_RE);
    if (!m){ bad.push(tk); continue; }
    let mod = '';
    if (m[2] === '2' || m[3] === '2') mod = '2';
    else if (m[2] === "'") mod = "'";
    moves.push({ face: m[1], mod });
  }
  return { moves, bad, text: moves.map(mv => mv.face + mv.mod).join(' ') };
}

/* 应用一条自定义打乱。返回 {ok, msg}，msg 用于弹层里的提示条。 */
function applyCustomScramble(str){
  const p = parseCustomAlg(str);
  if (p.moves.length === 0){
    return { ok: false, msg: p.bad.length ? ('没识别出打乱步骤：' + p.bad.slice(0, 5).join(' ')) : '请输入一条打乱' };
  }
  const size = currentCubeType === '2' ? 2 : 3;
  window._currentMoves    = p.moves;
  window._currentText     = p.text;
  window._currentCubeSize = size;
  window._customMode      = true;

  renderFormula(p.moves);
  renderNetDisplay();
  if (window.buildLegend) window.buildLegend(legendItemsFor(size, currentMoveSet), size);

  const badge = document.getElementById('coverBadge');
  if (badge){
    badge.textContent = '✎ 自定义 ' + p.moves.length + ' 步';
    badge.classList.remove('warn');
  }
  const nb = document.getElementById('newBtn');
  if (nb) nb.textContent = '🎲 随机出题';

  requestAnimationFrame(fitFormula);
  return { ok: true, msg: p.bad.length ? ('已忽略无法识别：' + p.bad.slice(0, 5).join(' ')) : '' };
}

/* ---------- 自定义打乱弹层 ---------- */
(function initCustomDialog(){
  const dlg    = document.getElementById('cdlg');
  if (!dlg) return;
  const input  = document.getElementById('cdlgInput');
  const errEl  = document.getElementById('cdlgErr');

  function setErr(msg){
    if (!errEl) return;
    errEl.textContent = msg || '';
    errEl.hidden = !msg;
  }
  function open(){
    if (input){
      /* 已有题目时预填，方便在现有打乱上改几个字母；随机题也预填，删改都方便 */
      input.value = window._currentText || '';
    }
    setErr('');
    dlg.classList.add('is-open');
    dlg.setAttribute('aria-hidden', 'false');
    setTimeout(() => { if (input){ input.focus(); input.select(); } }, 30);
  }
  function close(){
    dlg.classList.remove('is-open');
    dlg.setAttribute('aria-hidden', 'true');
  }
  function apply(){
    const r = applyCustomScramble(input ? input.value : '');
    if (!r.ok){ setErr(r.msg); return; }
    if (r.msg){ setErr(r.msg); }      /* 部分忽略：留在弹层里提示，让老师看见 */
    else close();
  }

  const btn = document.getElementById('customBtn');
  if (btn) btn.addEventListener('click', open);
  const xBtn = document.getElementById('cdlgClose');
  if (xBtn) xBtn.addEventListener('click', close);
  const cBtn = document.getElementById('cdlgCancel');
  if (cBtn) cBtn.addEventListener('click', close);
  const aBtn = document.getElementById('cdlgApply');
  if (aBtn) aBtn.addEventListener('click', apply);
  /* 点遮罩关闭（点卡片内部不关） */
  dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); });
  /* Ctrl/⌘ + Enter 直接显示；Esc 关闭（这个监听要早于全屏层的同类监听，
     但全屏层自己会判断 isOpen，两者不会互相干扰） */
  dlg.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); apply(); }
  });
})();

/* 长度档位随「阶数 + 模式」变化：自选字母最短 4 步（正好 R U R' U' 一轮） */
function allowedLengths(){
  if (currentMoveSet === 'custom') return [4, 6, 8, 10, 12];
  return currentCubeType === '2' ? [6, 8, 10, 12, 15] : [6, 8, 10, 12, 20];
}
function syncLengthButtons(){
  const allowed = allowedLengths();
  if (!allowed.includes(currentLength)) currentLength = 12;   // 12 在所有档位里都有
  document.querySelectorAll('.seg__btn[data-len]').forEach(btn => {
    const len = parseInt(btn.dataset.len, 10);

/* 字母按钮：2 阶只允许 R/U/F（D/B/L 对 2 阶等于整体转，没教学意义） */
function syncLetterChips(){
  const allow = currentCubeType === '2' ? ['R','U','F'] : ['R','U','F','L','D','B'];
  if (currentCubeType === '2') {
    customLetters = customLetters.filter(L => allow.includes(L));
    while (customLetters.length < 2) {
      const cand = allow.find(L => !customLetters.includes(L));
      customLetters.push(cand);
    }
  }
  document.querySelectorAll('.letter-chip').forEach(chip => {
    const L = chip.dataset.letter;
    chip.disabled = !allow.includes(L);
    chip.classList.toggle('active', customLetters.includes(L));
  });
  const hint = document.getElementById('lettersHint');
  if (hint) hint.textContent = '已选 ' + customLetters.slice(0, 2).join(' + ');
  const row = document.getElementById('lettersRow');
  if (row) row.hidden = currentMoveSet !== 'custom';
}

function setLength(len) {

function resetCount() {

let toastTimer = null;

  document.querySelectorAll('#movesetToggle .seg__btn').forEach(b => {

      syncLetterChips();
      syncLengthButtons();

  // 自选字母：始终保留 2 个；再点第三个就把先选的那个顶掉
  document.querySelectorAll('.letter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if (chip.disabled) return;
      const L = chip.dataset.letter;
      if (customLetters.includes(L)) {
        showToast('已选 ' + customLetters.slice(0, 2).join(' + ') + '，点其它字母可替换');
        return;
      }
      if (customLetters.length >= 2) {
        const keep = customLetters[1];
        if (keep === AXIS_OPPOSITE[L]) {
          showToast(L + ' 和 ' + keep + ' 是相对的两面，换一个吧');
          return;
        }
        customLetters = [keep, L];
      } else {
        if (customLetters.includes(AXIS_OPPOSITE[L])) {
          showToast(L + ' 和 ' + AXIS_OPPOSITE[L] + ' 是相对的两面，换一个吧');
          return;
        }
        customLetters.push(L);
      }
      syncLetterChips();
      if (currentMoveSet === 'custom') newQuestion();
    });
  });

  // 展示图：平面 / 3D 切换；点图直接全屏
  document.querySelectorAll('#netModeToggle .seg__btn').forEach(b => {

  if (netFsBtn) netFsBtn.addEventListener('click', (e) => {

  const legendFsBtn = document.getElementById('legendFsBtn');

  });
  const legendWrap = document.getElementById('legendWrap');
  if (legendWrap) legendWrap.addEventListener('click', (e) => {
    if (!window.FSViewer) return;
    const idx = legendIndexAt(e.clientX, e.clientY);
    window.FSViewer.openLegend(idx < 0 ? 0 : idx);
  });

  // 魔方类型切换（二阶 / 三阶）
  document.querySelectorAll('#cubeTypeToggle .seg__btn').forEach(b => {
    b.addEventListener('click', () => {
      currentCubeType = b.dataset.cube;
      document.querySelectorAll('#cubeTypeToggle .seg__btn').forEach(x => x.classList.toggle('active', x === b));
      // 2×2 不支持「六面标准」（D/B/L 等于整体转）→ 自动落到 RUF
      const allBtn = document.querySelector('#movesetToggle .seg__btn[data-set="all"]');
      if (currentCubeType === '2') {
        if (currentMoveSet === 'all') {
          currentMoveSet = 'ruf';
          document.querySelectorAll('#movesetToggle .seg__btn').forEach(x => x.classList.toggle('active', x.dataset.set === 'ruf'));
        }
        allBtn.disabled = true;
      } else {

      }
      syncLetterChips();     // 2 阶只保留 R/U/F
      syncLengthButtons();   // 长度档位随模式/阶数变化
      newQuestion();
    });
  });

  /* —— 视觉重绘（v2.1.6）——
     浏览器缩放会同时改变 CSS 视口尺寸与 devicePixelRatio。旧实现只在 window.resize 里
     重画展开图，对照图永远停在首次绘制的那张位图上，被 CSS 拉伸 → 大屏变模糊、
     object-fit 留白 → 看起来「有的地方放大、有的地方缩小」。
     改为 ResizeObserver 驱动：容器尺寸 / dpr 变化都让两块画布按新尺寸重画。 */
  let redrawRaf = 0;
  function redrawVisuals() {
    const size = window._currentCubeSize || 3;
    if (window._currentText) renderNetDisplay();
    if (window.buildLegend) window.buildLegend(legendItemsFor(size, currentMoveSet), size);
    fitFormula();
  }
  function scheduleRedraw() {
    if (redrawRaf) cancelAnimationFrame(redrawRaf);
    redrawRaf = requestAnimationFrame(() => { redrawRaf = 0; redrawVisuals(); });
  }

  /* 容器尺寸变化（含浏览器缩放、窗口拖动、分屏） */
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(scheduleRedraw);
    ['netCanvas', 'legendCanvas'].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.parentElement) ro.observe(el.parentElement);
    });
  }
  /* 已布局完成后再补一次：首帧字体/导航高度可能还在变 */
  window.addEventListener('load', scheduleRedraw);

  /* dpr 单独变化（跨屏拖动到另一块缩放比例的显示器）不一定触发 resize → 用 resolution 媒体查询兜住 */
  (function watchDpr(){
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    const handler = () => { scheduleRedraw(); watchDpr(); };
    if (mq.addEventListener) mq.addEventListener('change', handler, { once: true });
    else if (mq.addListener) mq.addListener(handler);
  })();

  syncLetterChips();
  syncLengthButtons();
  newQuestion();
  // 首屏布局可能还在抖动，补一次字号自适应
  window.addEventListener('load', fitFormula);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
/* ====================================================================
 * 对照图模块：魔方转动示意图（12 种单层转动，等距投影自绘）
 * 视觉风格：白色圆角卡片 · 浅色底 · 魔方描边 · 红色直线箭头（醒目）
 * · 深蓝灰粗体标签居中于卡片下方
 * 箭头：贴合魔方表面的红色直线箭头（沿该层转动切向），顺/逆同色、以指向区分
 * 二阶/三阶各自保持真实阶数（2×2 仅 R/U/F，3×3 全 12 个），统一采用浅色底 + 红色箭头 + 魔方描边风格
 * ==================================================================== */
(function(){
"use strict";
const BASE_S = 27;             /* 基准贴纸尺寸（三阶） */
let S = BASE_S;                /* 当前绘制尺寸：二阶按 3/4 缩放，使外轮廓与三阶等大 */
const MARK = "#FFE08A";        /* 转动层贴纸（浅黄填充，浅底上清晰可辨，与白贴纸区分） */
const WHITE = "#FFFFFF";       /* 白：未转动贴纸 */
const EDGE = "#475569";        /* 贴纸描边（深灰蓝，浅底上勾勒魔方轮廓） */
const CARD_BG = "#FFFFFF";     /* 白色圆角卡片（浅色主题） */
const CARD_LINE = "#E2E8F0";   /* 卡片外框（浅灰） */
const ARROW = "#E53935";       /* 红色直线箭头（醒目，顺/逆同色以指向区分） */
const LABEL = "#1E293B";       /* 深蓝灰标签（浅底上清晰） */

/* 每项: [画在哪个可见面, 面上锚点(3D, 贴纸中心), 箭头方向(3D, 转动切向)]
 *   锚点所在 cubie 属于该转动层，方向 = 该处贴纸随层转动的移动方向
 *   面: x=右面 / y=顶面 / z=前面 */
const MOVES = [
  {name:"R",  axis:"x", layer: 1, arr:["front",[1, 0, 1],[0, 1,0]]},
  {name:"R'", axis:"x", layer: 1, arr:["front",[1, 0, 1],[0,-1,0]]},
  {name:"F",  axis:"z", layer: 1, arr:["top",  [0, 1, 0.9],[1,0,0]]},
  {name:"F'", axis:"z", layer: 1, arr:["top",  [0, 1, 0.9],[-1,0,0]]},
  {name:"L",  axis:"x", layer:-1, arr:["front",[-1,0, 1],[0,-1,0]]},
  {name:"L'", axis:"x", layer:-1, arr:["front",[-1,0, 1],[0, 1,0]]},
  {name:"B",  axis:"z", layer:-1, arr:["right",[1, 0,-1],[0, 1,0]]},
  {name:"B'", axis:"z", layer:-1, arr:["right",[1, 0,-1],[0,-1,0]]},
  {name:"U",  axis:"y", layer: 1, arr:["top",  [0, 1, 0.2],[-1,0,0]]},
  {name:"U'", axis:"y", layer: 1, arr:["top",  [0, 1, 0.2],[1,0,0]]},
  {name:"D",  axis:"y", layer:-1, arr:["front",[0,-1, 1],[1,0,0]]},
  {name:"D'", axis:"y", layer:-1, arr:["front",[0,-1, 1],[-1,0,0]]}
];
const AXIS_IDX = {x:0, y:1, z:2};

function proj(cx, cy, x, y, z){
  /* 与 3D 展示图共用同一套透视投影（yaw −40° + 俯视 30° + 针孔透视）。
     cubeProj 输出的单位已经被归一化（外轮廓半高 = 2 个「S」），所以这里只需乘 S。 */
  const q = cubeProj(x, y, z);
  return [ cx + q[0]*S, cy + q[1]*S ];
}
function poly(ctx, pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function face(ctx, cx, cy, x, y, z, which, color, h){
  h = h || 0.5;
  let corners;
  if(which==='x') corners = [[x+h,y-h,z-h],[x+h,y+h,z-h],[x+h,y+h,z+h],[x+h,y-h,z+h]];
  else if(which==='y') corners = [[x-h,y+h,z-h],[x-h,y+h,z+h],[x+h,y+h,z+h],[x+h,y+h,z-h]];
  else corners = [[x-h,y-h,z+h],[x-h,y+h,z+h],[x+h,y+h,z+h],[x+h,y-h,z+h]];
  const pts = corners.map(p=>proj(cx,cy,p[0],p[1],p[2]));
  poly(ctx, pts);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = EDGE;
  ctx.stroke();
}
function markedFor(axis, layer){
  const idx = AXIS_IDX[axis];
  const out = [];
  for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
    const g=[x,y,z];
    if(g[idx]===layer && !(g[(idx+1)%3]===0 && g[(idx+2)%3]===0)) out.push(g);
  }
  return out;
}
function drawCube(ctx, cx, cy, axis, layer, size){
  size = size || 3;
  const coords = size === 2 ? [-1, 1] : [-1, 0, 1];
  const h = size === 2 ? 1 : 0.5;   // 二阶 cubie 边长翻倍，拼成无缝 2×2
  /* 二阶坐标跨 4 个单位、三阶跨 3 个单位：按 3/4 缩放 S，
     使两种魔方外轮廓等大，避免二阶示意图撑破卡片、相邻示意互相重叠 */
  S = (size === 2) ? BASE_S * 3 / 4 : BASE_S;
  const marks = markedFor(axis, layer);
  const isM = (x,y,z)=>marks.some(g=>g[0]===x&&g[1]===y&&g[2]===z);
  const cubes=[];
  for(const x of coords)for(const y of coords)for(const z of coords) cubes.push([x,y,z]);
  cubes.sort((A,B)=>(A[0]+A[1]+A[2])-(B[0]+B[1]+B[2]));
  for(const [x,y,z] of cubes){
    const m = isM(x,y,z);
    if(x===1) face(ctx,cx,cy,x,y,z,'x', m?MARK:WHITE, h);
    if(z===1) face(ctx,cx,cy,x,y,z,'z', m?MARK:WHITE, h);
    if(y===1) face(ctx,cx,cy,x,y,z,'y', m?MARK:WHITE, h);
  }
}
/* 贴合表面直线箭头：从锚点沿 dir 画直线段，末端带箭头头 */
function lineArrow(ctx, cx, cy, anchor, dir, color, width){
  /* 箭头线段长度(3D 单位)：二阶的 S 被缩小了 3/4，这里反向补偿，
     使箭头实际像素长度与三阶一致，保持醒目 */
  const L = 1.15 * (BASE_S / S);
  const p0 = proj(cx, cy, anchor[0], anchor[1], anchor[2]);
  const p1 = proj(cx, cy, anchor[0]+dir[0]*L, anchor[1]+dir[1]*L, anchor[2]+dir[2]*L);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.lineTo(p1[0], p1[1]);
  ctx.stroke();
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  const len = Math.hypot(dx,dy)||1;
  const ux = dx/len, uy = dy/len;
  const ang = Math.atan2(uy, ux);
  const hl = width*2.6;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(p1[0]+Math.cos(ang)*hl, p1[1]+Math.sin(ang)*hl);
  ctx.lineTo(p1[0]+Math.cos(ang+2.5)*hl*0.82, p1[1]+Math.sin(ang+2.5)*hl*0.82);
  ctx.lineTo(p1[0]+Math.cos(ang-2.5)*hl*0.82, p1[1]+Math.sin(ang-2.5)*hl*0.82);
  ctx.closePath();
  ctx.fill();
}
function drawArrow(ctx, cx, cy, arr){
  const [, anchor, dir] = arr;
  const width = Math.max(4, BASE_S*0.24);   /* 与阶数无关，保证两种魔方箭头粗细一致 */
  lineArrow(ctx, cx, cy, anchor, dir, ARROW, width);
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function buildLegend(movesSubset, size){
  const canvas = document.getElementById('legendCanvas');
  if(!canvas) return;
  // 冻结契约：可选 movesSubset（MOVES 子数组），不传 = 全部 12 个；size: 2=二阶 / 3=三阶
  const items = movesSubset && movesSubset.length ? movesSubset : MOVES;
  const cubeSize = (size === 2) ? 2 : 3;
  const CUBE = 150, LAB = 42, PAD = 6, GAP = 20;
  const CARD_W = CUBE + PAD*2;
  const CARD_H = CUBE + LAB + PAD*2;

  /* v2.1.6 重写尺寸逻辑：
     旧实现把画布位图固定成 708×652（按首次布局的 clientWidth 选 4 列），
     之后窗口/浏览器缩放变化时既不重算也不重画，位图被 CSS 拉伸到 1189×1110
     → 大屏上模糊、object-fit 留白 → 看起来「有的地方变小」。 */
  const parentEl = canvas.parentElement;
  const cs = parentEl ? getComputedStyle(parentEl) : null;
  const padX = cs ? (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0) : 0;
  const padY = cs ? (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0) : 0;
  let availW = parentEl ? parentEl.clientWidth - padX : 0;
  let availH = parentEl ? parentEl.clientHeight - padY : 0;
  if (!(availW > 40 && availH > 40)) { availW = 700; availH = 520; }  // 首帧未完成布局时的兜底
  availW = Math.max(Math.floor(availW), 40);
  availH = Math.max(Math.floor(availH), 40);

  /* 在候选列数中取「整组放大倍率最大」的布局：横屏摊宽、竖长面板收窄，永不留大片空白 */
  const cands = items.length <= 6 ? [2, 3, 4] : [3, 4, 5, 6];
  let COLS = items.length <= 6 ? 3 : 4, bestFit = -1;
  for (const c of cands) {
    const r = Math.ceil(items.length / c);
    const w = c*CARD_W + (c-1)*GAP;
    const h = r*CARD_H + (r-1)*GAP;
    const fit = Math.min(availW / w, availH / h);
    if (fit > bestFit) { bestFit = fit; COLS = c; }
  }
  const ROWS = Math.ceil(items.length / COLS);
  const W = COLS*CARD_W + (COLS-1)*GAP;
  const H = ROWS*CARD_H + (ROWS-1)*GAP;

  /* 位图 = 容器可用区 × dpr（不再按逻辑尺寸出图再由 CSS 拉伸）：
     位图纵横比与显示框完全一致，object-fit 不会留白，任何缩放倍率下都是 1:1 像素。 */
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  /* 逻辑坐标 → 容器坐标：等比放大到刚好装下，并在容器内居中 */
  const k = Math.min(availW / W, availH / H);
  const offX = (availW - W*k) / 2, offY = (availH - H*k) / 2;
  /* 命中测试用：点小对照图的哪一张卡，就全屏放大哪个符号 */
  canvas._cards = { items, COLS, k, offX, offY, CARD_W, CARD_H, GAP };
  /* 尺寸与内容都没变就不重画：ResizeObserver 会反复回调，靠这个签名避免自触发死循环 */
  const sig = availW + 'x' + availH + '@' + dpr + '#' + cubeSize + '|' + items.map(m => m.name).join(',');
  if (canvas._sig === sig) return;
  canvas._sig = sig;
  canvas.width = Math.round(availW * dpr);
  canvas.height = Math.round(availH * dpr);
  canvas.style.width = availW + 'px';
  canvas.style.height = availH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.translate(offX, offY);
  ctx.scale(k, k);
  // 背景透明：白色圆角卡片由本函数逐张绘制，外层 .legend-img-wrap 浅灰底（var(--surface-2)）衬托卡片

  items.forEach((mv, i)=>{
    const col = i % COLS, row = (i/COLS)|0;
    const ox = col*(CARD_W+GAP), oy = row*(CARD_H+GAP);
    // 深色圆角卡片 + 外框
    roundRect(ctx, ox, oy, CARD_W, CARD_H, 14);
    ctx.fillStyle = CARD_BG;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = CARD_LINE;
    ctx.stroke();
    // 魔方 + 黄色箭头
    const cx = ox + CARD_W/2;
    const cy = oy + PAD + CUBE/2 + 2;
    /* 透视后魔方外框（147×162 @ S=27）比卡片内容区（150×150）略高，
       且透视后最高点更尖、容易顶到卡片圆角；按内容区等比收一档，四周留出均匀缝隙。 */
    const fit = Math.min(1,
      (CUBE * 0.88) / (2 * CUBE_HALF_W * BASE_S),
      (CUBE * 0.88) / (2 * CUBE_HALF_H * BASE_S));
    ctx.save();
    ctx.translate(cx, cy);
    if (fit < 1) ctx.scale(fit, fit);
    drawCube(ctx, 0, 0, mv.axis, mv.layer, cubeSize);
    drawArrow(ctx, 0, 0, mv.arr);
    ctx.restore();
    // 亮白粗体标签（卡片下方居中，字号放大）
    ctx.fillStyle = LABEL;
    ctx.font = '800 38px "Segoe UI", "Microsoft YaHei", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(mv.name, cx, oy + PAD + CUBE + LAB/2 + 2);
  });
  ctx.setTransform(1,0,0,1,0,0);
  // 动态标题：二阶只显示 RUF 3 种，三阶显示 12 种；自选字母模式只显示选中的字母
  const lbl = document.getElementById('legendTitle');
  if(lbl){
    lbl.textContent = '对照图 · ' + items.length + ' 种转动示意';
  }
}

/* 单张符号大卡：画布多大就画多大（全屏网格 / 单符号大字共用）。
   白色卡片铺满整块画布，魔方按内容区等比放大居中，标签字号随卡片高度走
   —— 这样 12 张 / 4 张 / 单张大图都不留空边，投影时不出现「小图漂在白框里」。 */
function paintMoveCard(canvas, mv, cubeSize){
  if (!canvas || !mv) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!(w > 16 && h > 16)) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const sig = w + 'x' + h + '@' + dpr + '#' + cubeSize + '|' + mv.name;
  if (canvas._sigCard === sig) return;
  canvas._sigCard = sig;
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(h*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  /* 卡片底：铺满整块画布 */
  const r = Math.max(6, Math.min(16, w*0.035));
  roundRect(ctx, 0, 0, w, h, r);
  ctx.fillStyle = CARD_BG; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = CARD_LINE; ctx.stroke();

  /* 内容区（去掉底部标签）*/
  const labH = Math.max(22, Math.min(h*0.17, 78));
  const boxW = w * 0.86;
  const boxH = (h - labH) * 0.88;
  /* 魔方投影尺寸：CUBE_HALF_W/H 是「透视 + 归一化」后的外轮廓半宽/半高（单位与 S 相同），
     乘 BASE_S 就是 drawCube 默认画出来的像素尺寸（三阶 ≈147×162）。
     旧写法在这里多乘了 1.5，实际把魔方画成内容区的 60%，卡片四周留一圈空。 */
  const UNIT_W = 2 * CUBE_HALF_W * BASE_S;   /* ≈147 */
  const UNIT_H = 2 * CUBE_HALF_H * BASE_S;   /* =162 */
  const k = Math.min(boxW / UNIT_W, boxH / UNIT_H);
  /* 魔方 + 标签作为一整块垂直居中：窄高卡片里标签不会掉到卡片最底部、离魔方很远 */
  const cubeH = UNIT_H * k;
  const top = (h - (cubeH + labH)) / 2;
  const cx = w/2, cy = top + cubeH/2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  drawCube(ctx, 0, 0, mv.axis, mv.layer, cubeSize);
  drawArrow(ctx, 0, 0, mv.arr);
  ctx.restore();

  ctx.fillStyle = LABEL;
  ctx.font = '800 ' + Math.round(labH*0.78) + 'px "Segoe UI", "Microsoft YaHei", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(mv.name, w/2, top + cubeH + labH/2);
}

window.paintMoveCard = paintMoveCard;
// 暴露给 newQuestion 调用（T5 联动重绘对照图：2×2 只画 R/U/F 示意）
window.buildLegend = buildLegend;
window.MOVES = MOVES;
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ buildLegend(); });
}else{
  buildLegend();
}
})();


/* ====================================================================
 * 小对照图点击命中：点哪张卡就放大哪个符号（未命中返回 -1）
 * ==================================================================== */
function legendIndexAt(clientX, clientY){
  const canvas = document.getElementById('legendCanvas');
  if (!canvas || !canvas._cards) return -1;
  const r = canvas.getBoundingClientRect();
  const c = canvas._cards;
  const lx = (clientX - r.left - c.offX) / c.k;
  const ly = (clientY - r.top - c.offY) / c.k;
  if (lx < 0 || ly < 0) return -1;
  const col = Math.floor(lx / (c.CARD_W + c.GAP));
  const row = Math.floor(ly / (c.CARD_H + c.GAP));
  if (col < 0 || col >= c.COLS) return -1;
  const idx = row * c.COLS + col;
  if (idx >= c.items.length) return -1;
  if (lx - col*(c.CARD_W+c.GAP) > c.CARD_W) return -1;
  if (ly - row*(c.CARD_H+c.GAP) > c.CARD_H) return -1;
  return idx;
}

/* ====================================================================
 * 全屏展示层（上课投屏）
 *  · 展示图：平面展开图 / 3D 立体图整块放大，底部保留打乱公式
 *  · 对照图：所有符号铺满全屏，点任意一个 → 该符号专属大图，
 *    ‹ › 逐个切换（也可用键盘 ← →），Esc 返回 / 关闭
 * ==================================================================== */
(function(){
"use strict";
const $ = id => document.getElementById(id);
let isOpen = false;
let view = null;            /* 'net' | 'legend' */
let items = [];
let detailIdx = -1;

const sizeNow = () => (window._currentCubeSize || 3);
const itemsNow = () => (typeof legendItemsFor === 'function'
  ? legendItemsFor(sizeNow(), currentMoveSet)
  : (window.MOVES || []));

function showOnly(which){
  $('fsStage').hidden  = which !== 'stage';
  $('fsGrid').hidden   = which !== 'grid';
  $('fsDetail').hidden = which !== 'detail';
  $('fsFoot').hidden   = which !== 'stage';
  $('fsBack').hidden   = which !== 'detail';
}

function openShell(){
  const fs = $('fs');
  fs.classList.add('open');
  fs.setAttribute('aria-hidden', 'false');
  isOpen = true;
}

/* ---------- 展示图（平面 / 3D） ---------- */
function renderNet(){
  const alg = window._currentText || '';
  const flat = $('fsNetCanvas'), d3 = $('fs3dCanvas');
  flat.hidden = netMode !== 'flat';
  d3.hidden = netMode !== '3d';
  if (netMode === 'flat') drawScrambleNet(alg, flat, sizeNow());
  else drawScramble3D(alg, d3, sizeNow());
}

function renderFoot(){
  const box = $('fsFormula');
  const moves = window._currentMoves || [];
  box.innerHTML = moves.map(m => {
    const cls = m.mod === "'" ? 'move prime' : (m.mod === '2' ? 'move dbl' : 'move');
    return '<span class="' + cls + '">' + m.face + m.mod + '</span>';
  }).join('<span class="move space"> </span>');
}

function openNet(){
  view = 'net';
  openShell();
  $('fsTitle').textContent = '打乱状态图';
  $('fsSub').textContent = window._currentText || '';
  $('fsTools').innerHTML =
    '<div class="seg-toggle seg-toggle--xs" id="fsModeToggle">' +
      '<button class="seg__btn' + (netMode === 'flat' ? ' active' : '') + '" data-nm="flat">平面展开图</button>' +
      '<button class="seg__btn' + (netMode === '3d'  ? ' active' : '') + '" data-nm="3d">3D 立体图</button>' +
    '</div>';
  $('fsTools').querySelectorAll('.seg__btn').forEach(b => {
    b.addEventListener('click', () => setNetMode(b.dataset.nm));
  });
  showOnly('stage');
  renderFoot();
  requestAnimationFrame(() => { if (view === 'net') renderNet(); });
}

/* ---------- 对照图：网格 + 单符号大图 ---------- */
function gridCols(n, gw, gh){
  let best = 1, bestFit = 0;
  for (let c = 1; c <= n; c++){
    const r = Math.ceil(n / c);
    const cw = (gw - (c - 1) * 12) / c;
    const ch = (gh - (r - 1) * 12) / r;
    const fit = Math.min(cw / 162, ch / 198);   /* 与单卡逻辑尺寸比较 → 取放大倍率最大的列数 */
    if (fit > bestFit) { bestFit = fit; best = c; }
  }
  return best;
}

function buildGrid(){
  const grid = $('fsGrid');
  grid.innerHTML = '';
  items = itemsNow();
  const gw = grid.clientWidth || 1000, gh = grid.clientHeight || 600;
  const cols = gridCols(items.length || 1, gw, gh);
  grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  items.forEach((mv, i) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'fs__card';
    card.setAttribute('aria-label', mv.name + ' 转动示意');
    card.appendChild(document.createElement('canvas'));
    card.addEventListener('click', () => openDetail(i));
    grid.appendChild(card);
  });
  paintCards();
}

function paintCards(){
  const cards = $('fsGrid').children;
  for (let i = 0; i < cards.length; i++){
    const cv = cards[i].querySelector('canvas');
    if (cv) window.paintMoveCard(cv, items[i], sizeNow());
  }
}

function descOf(mv){
  const base = mv.name.replace(/['2]/g, '');
  const mod = mv.name.slice(base.length);
  const fc = ({ R:'右面', L:'左面', U:'顶层', D:'底层', F:'前面', B:'后面' })[base] || base;
  const dc = mod === "'" ? '逆时针 90°' : (mod === '2' ? '180°' : '顺时针 90°');
  return fc + ' · ' + dc + '　（红色箭头 = 这一层转的方向）';
}

function paintDetail(){
  if (detailIdx < 0 || !items[detailIdx]) return;
  const cv = $('fsDetailCanvas');
  cv._sigCard = '';                       /* 换符号必须重画 */
  window.paintMoveCard(cv, items[detailIdx], sizeNow());
}

function openDetail(i){
  if (!items.length) items = itemsNow();
  if (!items.length) return;
  detailIdx = ((i % items.length) + items.length) % items.length;
  showOnly('detail');
  $('fsDetailDesc').textContent = descOf(items[detailIdx]);
  $('fsPrev').disabled = $('fsNext').disabled = items.length < 2;
  requestAnimationFrame(paintDetail);
}

function stepDetail(d){
  if (!$('fsDetail').hidden) openDetail(detailIdx + d);
}

function openLegend(index){
  view = 'legend';
  openShell();
  $('fsTitle').textContent = '转动符号对照';
  $('fsSub').textContent = '点任意符号 → 放大成课堂大图';
  $('fsTools').innerHTML = '';
  showOnly('grid');
  buildGrid();                            /* 先让网格可见，才能量到真实尺寸 */
  if (typeof index === 'number' && index >= 0 && index < items.length) openDetail(index);
}

function close(){
  isOpen = false; view = null; detailIdx = -1;
  const fs = $('fs');
  fs.classList.remove('open');
  fs.setAttribute('aria-hidden', 'true');
}

/* ---------- 事件 ---------- */
$('fsClose').addEventListener('click', close);
$('fsBack').addEventListener('click', () => { showOnly('grid'); detailIdx = -1; });
$('fsPrev').addEventListener('click', () => stepDetail(-1));
$('fsNext').addEventListener('click', () => stepDetail(1));

document.addEventListener('keydown', (e) => {
  if (!isOpen) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    if (view === 'legend' && !$('fsDetail').hidden) { showOnly('grid'); detailIdx = -1; }
    else close();
    return;
  }
  if (e.key === 'ArrowLeft'  && !$('fsDetail').hidden) { e.preventDefault(); stepDetail(-1); }
  if (e.key === 'ArrowRight' && !$('fsDetail').hidden) { e.preventDefault(); stepDetail(1); }
});

let raf = 0;
function onResize(){
  if (!isOpen) return;
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    raf = 0;
    if (view === 'net') renderNet();
    else if (!$('fsDetail').hidden) paintDetail();
    else paintCards();
  });
}
window.addEventListener('resize', onResize);
if (window.ResizeObserver) {
  const ro = new ResizeObserver(onResize);
  const body = $('fsBody');
  if (body) ro.observe(body);
}

window.FSViewer = {
  openNet,
  openLegend,
  close,
  isOpenNet(){ return isOpen && view === 'net'; },
  onNetModeChange(){ if (isOpen && view === 'net') { renderNet(); } }
};
})();

</script>
