<title>魔方打乱公式随机出题训练器</title>
<style>:root {
  --st-ui-c0392b: #c0392b;
  --st-ui-f2f4f7: #f2f4f7;
  --st-ui-6b7280: #6b7280;

}

  :root {
    /* ===== 浅色 / 白底主题（白天教室、大屏投屏优化）===== */
    --panel: var(--on-brand);
    --panel-2: var(--st-ui-eef1f5);
    --muted: var(--st-ui-6b7280);        /* 深蓝 */

    --st-net-frame: var(--fg-2);     /* 展开图每面外框 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== Header 精简版 ===== */
  .header {
    flex: 0 0 auto;

    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 56px;
    background: var(--panel);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .badge {
    background: rgba(29,78,216,0.10);
    color: var(--brand-strong);   /* 阶段四：--brand 在此底上仅 4.02:1 */
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    border: 1px solid rgba(29,78,216,0.28);
    font-weight: 600;
  }
  .header .count {
    color: var(--muted);

    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .count b {
    color: var(--brand);
    font-size: 22px;
    font-weight: 700;
  }
  .header .reset {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 4px 12px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .header .reset:hover { color: var(--fg); border-color: var(--fg); }

  /* ===== 主区：左展开图 / 右栏（各占一半） ===== */
  .main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;   /* 左右各占屏幕一半 */
    min-height: 0;
  }

  /* 左：12 种转动示意图（大区，放大显示） */
  .left {
    background: var(--bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 18px 20px;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .left .legend-zone {
    flex: 1 1 auto;

  }
  .left .legend-img-wrap {

  }

  /* 右栏：上=缩小展开图，下=公式区 */
  .right {
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 0;
    background: var(--panel);
  }
  .net-zone {
    padding: 12px 16px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .net-zone .zone-label {
    color: var(--muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;

  .net-zone .zone-label::before {
    content: '';
    width: 4px;
    height: 14px;
    background: var(--brand);
    border-radius: 2px;
  }
  .net-img-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    /* 固定高度（基于视口比例，与 canvas 内容无关）：破除「读取父高→设 canvas 高→父再被撑高」的正反馈环 */
    height: clamp(300px, 40vh, 400px);
    overflow: hidden;
  }
  .net-img-wrap canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }

  /* 对照图（大区卡片） */
  .legend-zone {
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: hidden;
  }
  .legend-zone .zone-label {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-zone .zone-label::before {
    content: '';
    width: 4px;
    height: 14px;
    background: var(--brand);
    border-radius: 2px;
  }
  .legend-img-wrap {
    background: #0E1726;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .legend-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .legend-img-wrap canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .legend-zone .legend-caption {
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    margin-left: 4px;
  }
  .legend-fallback {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 16px;
    border: 2px dashed var(--line);
    border-radius: 8px;
  }
  .legend-fallback code {
    color: var(--brand);
    background: rgba(29,78,216,0.10);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12px;
  }

  /* 右下：公式区（已压缩，把高度让给对照图） */
  .formula-zone {
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: auto;              /* 展开图放大后，公式区空间被压缩时允许滚动，避免控件被裁切 */
  }
  .formula-zone .zone-label {
    color: var(--muted);
    font-size: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .formula-zone .zone-label::before {
    content: '';
    width: 4px;
    height: 16px;
    background: var(--st-danger);
    border-radius: 2px;
  }
  /* 六字母覆盖校验徽标 */
  .cover-badge {
    margin-left: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--green);
    background: rgba(21,128,61,0.10);
    border: 1px solid rgba(21,128,61,0.30);
    padding: 2px 9px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .cover-badge.warn {
    color: var(--amber);
    background: rgba(180,83,9,0.10);
    border-color: rgba(180,83,9,0.30);
  }

  /* 大字号公式显示（浅底黑字，课堂投影最清晰） */
  .formula-display {
    background: var(--on-brand);
    border: 3px solid var(--fg);
    border-radius: 12px;
    padding: 14px 12px;
    flex: 1 1 auto;          /* 吃掉剩余高度 */
    min-height: 120px;       /* 保证公式框有可用高度，不被控件挤压到一行 */
    overflow: auto;          /* 多步公式换行后若超高可滚动，不裁切 */
    display: flex;
    align-items: center;     /* 垂直居中 */
    justify-content: center; /* 水平居中 */
  }
  /* 公式文本：固定字号 + 居中 + 溢出滚动不裁切顶部 */
  .formula-inner {
    margin: auto;
    width: 100%;
  }
  .formula-inner {
    display: block;
    width: 100%;
    font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
    font-size: 40px;          /* 统一固定字号：步数多时自动换行，不再缩小 */
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 2px;
    color: var(--bg);          /* 纯黑字 */
    text-align: center;
    white-space: normal;       /* 允许换行 */
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  /* 单行模式（已弃用 nowrap：统一固定字号后一律允许换行） */
  .formula-inner.single {
    white-space: normal;
  }
  .formula-inner.single .move { padding: 0 2px; }
  .formula-inner.single .move.space { padding: 0 5px; }
  .formula-inner .move {
    color: var(--fg);          /* 字母主体：深色（浅色页 --bg 为近白，须用 --fg） */
    padding: 0 4px;
  }
  /* 修饰符用深色区分（白底上依然清晰，仍属深色系） */
  .formula-inner .move.prime { color: var(--st-ui-c0392b); }   /* 带撇号 → 深红 */
  .formula-inner .move.dbl   { color: var(--brand-strong); }   /* 带 2   → 深蓝 */
  .formula-inner .move.space {
    color: var(--muted);
    padding: 0 10px;
    font-weight: 400;
  }

  /* 长度选择 */
  .length-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .length-row .lbl {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .length-row .seg__btn {
    background: var(--on-brand);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--fg);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    min-width: 50px;
  }
  .length-row .seg__btn:hover { border-color: var(--brand); color: var(--brand); }
  .length-row .seg__btn.active {
    background: var(--brand);
    color: var(--on-brand);
    border-color: var(--brand);
  }

  /* 难度/魔方类型设置行（分段按钮 seg-toggle） */
  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .settings-row .lbl {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .seg-toggle {
    display: inline-flex;
    border: 2px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg__btn {
    background: var(--panel);
    border: none;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .seg__btn:hover { color: var(--brand); }
  .seg__btn.active {
    background: var(--brand);
    color: var(--on-brand);
  }
  .seg__btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* 操作按钮 */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-shrink: 0;
  }
  .action-row .full {
    grid-column: 1 / -1;
  }
  .btn {
    color: var(--on-brand);
    border: none;
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(15,23,42,0.12);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--brand);
    color: var(--on-brand);   /* 阶段四：深色文字压在品牌蓝上仅 3.78:1，改白字 → 4.69:1 */
    font-size: 20px;
    padding: 20px 22px;
    box-shadow: 0 4px 12px rgba(29,78,216,0.28);
  }
  .btn.pink {
    background: var(--st-danger);
  }
  .btn.ghost {
    background: var(--on-brand);
    color: var(--fg);
    border: 1.5px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost:hover {
    background: var(--panel-2);
    border-color: var(--brand);
    color: var(--brand);
  }

  /* ===== 分步抽屉 ===== */
  .steps-drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 45vh;
    background: var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 30px rgba(15,23,42,0.16);
    transform: translateY(100%);
    transition: transform 0.3s;
    z-index: 50;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .steps-drawer.show { transform: translateY(0); }
  .steps-drawer .head {
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel-2);
  }
  .steps-drawer .head h3 {
    font-size: 16px;
    color: var(--fg);
  }
  .steps-drawer .head .close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .steps-drawer .head .close:hover { color: var(--fg); }
  .steps-drawer .body {
    padding: 14px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .steps-drawer .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .step-item {
    background: var(--formula-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .step-item .no {
    color: var(--muted);
    font-size: 12px;
    width: 28px;
    text-align: center;
  }
  .step-item .symbol {
    font-family: monospace;
    font-weight: 800;
    font-size: 22px;
    width: 60px;
    text-align: center;
  }
  .step-item .desc {
    color: var(--muted);
    flex: 1;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 80px;
    right: 24px;
    background: var(--success);
    color: var(--on-brand);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 6px 18px rgba(21,128,61,0.25);
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ===== 响应式：小屏堆叠 ===== */
  @media (max-width: 1100px) {
    body { overflow-y: auto; }
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: 50vh auto;
    }
    .left {
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .right { grid-template-rows: auto auto; }
  }

  /* ===== 手机竖屏：展开图(顶) / 公式(中·粗大) / 符号示意图(底) 单屏竖排 ===== */
  @media (max-width: 768px) {
    /* === Header：单行 + 隐藏 badge，省出垂直空间 === */
    .header {
      padding: 6px 10px;
      flex-wrap: nowrap;
    }
    .header h1 {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .header h1 .badge { display: none; }   /* 手机下省空间 */
    .header .count { font-size: 12px; gap: 8px; flex-shrink: 0; }
    .header .count b { font-size: 18px; }
    .header .reset { padding: 2px 8px; font-size: 11px; }

    /* 单屏，禁整体滚动 */
    html, body { overflow: hidden; }
    .main {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 44px);   /* 减去 header 高度（约 40px） */
      grid-template-columns: none;    /* 覆盖 1100px 的 grid */
      grid-template-rows: none;
      overflow: hidden;
      min-height: 0;
    }

    /* ① 对照图（左大区内容）：置底，吃掉剩余高度 */
    .left {
      order: 2;                 /* 对照图置底 */
      flex: 1 1 auto;
      border-right: none;
      border-top: 1px solid var(--line);
      padding: 6px;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .left .legend-img-wrap {
      width: 100% !important;
      height: 100% !important;
      min-height: 0;
    }
    .left .legend-img-wrap canvas {
      display: block;
      margin: 0 auto;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    /* 右栏（展开图 + 公式）：置顶，约 42% 高度 */
    .right {
      order: 1;                /* 展开图+公式置顶 */
      display: flex;
      flex-direction: column;
      flex: 0 0 42%;
      gap: 6px;
      padding: 4px;
      grid-template-rows: none;
      min-height: 0;
      overflow-y: auto;        /* 公式框/控件超出本区时自身滚动，不溢出到对照图区 */
      position: relative;
      z-index: 1;              /* 始终绘制在对照图(.left)之上，保证按钮可点 */
      background: var(--panel);
    }
    .left { z-index: 0; }
    .net-zone {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 110px;      /* 防止公式区/控件把展开图挤到 0 */
      border-bottom: 1px solid var(--line);
      padding: 4px 8px 6px;
    }
    .net-zone .zone-label { font-size: 12px; }
    .net-img-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .net-img-wrap canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* ② 打乱公式：打平 .formula-zone，使其子项（标签/公式框/长度/操作）升级为
        .right 的直接 flex 子项，这样才能用 order 把「公式→对照图→控件」排成
        竖列，并把控件置于最底部（仅移动端打平，桌面布局不受影响） */
    .formula-zone {
      display: contents;              /* 移动端打平容器 */
    }

    /* 公式标签：紧跟展开图下方 */
    .formula-zone .zone-label {
      order: 1;
      flex: 0 0 auto;
      font-size: 12px;
      margin: 0;
    }

    /* 公式框：固定字号 + 自动换行，多步时纵向滚动，不裁切 */
    .formula-display {
      order: 2;
      flex: 0 0 auto;
      min-height: 90px;
      max-height: 32vh;
      border-width: 3px;
      border-color: var(--fg);
      border-radius: 12px;
      background: var(--panel);       /* 白底，与网页端一致 */
      padding: 6px 10px;
      overflow: auto;                 /* 多步换行后纵向滚动 */
    }
    .formula-inner {
      font-family: "PingFang SC", "Microsoft YaHei", "黑体", "Heiti SC", "SimHei", sans-serif !important;
      font-weight: 900 !important;    /* 黑体加粗 */
      letter-spacing: 1px;
      font-size: 22px !important;     /* 手机端固定字号 */
      line-height: 1.2;
      white-space: normal;             /* 步数多时换行 */
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: left;
    }
    .formula-inner.single { white-space: normal; }
    .formula-inner .move { padding: 0 1px; }
    .formula-inner .move.space { padding: 0 2px; }

    /* ③ 对照图示意图：公式正下方，吃掉剩余空间保证 12 个示意完整显示 */
    .legend-zone {
      order: 3;
      flex: 1 1 auto;                 /* 占满公式与控件之间的剩余高度 */
      display: flex;
      flex-direction: column;
      border-bottom: none;
      border-top: 1px solid var(--line);
      padding: 4px 8px 6px;
      min-height: 0;

function parseScrambleNet(str){
  const cleaned = String(str||'').replace(/\s+/g,' ').trim();
  if(!cleaned) return [];
  const tokens = cleaned.split(/\s+/);
  const out = [];
  for(const tok of tokens){
    const m = tok.match(/^([RULDFBMESrludfbxyz])(2)?(')?$/);
    if(!m) continue;
    const base = m[1];
    let dir = 1;
    if(m[2]) dir = 2; else if(m[3]) dir = -1;
    const seq = expandMoveNet(base, dir);
    for(const sm of seq) out.push(sm);
  }
  return out;
}
function expandMoveNet(base, dir){
  const seq = [];
  const push = (face, d) => seq.push({face, dir: d});
  const pushMid = (axis, d) => seq.push({mid: axis, dir: d});
  switch(base){
    case 'R': push('R',dir); break;
    case 'L': push('L',dir); break;
    case 'U': push('U',dir); break;
    case 'D': push('D',dir); break;
    case 'F': push('F',dir); break;
    case 'B': push('B',dir); break;
    case 'M': pushMid('M',dir); break;
    case 'E': pushMid('E',dir); break;
    case 'S': pushMid('S',dir); break;
    case 'r': push('R',dir); pushMid('M',-dir); break;
    case 'l': push('L',dir); pushMid('M',dir); break;
    case 'u': push('U',dir); pushMid('E',-dir); break;
    case 'd': push('D',dir); pushMid('E',dir); break;
    case 'f': push('F',dir); pushMid('S',dir); break;
    case 'b': push('B',dir); pushMid('S',-dir); break;
    case 'x': push('R',dir); pushMid('M',-dir); push('L',-dir); break;
    case 'y': push('U',dir); pushMid('E',-dir); push('D',-dir); break;
    case 'z': push('F',dir); pushMid('S',dir); push('B',-dir); break;
  }
  return seq;
}

function drawScrambleNet(alg, canvasId, size){
  size = size || 3;   // 冻结契约：默认三阶（不传 = 原行为）
  const canvas = typeof canvasId === 'string' ? document.getElementById(canvasId) : (canvasId || document.getElementById("player"));
  if(!canvas) return;
  const cube = new Cube(size);
  cube.applyAlg(alg);
  const colors = NET_COLORS;   // 二阶/三阶统一使用标准六色：所有面（含 L/D/B）均有颜色
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  const availW = Math.max(rect.width, 240);
  const availH = Math.max(rect.height, 280);
  const dpr = window.devicePixelRatio || 1;
  const s = cube.size;
  const gap = 6, padding = 16;
  const baseSticker = 60;  // 大屏加大贴纸
  const faceSize0 = baseSticker * s;
  const totalW0 = 4*faceSize0 + 3*gap + 2*padding;
  const totalH0 = 3*faceSize0 + 2*gap + 2*padding;
  const scale = Math.min(availW/totalW0, availH/totalH0, 1.4);
  const stickerSize = baseSticker * scale;
  const faceSize = stickerSize * s;
  const totalW = 4*faceSize + 3*gap + 2*padding;
  const totalH = 3*faceSize + 2*gap + 2*padding;
  canvas.width = totalW * dpr;
  canvas.height = totalH * dpr;
  canvas.style.width = totalW + 'px';
  canvas.style.height = totalH + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#f2f4f7';          /* 浅色底（与页面白底一致） */
  ctx.fillRect(0,0,totalW,totalH);

  const uX = faceSize + gap + padding, uY = padding;
  const lX = padding, lY = faceSize + gap + padding;
  const fX = faceSize + gap + padding, fY = faceSize + gap + padding;
  const rX = 2*faceSize + 2*gap + padding, rY = faceSize + gap + padding;
  const bX = 3*faceSize + 3*gap + padding, bY = faceSize + gap + padding;
  const dX = faceSize + gap + padding, dY = 2*faceSize + 2*gap + padding;
  const facePositions = {
    U:{x:uX,y:uY}, L:{x:lX,y:lY}, F:{x:fX,y:fY},
    R:{x:rX,y:rY}, B:{x:bX,y:bY}, D:{x:dX,y:dY}
  };
  for(const [face,pos] of Object.entries(facePositions)){
    drawNetFace(ctx, cube, face, pos.x, pos.y, stickerSize, colors);
  }
}

function drawNetFace(ctx, cube, face, ox, oy, stickerSize, colors){
  const s = cube.size;
  const faceData = cube.getFace(face);
  const faceSize = stickerSize * s;
  ctx.fillStyle = '#374151';          /* 深色外框：白底上更清晰 */
  ctx.fillRect(ox-2, oy-2, faceSize+4, faceSize+4);
  for(let r=0;r<s;r++){
    for(let c=0;c<s;c++){
      const colorKey = faceData[r][c];
      const stickerColor = colors[colorKey];
      const x = ox + c*stickerSize + 1;
      const y = oy + r*stickerSize + 1;
      const ss = stickerSize - 2;
      ctx.fillStyle = stickerColor;
      ctx.fillRect(x, y, ss, ss);
      if(stickerColor === '#FFFFFF'){
        ctx.strokeStyle = '#9ca3af';  /* 白色贴纸描边（U 面） */
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, ss, ss);
      }
    }
  }
}

const FACES = ['R', 'U', 'F', 'L', 'D', 'B'];
const AXIS_OPPOSITE = { R:'L', L:'R', U:'D', D:'U', F:'B', B:'F' };
const MODIFIERS = ['', '', '', "'", "'", '2'];

/* ---------- 工具 ---------- */
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 判断某一步能否接在当前序列后面（WCA 打乱规则） */
function isValidNext(seq, f) {
  const last = seq[seq.length - 1];   // 上一步
  const prev = seq[seq.length - 2];   // 上两步
  if (f === last) return false;                       // 不能同面连续 R R
  if (last && AXIS_OPPOSITE[f] === last) return false; // 不能同轴对面 R L / U D / F B
  if (f === prev) return false;                        // 隔一步也不能同面 R L R
  return true;
}

/**
 * 生成面序列，硬性保证：传入的字母集合每个都至少出现一次
 * 策略：随机贪心 + 覆盖优先 + 失败重试；
 *      当「剩余空位 == 还没出现的字母数」时，强制只从缺失字母里挑，
 *      因此 6 步题正好是六字母各一次，8~20 步则是六字母全覆盖后再随机补足。
 * 冻结契约：第二参 allowedFaces 不传 = 全六字母（向后兼容）；'ruf' → ['R','U','F']。
 */
function buildFaceSequence(length, allowedFaces) {
  allowedFaces = allowedFaces || FACES;   // 不传 = 全六字母（老调用方不崩）
  for (let attempt = 0; attempt < 400; attempt++) {
    const seq = [];
    const missing = new Set(allowedFaces);   // 还没出现过的字母
    let failed = false;

    for (let i = 0; i < length; i++) {
      const slotsLeft = length - i;
      let pool;

      if (slotsLeft <= missing.size) {
        // 位置刚够（或不够）→ 只能补缺失字母，保证全覆盖
        pool = shuffleArr([...missing]);
      } else if (missing.size > 0 && Math.random() < 0.55) {
        // 还有余量时，55% 概率优先补没出现过的字母 → 分布更均匀
        pool = shuffleArr([...missing]).concat(shuffleArr(allowedFaces).filter(f => !missing.has(f)));
      } else {
        pool = shuffleArr(allowedFaces);
      }

      let picked = null;
      for (const f of pool) {
        if (isValidNext(seq, f)) { picked = f; break; }
      }
      if (picked === null) { failed = true; break; }  // 死路 → 重试

      seq.push(picked);
      missing.delete(picked);
    }

    if (!failed && missing.size === 0) return seq;
  }

  /* 兜底（几乎不会走到）：排列 + 按规则补齐 */
  const seq = shuffleArr(allowedFaces);
  for (let i = 1; i < seq.length; i++) {          // 拆散相邻的同轴对面
    if (AXIS_OPPOSITE[seq[i]] === seq[i - 1]) {
      for (let j = i + 1; j < seq.length; j++) {
        if (AXIS_OPPOSITE[seq[j]] !== seq[i - 1]) { [seq[i], seq[j]] = [seq[j], seq[i]]; break; }
      }
    }
  }
  while (seq.length < length) {
    const cands = shuffleArr(allowedFaces).filter(f => isValidNext(seq, f));
    seq.push(cands.length ? cands[0] : allowedFaces[Math.floor(Math.random() * allowedFaces.length)]);
  }
  return seq;
}

function generateScramble(length) {
  // 冻结契约：内部把 currentMoveSet 解析成 allowedFaces 透传给 buildFaceSequence
  const allowedFaces = currentMoveSet === 'ruf' ? ['R','U','F'] : FACES;
  const faces = buildFaceSequence(length, allowedFaces);
  return faces.map(face => {
    const mod = MODIFIERS[Math.floor(Math.random() * MODIFIERS.length)];
    const dir = mod === "'" ? -1 : (mod === '2' ? 2 : 1);
    return { face, dir, mod };
  });
}

/* 校验：当前公式是否已覆盖 R U F L B D 六个字母 */
function coveredFaces(moves) {
  return new Set((moves || []).map(m => m.face));
}

function movesToText(moves) {
  return moves.map(m => m.face + m.mod).join(' ');

const FACE_CN = { R:'右面', L:'左面', U:'顶层', D:'底层', F:'前层', B:'后层' };

function describeMove(m) {

  const dirCN = DIR_CN[m.dir] || (m.mod === "'" ? '逆时针90°' : (m.mod === '2' ? '180°' : '顺时针90°'));

  h = h || 0.5;
  let corners;
  if(which==='x') corners = [[x+h,y-h,z-h],[x+h,y+h,z-h],[x+h,y+h,z+h],[x+h,y-h,z+h]];
  else if(which==='y') corners = [[x-h,y+h,z-h],[x-h,y+h,z+h],[x+h,y+h,z+h],[x+h,y+h,z-h]];
  else corners = [[x-h,y-h,z+h],[x-h,y+h,z+h],[x+h,y+h,z+h],[x+h,y-h,z+h]];
  const pts = corners.map(p=>proj(cx,cy,p[0],p[1],p[2]));
  poly(ctx, pts);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = EDGE;
  ctx.stroke();
}
function markedFor(axis, layer){
  const idx = AXIS_IDX[axis];
  const out = [];
  for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
    const g=[x,y,z];
    if(g[idx]===layer && !(g[(idx+1)%3]===0 && g[(idx+2)%3]===0)) out.push(g);
  }
  return out;
}
function drawCube(ctx, cx, cy, axis, layer, size){
  size = size || 3;
  const coords = size === 2 ? [-1, 1] : [-1, 0, 1];
  const h = size === 2 ? 1 : 0.5;   // 二阶 cubie 边长翻倍，拼成无缝 2×2
  const marks = markedFor(axis, layer);
  const isM = (x,y,z)=>marks.some(g=>g[0]===x&&g[1]===y&&g[2]===z);
  const cubes=[];
  for(const x of coords)for(const y of coords)for(const z of coords) cubes.push([x,y,z]);
  cubes.sort((A,B)=>(A[0]+A[1]+A[2])-(B[0]+B[1]+B[2]));
  for(const [x,y,z] of cubes){
    const m = isM(x,y,z);
    if(x===1) face(ctx,cx,cy,x,y,z,'x', m?MARK:WHITE, h);
    if(z===1) face(ctx,cx,cy,x,y,z,'z', m?MARK:WHITE, h);
    if(y===1) face(ctx,cx,cy,x,y,z,'y', m?MARK:WHITE, h);
  }
}
/* 贴合表面直线箭头：从锚点沿 dir 画直线段，末端带箭头头 */
function lineArrow(ctx, cx, cy, anchor, dir, color, width){
  const L = 1.15; /* 箭头线段长度(3D 单位) · 放大使转动方向更醒目 */
  const p0 = proj(cx, cy, anchor[0], anchor[1], anchor[2]);
  const p1 = proj(cx, cy, anchor[0]+dir[0]*L, anchor[1]+dir[1]*L, anchor[2]+dir[2]*L);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.lineTo(p1[0], p1[1]);
  ctx.stroke();
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  const len = Math.hypot(dx,dy)||1;
  const ux = dx/len, uy = dy/len;
  const ang = Math.atan2(uy, ux);
  const hl = width*2.6;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(p1[0]+Math.cos(ang)*hl, p1[1]+Math.sin(ang)*hl);
  ctx.lineTo(p1[0]+Math.cos(ang+2.5)*hl*0.82, p1[1]+Math.sin(ang+2.5)*hl*0.82);
  ctx.lineTo(p1[0]+Math.cos(ang-2.5)*hl*0.82, p1[1]+Math.sin(ang-2.5)*hl*0.82);
  ctx.closePath();
  ctx.fill();
}
function drawArrow(ctx, cx, cy, arr){
  const [, anchor, dir] = arr;
  const width = Math.max(4, S*0.24);
  lineArrow(ctx, cx, cy, anchor, dir, ARROW, width);
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function buildLegend(movesSubset, size){
  const canvas = document.getElementById('legendCanvas');
  if(!canvas) return;
  // 冻结契约：可选 movesSubset（MOVES 子数组），不传 = 全部 12 个；size: 2=二阶 / 3=三阶
  const items = movesSubset && movesSubset.length ? movesSubset : MOVES;
  const cubeSize = (size === 2) ? 2 : 3;
  const COLS = items.length <= 6 ? 3 : 4;
  const ROWS = Math.ceil(items.length / COLS);
  const CUBE = 150, LAB = 42, PAD = 6, GAP = 20;
  const CARD_W = CUBE + PAD*2;
  const CARD_H = CUBE + LAB + PAD*2;
  const W = COLS*CARD_W + (COLS-1)*GAP;
  const H = ROWS*CARD_H + (ROWS-1)*GAP;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  // 整体底色透明：由外层 .legend-img-wrap 的深色背景（#0E1726）透出，避免白底白图看不清

  items.forEach((mv, i)=>{
    const col = i % COLS, row = (i/COLS)|0;
    const ox = col*(CARD_W+GAP), oy = row*(CARD_H+GAP);
    // 深色圆角卡片 + 外框
    roundRect(ctx, ox, oy, CARD_W, CARD_H, 14);
    ctx.fillStyle = CARD_BG;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = CARD_LINE;
    ctx.stroke();
    // 魔方 + 黄色箭头
    const cx = ox + CARD_W/2;
    const cy = oy + PAD + CUBE/2 + 2;
    drawCube(ctx, cx, cy, mv.axis, mv.layer, cubeSize);
    drawArrow(ctx, cx, cy, mv.arr);
    // 亮白粗体标签（卡片下方居中，字号放大）
    ctx.fillStyle = LABEL;
    ctx.font = '800 38px "Segoe UI", "Microsoft YaHei", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(mv.name, cx, oy + PAD + CUBE + LAB/2 + 2);
  });
  // 动态标题：二阶只显示 RUF 3 种，三阶显示 12 种
  const lbl = document.querySelector('.legend-zone .zone-label');
  if(lbl){
    lbl.innerHTML = '对照图 · ' + items.length + ' 种转动示意<span class="legend-caption">橙=顺时针 · 蓝=逆时针 · 灰=转动层</span>';
  }
}
// 暴露给 newQuestion 调用（T5 联动重绘对照图：2×2 只画 R/U/F 示意）
window.buildLegend = buildLegend;
window.MOVES = MOVES;
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ buildLegend(); });
}else{
  buildLegend();
}
})();
