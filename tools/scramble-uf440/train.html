<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/sync-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单式训练 - 440公式</title>
<link rel="stylesheet" href="/assets/css/site-nav.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site-layout.css">
<link rel="stylesheet" href="uf-common.css">
<style>
  .alg-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .alg-code { font-size: 42px; font-weight: 800; color: var(--fg); letter-spacing: 2px; }
  .alg-group-tag { font-size: 14px; color: var(--fg-3); }
  .alg-nav-btns { margin-left: auto; display: flex; gap: 8px; }
  .variant-bar { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; flex-wrap: wrap; }
  .variant-bar .v-btn {
    border: 1px solid var(--line, #cbd5e1); background: transparent; color: var(--fg);
    border-radius: 8px; padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  .variant-bar .v-btn:hover { background: rgba(100,180,255,0.18); }
  .variant-bar .v-idx { color: var(--fg-3); font-size: 12px; min-width: 90px; text-align: center; }
  .formula-block code { font-size: 17px; line-height: 1.7; word-break: break-word; }
  .session-dots { display: flex; gap: 8px; margin: 6px 0 10px; }
  .session-dots .dot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line, #cbd5e1);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--fg-3);
  }
  .session-dots .dot.done { background: var(--green, #22c55e); border-color: var(--green, #22c55e); color: #fff; }
  .session-dots .dot.cur { border-color: var(--amber, #f59e0b); color: var(--amber, #f59e0b); }
  .session-summary {
    border: 1px solid var(--amber, #f59e0b); background: rgba(245,158,11,0.10);
    border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 15px;
  }
  .session-summary b { font-size: 20px; }
  .alg-stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
  .alg-stats span { color: var(--fg-3); font-size: 13px; }
  .alg-stats b { color: var(--fg-2); font-size: 15px; }
  .session-history { margin-top: 8px; }
  .session-history .sh-item { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px;
    border-radius: 6px; background: rgba(100,180,255,0.14); font-size: 12px; }
</style>
</head>
<body data-nav="scramble-uf440">

<div data-site-nav></div>
<noscript><a href="/" style="display:block;padding:12px 20px">← 返回首页</a></noscript>

<div class="header">
  <h1>440 公式单式训练</h1>
  <div class="sub">一条公式独立练：按空格开始，一次性做完三次公式再按空格停止；总时长÷3 即为本次单式均速。颜色越红越慢，优先练「不合格 / 需关注」。</div>
</div>
<a class="back-link" href="index.html">← 返回 440 看板</a>
<span class="back-link" style="margin-left:12px" id="link-group"></span>

<div class="orientation-selector">
  <span class="orientation-label">拿法坐标系</span>
  <select id="orientationSelect">
    <option value="white-green">白顶绿前</option>
    <option value="yellow-red" selected>黄顶红前（默认）</option>
    <option value="yellow-blue">黄顶蓝前</option>
    <option value="yellow-green">黄顶绿前</option>
    <option value="yellow-orange">黄顶橘前</option>
  </select>
</div>

<div class="entries">
  <div class="entry single">
    <div class="entry-header">
      <span class="index" id="alg-order">-</span>
      <div class="alg-head">
        <span class="alg-code" id="alg-code">--</span>
        <span class="alg-group-tag" id="alg-group-tag"></span>
        <span class="alg-nav-btns">
          <button type="button" class="v-btn" id="prev-alg">← 上一式</button>
          <button type="button" class="v-btn" id="next-alg">下一式 →</button>
        </span>
      </div>
    </div>
    <div class="entry-body">
      <div class="diagram">
        <canvas class="ur-cube" id="cube" width="360" height="270"></canvas>
      </div>
      <div class="info-panel">
        <div class="variant-bar">
          <button type="button" class="v-btn" id="v-prev">◀</button>
          <span class="v-idx" id="v-idx">变体 1/1</span>
          <button type="button" class="v-btn" id="v-next">▶</button>
          <button type="button" class="v-btn" id="v-random">随机变体</button>
        </div>
        <div class="formula-block">
          <span class="label">执行公式（当前变体）</span>
          <code id="alg-text">加载中…</code>
        </div>
        <div class="formula-block">
          <span class="label">打乱公式（执行公式的逆序，拧完即复原）</span>
          <code id="scramble-text">加载中…</code>
        </div>
        <div class="session-dots" id="session-dots">
          <span class="dot cur">1</span><span class="dot">2</span><span class="dot">3</span>
        </div>
        <div class="timer-block" id="timer-block">
          <span class="label">计时器 · 一次性做完三次公式再按空格停止；总时长 ÷ 3 = 本次单式均速</span>
        </div>
        <div class="session-summary" id="session-summary" hidden></div>
        <div class="alg-stats" id="alg-stats"></div>
        <div class="session-history" id="session-history"></div>
        <div class="timer-actions" style="margin-top:10px">
          <button type="button" class="timer-btn timer-btn-del" id="btn-del">删除最近一次</button>
          <button type="button" class="timer-btn timer-btn-clear" id="btn-clear">清空该式全部成绩</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p class="site-footer__title">魔方先生SSR魔方训练中心</p>
  <p class="site-footer__meta">制作人：B站博主：魔方先生SSR　WCAID : 2009ZHAN24　抖音ID : 魔方总动员</p>
</footer>

<script src="/assets/js/site-nav.js"></script>
<script src="/assets/js/cube-net.js"></script>
<script src="alg440-data.js"></script>
<script>
(function () {
  'use strict';
  var TIMES_KEY = 'alg440_times';      // { code: [ms,...] 全部单次 }
  var SESSIONS_KEY = 'alg440_sessions';// { code: [[ms,ms,ms],...] 三连组 }
  var VARIANT_KEY = 'alg440_variant';  // { code: idx }
  var ALL = window.ALG440.all;
  var GROUPS = window.ALG440.groups;

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function load(key, fb) {
    try { return JSON.parse(localStorage.getItem(key)) || fb; } catch (e) { return fb; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function fmt(ms) {
    if (!isFinite(ms) || ms < 0) return '--:--.---';
    var total = Math.round(ms);
    var min = Math.floor(total / 60000);
    var sec = Math.floor((total % 60000) / 1000);
    var mill = total % 1000;
    return (min > 0 ? min + ':' : '') + (min > 0 ? String(sec).padStart(2, '0') : String(sec)) + '.' + String(mill).padStart(3, '0');
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---- 当前公式 ----
  var code = qs('alg');
  if (ALL.indexOf(code) < 0) code = ALL[0];
  var idx = ALL.indexOf(code);
  var variants = [];
  var vIdx = 0;

  var $code = document.getElementById('alg-code');
  var $order = document.getElementById('alg-order');
  var $gtag = document.getElementById('alg-group-tag');
  var $text = document.getElementById('alg-text');
  var $scr = document.getElementById('scramble-text');
  var $vidx = document.getElementById('v-idx');
  var $cvs = document.getElementById('cube');
  var $linkGroup = document.getElementById('link-group');

  function inverse(alg) {
    var tokens = String(alg).match(/[A-Za-z](?:2|')?/g) || [];
    var out = [];
    for (var i = tokens.length - 1; i >= 0; i--) {
      var t = tokens[i];
      if (t.length === 2 && t[1] === "'") out.push(t[0]);
      else if (t.length === 2 && t[1] === '2') out.push(t);
      else out.push(t + "'");
    }
    return out.join(' ');
  }
  function draw() {
    var scr = inverse(variants[vIdx]);
    $text.textContent = variants[vIdx];
    $scr.textContent = scr;
    $vidx.textContent = '变体 ' + (vIdx + 1) + '/' + variants.length;
    if (typeof drawScrambleNet !== 'undefined') {
      try { drawScrambleNet(scr, $cvs, currentOri()); } catch (e) {}
    }
  }
  function currentOri() {
    var sel = document.getElementById('orientationSelect');
    return sel ? sel.value : 'yellow-red';
  }
  function saveVariant() {
    var v = load(VARIANT_KEY, {});
    v[code] = vIdx;
    save(VARIANT_KEY, v);
  }

  function renderHead() {
    $code.textContent = code;
    var gi = -1, gLetter = '';
    for (var g in GROUPS) {
      var at = GROUPS[g].indexOf(code);
      if (at >= 0) { gi = at; gLetter = g; break; }
    }
    $order.textContent = (idx + 1) + ' / ' + ALL.length;
    $gtag.textContent = gLetter + '组 · 组内第 ' + (gi + 1) + ' 式';
    $linkGroup.innerHTML = gLetter
      ? '<a class="back-link" href="../scramble-uf/group-' + gLetter + '.html">← ' + gLetter + '组连拧页</a>'
      : '';
  }

  function loadVariants() {
    return fetch('../scramble-uf/edgeAlgToInfo.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function () {
        return fetch('https://blddb.net/assets/json/edgeAlgToInfo.json').then(function (r) { return r.json(); });
      })
      .then(function (data) {
        variants = data['A' + code] || [];
        if (!variants.length) variants = ['（未找到该式公式）'];
        var savedV = load(VARIANT_KEY, {});
        vIdx = Math.min(savedV[code] || 0, variants.length - 1);
        draw();
        renderStats();
      })
      .catch(function (e) {
        $text.textContent = '公式数据加载失败：' + e.message;
      });
  }

  // ---- 成绩：每次停表完成「三连做完后的一次性记录」，单式均速 = 总时长 / 3 ----
  function times()  { var t = load(TIMES_KEY, {}); return t[code] || []; }
  function sessions(){ var s = load(SESSIONS_KEY, {}); return migrateSession(s[code]); }
  function migrateSession(arr) {
    // 老数据：每项是一个三连的 [t1, t2, t3]；新代码：每项是一个数字（=三连均）
    // 一次性把老格式归一为单值序列，避免两种结构混用污染看板统计
    if (!arr || !arr.length) return [];
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      if (Array.isArray(it)) {
        if (!it.length) continue;
        var s = it.reduce(function (a, b) { return a + b; }, 0) / it.length;
        out.push(s);
      } else if (typeof it === 'number' && isFinite(it)) {
        out.push(it);
      }
    }
    return out;
  }
  // 单次三连：total ms → 写入 1 条记录 = total/3；三连组也只存 1 个值（=三次平均）
  function pushSession(totalMs) {
    var avg = totalMs / 3;
    var t = load(TIMES_KEY, {});
    if (!t[code]) t[code] = [];
    t[code].push(avg);
    save(TIMES_KEY, t);
    var s = load(SESSIONS_KEY, {});
    if (!s[code]) s[code] = [];
    s[code] = migrateSession(s[code]);
    s[code].push(avg);                  // 一个值代表本次三连的单式均速
    save(SESSIONS_KEY, s);
  }
  function popAttempt() {
    var t = load(TIMES_KEY, {});
    if (t[code] && t[code].length) { t[code].pop(); save(TIMES_KEY, t); }
    var s = load(SESSIONS_KEY, {});
    if (s[code] && s[code].length) {
      s[code] = migrateSession(s[code]);
      s[code].pop();
      save(SESSIONS_KEY, s);
    }
  }
  function clearAll() {
    var t = load(TIMES_KEY, {}); delete t[code]; save(TIMES_KEY, t);
    var s = load(SESSIONS_KEY, {}); delete s[code]; save(SESSIONS_KEY, s);
  }
  function renderStats() {
    var arr = times();
    var best = arr.length ? Math.min.apply(null, arr) : NaN;
    var avg  = arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : NaN;
    document.getElementById('alg-stats').innerHTML =
      '<span>最快单式 <b>' + fmt(best) + '</b></span>' +
      '<span>全部平均 <b>' + fmt(avg) + '</b></span>' +
      '<span>三连组数 <b>' + arr.length + '</b></span>';
    var ses = sessions();
    var sh = document.getElementById('session-history');
    if (!ses.length) { sh.innerHTML = '<span class="timer-empty">还没有三连组</span>'; return; }
    var parts = ['<span class="timer-recent-label">最近三连 · 单式均速</span>'];
    ses.slice(-8).forEach(function (v) {
      parts.push('<span class="sh-item">' + fmt(v) + '</span>');
    });
    sh.innerHTML = parts.join('');
  }

  // ---- 三连计时：一次性做完三次再停表 ----
  var $dots = document.getElementById('session-dots');
  var $summary = document.getElementById('session-summary');
  var sessionDone = false;   // 本次三连是否已记录（防止重复 push）
  function renderDots() {
    // 三连点全部置灰；只有完成一整组后才全部亮起
    var cls = 'dot' + (sessionDone ? ' done' : '');
    var html = '';
    for (var i = 0; i < 3; i++) html += '<span class="' + cls + '">' + (i + 1) + '</span>';
    $dots.innerHTML = html;
  }
  function onStop(ms) {
    if (sessionDone) return;          // 已记录过，忽略多余停止
    var avg = ms / 3;
    pushSession(ms);
    sessionDone = true;
    $summary.hidden = false;
    $summary.innerHTML =
      '总时长 <b>' + fmt(ms) + '</b>　÷ 3 = 单式均速 <b>' + fmt(avg) + '</b>' +
      '<br><span style="color:var(--fg-3);font-size:13px">一次性做完三次公式，总时间÷3 即为本次单式平均速度</span>';
    renderDots();
    renderStats();
  }
  function resetForNext() {
    sessionDone = false;
    $summary.hidden = true;
    renderDots();
    renderTimer();
  }

  // ---- 计时器（交互同连拧页：空格按住备用→松开开始；空格停止；右键取消） ----
  var block = document.getElementById('timer-block');
  var running = false, startTime = 0, raf = 0, prepTimer = 0, prepState = '';
  var display;
  function tick() {
    display.textContent = fmt(Date.now() - startTime);
    raf = requestAnimationFrame(tick);
  }
  function resetUI() {
    cancelAnimationFrame(raf);
    running = false;
    display.setAttribute('data-state', 'idle');
    display.textContent = fmt(0);
  }
  function startRun() {
    running = true;
    startTime = Date.now();
    display.setAttribute('data-state', 'running');
    tick();
  }
  function stopRun() {
    var ms = Date.now() - startTime;
    resetUI();
    onStop(ms);
    renderTimer();
  }
  function renderTimer() {
    display.textContent = fmt(0);
    display.setAttribute('data-state', 'idle');
    var label = '计时器 · 一次性做完三次公式再按空格停止；右键取消';
    if (sessionDone) label = '本次三连已记录 · 按住空格开始下一组';
    var t = block.querySelector('.timer-label-text');
    if (t) t.textContent = label;
  }
  function keydownSpace(e) {
    if (sessionDone) { resetForNext(); return; }
    if (running) { stopRun(); return; }
    if (prepState) { clearTimeout(prepTimer); }
    prepState = 'red';
    display.setAttribute('data-state', 'prep');
    prepTimer = setTimeout(function () {
      if (prepState === 'red') { prepState = 'green'; display.setAttribute('data-state', 'green'); }
    }, 500);
  }
  function keyupSpace(e) {
    if (sessionDone) return;
    if (!prepState) return;
    clearTimeout(prepTimer);
    if (prepState === 'green') { prepState = ''; startRun(); }
    else { prepState = ''; resetUI(); }
  }

  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    var isSpace = (e.code === 'Space') || (e.key === ' ') || (e.key === 'Spacebar');
    if (!isSpace) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    e.preventDefault();
    keydownSpace(e);
  });
  document.addEventListener('keyup', function (e) {
    var isSpace = (e.code === 'Space') || (e.key === ' ') || (e.key === 'Spacebar');
    if (!isSpace) return;
    if (e.target && e.target.tagName === 'INPUT') return;
    keyupSpace(e);
  });

  document.getElementById('btn-del').addEventListener('click', function () {
    popAttempt(); resetForNext();
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    if (!confirm('清空 ' + code + ' 的全部三连组成绩？')) return;
    clearAll(); resetForNext();
  });

  // ---- 变体 / 上一式 / 下一式 ----
  document.getElementById('v-prev').addEventListener('click', function () {
    if (variants.length < 2) return;
    vIdx = (vIdx - 1 + variants.length) % variants.length;
    saveVariant(); draw();
  });
  document.getElementById('v-next').addEventListener('click', function () {
    if (variants.length < 2) return;
    vIdx = (vIdx + 1) % variants.length;
    saveVariant(); draw();
  });
  document.getElementById('v-random').addEventListener('click', function () {
    if (variants.length < 2) return;
    var n = Math.floor(Math.random() * variants.length);
    if (n === vIdx) n = (n + 1) % variants.length;
    vIdx = n; saveVariant(); draw();
  });
  function gotoAlg(newCode) {
    location.href = 'train.html?alg=' + newCode;
  }
  document.getElementById('prev-alg').addEventListener('click', function () {
    gotoAlg(ALL[(idx - 1 + ALL.length) % ALL.length]);
  });
  document.getElementById('next-alg').addEventListener('click', function () {
    gotoAlg(ALL[(idx + 1) % ALL.length]);
  });

  // ---- 拿法切换 ----
  var sel = document.getElementById('orientationSelect');
  var valid = ['white-green', 'yellow-red', 'yellow-blue', 'yellow-green', 'yellow-orange'];
  try {
    var savedOri = localStorage.getItem('uf-orientation');
    if (savedOri && valid.indexOf(savedOri) >= 0) sel.value = savedOri;
  } catch (e) {}
  sel.addEventListener('change', function () {
    try { localStorage.setItem('uf-orientation', sel.value); } catch (e) {}
    draw();
  });

  // ---- init ----
  renderHead();
  renderDots();
  renderStats();
  // 必须先把 display 节点插入 #timer-block，再调 renderTimer() 写 label
  display = document.createElement('div');
  display.className = 'timer-display';
  display.setAttribute('data-state', 'idle');
  display.textContent = fmt(0);
  block.insertBefore(display, block.querySelector('.label').nextSibling);
  var lbl = document.createElement('span');
  lbl.className = 'timer-label-text';
  lbl.style.cssText = 'display:block;margin-top:6px;color:var(--fg-3);font-size:12px';
  block.appendChild(lbl);
  // display 节点就绪后再绑交互
  display.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    if (sessionDone) { resetForNext(); return; }
    if (!running) startRun(); else stopRun();
  });
  display.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (sessionDone) { resetForNext(); return; }
    resetUI();
  });
  renderTimer();
  loadVariants();

  if (window.SyncBoot) {
    SyncBoot.ready(function () {
      LSProvider.register({
        id: 'scramble-uf440',
        label: 'UF 单式训练',
        path: 'scramble-uf440.json',
        keys: ['alg440_times', 'alg440_sessions', 'alg440_variant']
      });
    });
  }
})();
</script>
</body>
</html>
