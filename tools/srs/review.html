<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/palette.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习 · 记忆卡片 · 魔方先生SSR魔方训练中心</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/site-nav.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site-layout.css">
<link rel="stylesheet" href="/tools/srs/srs.css?v=20261007c">
</head>
<body data-nav="srs">
<div data-site-nav></div>

<div class="srs-wrap">
  <div class="srs-progressline" id="prog">
    <span><a href="index.html" style="color:inherit;text-decoration:none">← 牌组</a></span>
    <span id="progText">加载中…</span>
    <span id="deckName"></span>
  </div>

  <div id="quiz" class="srs-quiz" hidden>
    <div class="srs-quiz__meta" id="qMeta"></div>
    <div class="srs-quiz__label" id="qLabel">看这边</div>
    <div class="srs-quiz__pic" id="qPic"></div>
    <div class="srs-quiz__q" id="qText"></div>
    <div class="srs-quiz__hint" id="qHint"></div>
    <div id="answerBox" hidden>
      <div class="srs-quiz__rule" style="margin:10px auto"></div>
      <div class="srs-quiz__label">答案</div>
      <div class="srs-quiz__en" id="aEn" hidden></div>
      <div class="srs-quiz__a" id="aText"></div>
      <div class="srs-quiz__pic" id="aPic"></div>
    </div>
  </div>

  <div class="srs-answerbar" id="showBar" hidden>
    <button class="btn btn--primary btn--lg" id="btnShow">显示答案（空格）</button>
  </div>

  <div class="srs-grades" id="grades" hidden></div>

  <div class="srs-kbdhint" id="kbdHint" hidden></div>

  <div id="doneBox" class="srs-panel" hidden style="text-align:center">
    <h3 class="srs-panel__title" id="doneTitle">本轮完成</h3>
    <p class="srs-panel__desc" id="doneDesc"></p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn--primary" id="btnAgainQueue" hidden>再练一轮</button>
      <button class="btn btn--ghost" id="btnRedoAll" hidden>全部重新学一遍</button>
      <a class="btn btn--ghost" href="index.html">返回牌组</a>
      <a class="btn btn--ghost" id="btnStat" href="#">查看统计</a>
    </div>
  </div>
</div>

<script src="js/sm2.js"></script>
<script src="js/db.js"></script>
<script src="data/assoc-words.js"></script>
<script src="data/raz-aa.js?v=20261007c"></script>
<script src="js/app.js?v=20261007c"></script>
<script src="/assets/js/sync-boot.js"></script>
<script src="js/sync-provider.js"></script>
<script>
(function () {
  var DB = window.SRSDB, SRS = window.SRS, SM2 = window.SM2;
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var deckId = q.get('deck');

  var deck = null, allCards = [], queue = [], relearn = [], sessionIds = [];
  var cur = null, shownAt = 0, answered = 0, correct = 0, sessionStart = Date.now();
  var revealed = false, total = 0;

  function start() {
    if (!deckId) { location.href = 'index.html'; return; }
    // 自检：RAZ 词表是否加载成功（未加载会导致所有卡无图）
    if (deckId.indexOf('raz-aa') === 0 && !(window.RAZ_AA && window.RAZ_AA.length)) {
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:12px 16px;background:#fff3cd;color:#8a6d3b;border-bottom:1px solid #ffe69c">' +
        '词表未加载（raz-aa.js），请强制刷新（Ctrl+F5）或清缓存重试。' +
        '<a href="index.html">返回</a></div>');
      return;
    }
    SRS.ensurePresets().then(function () {
      return Promise.all([DB.getDeck(deckId), DB.getCards(deckId)]);
    }).then(function (r) {
      deck = r[0]; allCards = r[1];
      if (!deck) { location.href = 'index.html'; return; }
      $('deckName').textContent = deck.name;
      $('btnStat').href = 'stats.html?deck=' + encodeURIComponent(deck.id);
      return SRS.buildQueue(deck, allCards);
    }).then(function (res) {
      if (!res) return;
      queue = res.cards.slice();
      total = queue.length;
      if (!total) return finish();
      next();
    }).catch(function (e) { alert('加载失败：' + e.message); console.error(e); });
  }

  function updateProg() {
    var left = queue.length + (cur ? 1 : 0);
    $('progText').textContent = '剩余 ' + left + ' / ' + total;
  }

  // 显示配图。注意：容器默认 display:none（CSS），必须显式设为 block；
  // 用 el.style.display = '' 只会清掉行内样式、回落到 CSS 的 none，导致图片永远看不见。
  function showEmoji(el, emoji) {
    el.innerHTML = '';
    if (!emoji) { el.style.display = 'none'; return; }
    el.textContent = emoji;
    el.style.display = 'block';
  }
  function renderPic(el, img, emoji) {
    el.innerHTML = '';
    el.textContent = '';
    if (!img) { showEmoji(el, emoji); return; }
    var i = document.createElement('img');
    // 统一转绝对路径：避免在不同层级的页面（index.html / review.html）
    // 解析相对路径时产生歧义，导致图片 404
    i.src = img.charAt(0) === '/'
      ? img
      : new URL(img, location.href.replace(/[^/]*$/, '')).href;
    i.alt = '';
    i.loading = 'eager';
    i.onerror = function () { showEmoji(el, emoji); };   // 图 404 时回退 emoji
    el.appendChild(i);
    el.style.display = 'block';
  }

  function next() {
    if (!queue.length) return finish();
    cur = queue.shift();
    if (cur && cur.id && sessionIds.indexOf(cur.id) < 0) sessionIds.push(cur.id);
    revealed = false;
    shownAt = Date.now();
    $('answerBox').hidden = true;
    $('grades').hidden = true;
    $('showBar').hidden = false;
    $('quiz').hidden = false;
    $('doneBox').hidden = true;
    $('kbdHint').hidden = false;
    $('kbdHint').textContent = '空格 / 回车：显示答案　·　Esc：退出';

    var cfg = SRS.deckCfg(deck);
    var meta = [];
    meta.push(cur.state === 'new' ? '新卡'
      : cur.state === 'review' ? '复习 · ' + cur.interval + '天'
      : (cur.state === 'relearning' ? '重练' : '学习中'));
    if (cur.head) meta.push(cur.head + ' 字头');
    if (cur.dir === 'w2c') meta.push('词→码');
    else if (cur.dir === 'c2w') meta.push('码→词');
    else if (cur.dir === 'en2zh') meta.push('英→中');
    $('qMeta').textContent = meta.join(' · ');

    $('qLabel').textContent = (deck && deck.type === 'assoc')
      ? '看字母，回忆联想词'
      : (deck && deck.type === 'raz' ? '看图片，说出单词' : '看这边');

    // RAZ 卡：正面只出图，不显示英文单词（看图说单词）；其他卡种照旧
    var isRaz = deck && deck.type === 'raz';
    var t = String(cur.front || '');
    var qt = $('qText');
    if (isRaz) {
      qt.textContent = '';
      qt.className = 'srs-quiz__q';
    } else {
      qt.textContent = t;
      qt.className = 'srs-quiz__q' + (t.length > 6 ? ' srs-quiz__q--sm' : '');
    }

    renderPic($('qPic'), cur.img, cur.emoji);

    var hint = cfg.showHint && cur.hint ? cur.hint : '';
    $('qHint').textContent = hint;

    // 答案区：RAZ 卡先给英文，再给中文
    var a = String(cur.back || '');
    $('aText').textContent = a || '（空）';
    $('aText').className = 'srs-quiz__a' + (a.length > 12 ? ' srs-quiz__a--sm' : '');
    var aEn = $('aEn');
    if (isRaz) {
      aEn.textContent = t;
      aEn.hidden = false;
    } else {
      aEn.textContent = '';
      aEn.hidden = true;
    }
    renderPic($('aPic'), cur.img, cur.emoji);

    buildGrades();
    updateProg();
  }

  /* ---------- 4 档评分按钮 ---------- */
  function buildGrades() {
    var box = $('grades');
    box.innerHTML = '';
    var pv = SM2.previewIntervals(cur, SRS.deckCfg(deck));
    pv.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'srs-grade srs-grade--' + ['again', 'hard', 'good', 'easy'][i];
      var key = document.createElement('span');
      key.className = 'srs-grade__key';
      key.textContent = String(i + 1);
      var k = document.createElement('span');
      k.className = 'srs-grade__k';
      k.textContent = p.label;
      var v = document.createElement('span');
      v.className = 'srs-grade__v';
      v.textContent = p.text;
      b.appendChild(key); b.appendChild(k); b.appendChild(v);
      b.addEventListener('click', function () { grade(i); });
      box.appendChild(b);
    });
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    $('answerBox').hidden = false;
    $('showBar').hidden = true;
    $('grades').hidden = false;
    $('kbdHint').textContent =
      '空格 / 回车：记住并下一张　·　1 重来　2 困难　3 良好　4 简单　·　Esc 退出';
  }

  function grade(g) {
    if (!cur || !revealed) return;
    var elapsed = Date.now() - shownAt;
    SRS.answer(cur, g, elapsed).then(function () {
      answered++;
      if (g > 0) correct++;
      if (g === 0) relearn.push(cur.id);
      cur = null;
      next();
    }).catch(function (e) { alert('保存失败：' + e.message); });
  }

  function finish() {
    cur = null;
    $('quiz').hidden = true;
    $('showBar').hidden = true;
    $('grades').hidden = true;
    $('kbdHint').hidden = true;
    $('doneBox').hidden = false;
    $('progText').textContent = '已完成';
    var mins = Math.max(1, Math.round((Date.now() - sessionStart) / 60000));
    $('doneDesc').textContent =
      '本轮 ' + answered + ' 张，正确率 ' + (answered ? Math.round(correct / answered * 100) : 0) +
      '%，用时约 ' + mins + ' 分钟。';
    if (relearn.length) {
      $('btnAgainQueue').hidden = false;
      $('btnAgainQueue').textContent = '再练一轮（' + relearn.length + ' 张答错的）';
    }
    // 本轮练过的全部卡片，可一键重学
    if (sessionIds.length) {
      $('btnRedoAll').hidden = false;
      $('btnRedoAll').textContent = '全部重新学一遍（本轮 ' + sessionIds.length + ' 张）';
    }
  }

  // 全部重新学一遍：不改 SM-2 评分，只把本轮出现过的卡再排一遍
  $('btnRedoAll').addEventListener('click', function () {
    var ids = sessionIds.slice();
    DB.getCards(deckId).then(function (cards) {
      var map = {};
      cards.forEach(function (c) { map[c.id] = c; });
      queue = ids.map(function (i) { return map[i]; }).filter(Boolean).reverse();
      if (!queue.length) return;
      total = queue.length; answered = 0; correct = 0;
      sessionIds = []; relearn = [];
      sessionStart = Date.now();
      $('doneBox').hidden = true;
      $('btnRedoAll').hidden = true;
      $('btnAgainQueue').hidden = true;
      next();
    });
  });

  $('btnShow').addEventListener('click', reveal);
  $('btnAgainQueue').addEventListener('click', function () {
    var ids = relearn.slice(); relearn = [];
    DB.getCards(deckId).then(function (cards) {
      var map = {}; cards.forEach(function (c) { map[c.id] = c; });
      queue = ids.map(function (i) { return map[i]; }).filter(Boolean);
      total = queue.length; answered = 0; correct = 0;
      sessionStart = Date.now();
      $('btnAgainQueue').hidden = true;
      next();
    });
  });

  /* ---------- 键盘优先：全程无需鼠标 ---------- */
  document.addEventListener('keydown', function (e) {
    if ($('quiz').hidden) return;
    if (e.key === 'Escape') { location.href = 'index.html'; return; }
    e.preventDefault();
    if (!revealed) {
      if (e.key === ' ' || e.key === 'Enter') reveal();
      return;
    }
    // 已显示答案：空格/回车 = 良好（快速通关），1-4 = 具体评分
    if (e.key === ' ' || e.key === 'Enter') { grade(SM2.GRADE.GOOD); return; }
    if (e.key >= '1' && e.key <= '4') { grade(parseInt(e.key, 10) - 1); return; }
  });
  // 鼠标用户：点击卡片区域翻面
  $('quiz').addEventListener('click', function () { if (!revealed) reveal(); });

  start();
})();
</script>
<script src="/assets/js/site-nav.js"></script>
</body>
</html>
