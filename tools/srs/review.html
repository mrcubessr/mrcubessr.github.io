<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="/assets/js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习 · 记忆卡片 · 魔方先生SSR魔方训练中心</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/site-nav.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site-layout.css">
<link rel="stylesheet" href="/tools/srs/srs.css">
</head>
<body data-nav="srs">
<div data-site-nav></div>

<div class="srs-wrap">
  <div class="srs-progressline" id="prog">
    <span><a href="index.html" style="color:inherit;text-decoration:none">← 牌组</a></span>
    <span id="progText">加载中…</span>
    <span id="deckName"></span>
  </div>

  <div id="quiz" class="srs-quiz" hidden>
    <div class="srs-quiz__meta" id="qMeta"></div>
    <div class="srs-quiz__label" id="qLabel">看这边</div>
    <div class="srs-quiz__q" id="qText"></div>
    <div class="srs-quiz__hint" id="qHint"></div>
    <div id="answerBox" hidden>
      <div class="srs-quiz__rule" style="margin:10px auto"></div>
      <div class="srs-quiz__label">答案</div>
      <div class="srs-quiz__a" id="aText"></div>
    </div>
    <div class="srs-mc" id="mcBox" hidden></div>
    <div class="srs-quiz__feedback" id="mcFeedback" hidden></div>
  </div>

  <div class="srs-answerbar" id="showBar" hidden>
    <button class="btn btn--primary btn--lg" id="btnShow">显示答案（空格）</button>
  </div>

  <div class="srs-grades" id="grades" hidden></div>

  <div class="srs-nextbar" id="nextBar" hidden>
    <button class="btn btn--primary btn--lg" id="btnNext">下一张（空格）</button>
    <button class="btn btn--ghost btn--lg" id="btnSkip">我不会</button>
  </div>

  <div id="doneBox" class="srs-panel" hidden style="text-align:center">
    <h3 class="srs-panel__title" id="doneTitle">本轮完成</h3>
    <p class="srs-panel__desc" id="doneDesc"></p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn--primary" id="btnAgainQueue" hidden>再练一轮</button>
      <a class="btn btn--ghost" href="index.html">返回牌组</a>
      <a class="btn btn--ghost" id="btnStat" href="#">查看统计</a>
    </div>
  </div>
</div>

<script src="js/sm2.js"></script>
<script src="js/db.js"></script>
<script src="data/assoc-words.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var DB = window.SRSDB, SRS = window.SRS, SM2 = window.SM2;
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var deckId = q.get('deck');

  var deck = null, allCards = [], queue = [], relearn = [];
  var cur = null, shownAt = 0, answered = 0, correct = 0, sessionStart = Date.now();
  var revealed = false, total = 0;
  var mcPool = [], mcAnswered = false, pendingGrade = null;

  function start() {
    if (!deckId) { location.href = 'index.html'; return; }
    SRS.ensurePresets().then(function () {
      return Promise.all([DB.getDeck(deckId), DB.getCards(deckId), DB.getAllCards()]);
    }).then(function (r) {
      deck = r[0]; allCards = r[1]; var all = r[2];
      if (!deck) { location.href = 'index.html'; return; }
      $('deckName').textContent = deck.name;
      $('btnStat').href = 'stats.html?deck=' + encodeURIComponent(deck.id);
      // 跨字头收集联想词池，用作选择题干扰项（排除非联想词牌组）
      var seen = {}, pool = [];
      all.forEach(function (c) {
        if (c.deckId && c.deckId.indexOf('assoc-3bld-') === 0 && c.back && !seen[c.back]) {
          seen[c.back] = 1; pool.push(c.back);
        }
      });
      mcPool = pool;
      return SRS.buildQueue(deck, allCards);
    }).then(function (res) {
      if (!res) return;
      queue = res.cards.slice();
      total = queue.length;
      if (!total) return finish();
      next();
    }).catch(function (e) { alert('加载失败：' + e.message); console.error(e); });
  }

  function updateProg() {
    var left = queue.length + (cur ? 1 : 0);
    $('progText').textContent = '剩余 ' + left + ' / ' + total;
  }

  function isMC() { return !!(deck && deck.type === 'assoc'); }

  function next() {
    if (!queue.length) return finish();
    cur = queue.shift();
    revealed = false;
    mcAnswered = false; pendingGrade = null;
    shownAt = Date.now();
    $('answerBox').hidden = true;
    $('mcFeedback').hidden = true;
    $('grades').hidden = true;
    $('showBar').hidden = true;
    $('nextBar').hidden = true;
    $('quiz').hidden = false;
    $('doneBox').hidden = true;
    $('mcBox').hidden = true;

    var cfg = SRS.deckCfg(deck);
    var meta = [];
    meta.push(cur.state === 'new' ? '新卡'
      : cur.state === 'review' ? '复习 · ' + cur.interval + '天'
      : (cur.state === 'relearning' ? '重练' : '学习中'));
    if (cur.head) meta.push(cur.head + ' 字头');
    if (cur.dir === 'w2c') meta.push('词→码');
    else if (cur.dir === 'c2w') meta.push('码→词');
    $('qMeta').textContent = meta.join(' · ');

    var t = String(cur.front || '');
    var qt = $('qText');
    qt.textContent = t;
    qt.className = 'srs-quiz__q' + (t.length > 6 ? ' srs-quiz__q--sm' : '');

    var hint = cfg.showHint && cur.hint ? cur.hint : '';
    $('qHint').textContent = hint;

    var a = String(cur.back || '');
    $('aText').textContent = a || '（空）';
    $('aText').className = 'srs-quiz__a' + (a.length > 12 ? ' srs-quiz__a--sm' : '');

    if (isMC()) {
      $('qLabel').textContent = '看字母，选出对应的联想词';
      buildMC(cur);
    } else {
      $('qLabel').textContent = '看这边';
      buildGrades();
      $('showBar').hidden = false;
    }
    updateProg();
  }

  /* ---------- 选择题作答 ---------- */
  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor((rnd ? rnd() : Math.random()) * (i + 1)); var x = arr[i]; arr[i] = arr[j]; arr[j] = x; } return arr; }

  function buildMC(card) {
    var correct = card.back;
    var distract = mcPool.filter(function (x) { return x !== correct; });
    var rnd = mulberry32(hashStr(card.id));
    shuffle(distract, rnd);
    var picks = distract.slice(0, Math.min(3, distract.length));
    var opts = picks.concat([correct]);
    shuffle(opts, rnd);
    var box = $('mcBox'); box.innerHTML = ''; box.hidden = false;
    opts.forEach(function (word, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'srs-mc__btn';
      var k = document.createElement('span'); k.className = 'srs-mc__k'; k.textContent = String.fromCharCode(65 + i);
      var txt = document.createElement('span'); txt.className = 'srs-mc__t'; txt.textContent = word;
      b.appendChild(k); b.appendChild(txt);
      b.addEventListener('click', function () { onPick(word === correct, b); });
      box.appendChild(b);
    });
  }

  function lockMC(correct) {
    var box = $('mcBox');
    Array.prototype.forEach.call(box.children, function (b) {
      b.classList.add('is-locked');
      if (b.querySelector('.srs-mc__t').textContent === correct) b.classList.add('is-correct');
    });
  }

  function onPick(isCorrect, btn) {
    if (mcAnswered) return;
    mcAnswered = true;
    lockMC(cur.back);
    if (isCorrect) btn.classList.add('is-correct'); else btn.classList.add('is-wrong');
    pendingGrade = isCorrect ? SM2.GRADE.GOOD : SM2.GRADE.AGAIN;
    $('aText').textContent = cur.back || '（空）';
    $('answerBox').hidden = false;
    showFeedback(isCorrect ? '✓ 正确，记住了' : '✗ 答错了，正确答案是上方绿色项', isCorrect ? 'is-ok' : 'is-bad');
    $('nextBar').hidden = false;
  }

  function skip() {
    if (mcAnswered) return;
    mcAnswered = true;
    lockMC(cur.back);
    pendingGrade = SM2.GRADE.AGAIN;
    $('aText').textContent = cur.back || '（空）';
    $('answerBox').hidden = false;
    showFeedback('已标记为「不会」，正确答案是上方绿色项', 'is-bad');
    $('nextBar').hidden = false;
  }

  function showFeedback(msg, cls) {
    var fb = $('mcFeedback');
    fb.textContent = msg;
    fb.className = 'srs-quiz__feedback ' + cls;
    fb.hidden = false;
  }

  function proceed() {
    if (!mcAnswered || pendingGrade === null) return;
    mcAnswered = false; pendingGrade = null;
    $('mcFeedback').hidden = true;
    grade(pendingGrade);
  }

  function mcBtnByLabel(label) {
    var box = $('mcBox');
    for (var i = 0; i < box.children.length; i++) {
      if (box.children[i].querySelector('.srs-mc__k').textContent === label) return box.children[i];
    }
    return null;
  }

  /* ---------- 经典模式（显示答案 + 评分） ---------- */
  function buildGrades() {
    var box = $('grades');
    box.innerHTML = '';
    var pv = SM2.previewIntervals(cur, SRS.deckCfg(deck));
    pv.forEach(function (p, i) {
      var b = document.createElement('button');
      b.className = 'srs-grade srs-grade--' + ['again', 'hard', 'good', 'easy'][i];
      var k = document.createElement('span');
      k.className = 'srs-grade__k';
      k.textContent = p.label;
      var v = document.createElement('span');
      v.className = 'srs-grade__v';
      v.textContent = p.text;
      b.appendChild(k); b.appendChild(v);
      b.addEventListener('click', function () { grade(i); });
      box.appendChild(b);
    });
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    $('answerBox').hidden = false;
    $('showBar').hidden = true;
    $('grades').hidden = false;
  }

  function grade(g) {
    if (!cur) return;
    var elapsed = Date.now() - shownAt;
    SRS.answer(cur, g, elapsed).then(function () {
      answered++;
      if (g > 0) correct++;
      if (g === 0) relearn.push(cur.id);
      cur = null;
      next();
    }).catch(function (e) { alert('保存失败：' + e.message); });
  }

  function finish() {
    cur = null;
    $('quiz').hidden = true;
    $('showBar').hidden = true;
    $('grades').hidden = true;
    $('nextBar').hidden = true;
    $('doneBox').hidden = false;
    $('progText').textContent = '已完成';
    var mins = Math.max(1, Math.round((Date.now() - sessionStart) / 60000));
    $('doneDesc').textContent =
      '本轮 ' + answered + ' 张，正确率 ' + (answered ? Math.round(correct / answered * 100) : 0) +
      '%，用时约 ' + mins + ' 分钟。';
    if (relearn.length) {
      $('btnAgainQueue').hidden = false;
      $('btnAgainQueue').textContent = '再练一轮（' + relearn.length + ' 张答错的）';
    }
  }

  $('btnShow').addEventListener('click', reveal);
  $('btnNext').addEventListener('click', proceed);
  $('btnSkip').addEventListener('click', skip);
  $('btnAgainQueue').addEventListener('click', function () {
    var ids = relearn.slice(); relearn = [];
    DB.getCards(deckId).then(function (cards) {
      var map = {}; cards.forEach(function (c) { map[c.id] = c; });
      queue = ids.map(function (i) { return map[i]; }).filter(Boolean);
      total = queue.length; answered = 0; correct = 0;
      sessionStart = Date.now();
      $('btnAgainQueue').hidden = true;
      next();
    });
  });

  document.addEventListener('keydown', function (e) {
    if ($('quiz').hidden) return;
    if (!mcAnswered && !$('mcBox').hidden) {
      // 选择题模式
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); skip(); }
      else if (/^[a-dA-D]$/.test(e.key)) { var b = mcBtnByLabel(e.key.toUpperCase()); if (b) { e.preventDefault(); b.click(); } }
      return;
    }
    if (mcAnswered && !$('mcBox').hidden) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); proceed(); }
      return;
    }
    // 经典模式
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!$('showBar').hidden) reveal(); }
    else if (e.key >= '1' && e.key <= '4' && !$('grades').hidden) { e.preventDefault(); grade(parseInt(e.key, 10) - 1); }
    else if (e.key === 'Escape') { location.href = 'index.html'; }
  });
  // 经典模式：点击卡片区域翻面（选择题模式不触发）
  $('quiz').addEventListener('click', function () { if ($('mcBox').hidden && !revealed) reveal(); });

  start();
})();
</script>
<script src="/assets/js/site-nav.js"></script>
</body>
</html>
